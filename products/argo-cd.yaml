apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: argo-cd
name: Argo CD
description: >-
  Declarative GitOps continuous delivery for Kubernetes. Ships one
  multi-component image, static install manifests with CRDs, CLI binaries
  and a community Helm chart (argo-helm) whose versions are independent of
  the application version and do not exist for every application release.
homepage: https://argo-cd.readthedocs.io

versioning:
  scheme: semver
  tagPrefix: v
  # vX.Y.Z and vX.Y.Z-rcN; odd legacy tags (v2.1.2-hf1, v2.2.8-1, stable,
  # gitops-engine/*) do not match.
  tagPattern: '^v(?P<version>\d+\.\d+\.\d+(?:-rc\d+)?)$'
  lineage: minor

sources:
  # --- canonical versions -------------------------------------------------
  - id: github-releases
    roles: [versions]
    priority: 0
    locator:
      kind: github-releases
      repository: argoproj/argo-cd
  - id: git-tags
    roles: [versions]
    priority: 1
    locator:
      kind: git-tags
      repository: github.com/argoproj/argo-cd

  # --- release notes ------------------------------------------------------
  # GoReleaser-generated GitHub release bodies (Breaking Changes / Features /
  # Bug fixes / ... groups) — only reachable through the GitHub API. The
  # in-repo CHANGELOG.md stopped at v2.4.8 and must not be used.
  - id: github-release-notes
    roles: [release-notes]
    priority: 0
    fallbackGroup: release-notes
    locator:
      kind: github-releases
      repository: argoproj/argo-cd
      ref: "{{.Tag}}"
    classify:
      - section: '(?i)^(documentation|other work)$'
        category: other
  # Deterministic fallback: the commit subjects the release notes are
  # generated from (conventional commits, e.g. "feat(appset)!: ...").
  - id: commit-log
    roles: [changelog]
    priority: 1
    fallbackGroup: release-notes
    locator:
      kind: git-log
      repository: github.com/argoproj/argo-cd
      ref: "{{.PrevTag}}..{{.Tag}}"
    classify:
      - text: '^(test|ci)(\(.+\))?:'
        skip: true
      # dependency bumps of test/UI tooling and CI actions are not part of
      # the shipped product
      - text: '^(chore|build)\(deps(-dev)?\): bump .+ in /(ui-test|ui|test|hack|docs)\b'
        skip: true
      - text: '^(chore|build)\(deps(-dev)?\): bump (actions|github|docker|SonarSource|codecov|softprops|azure|golangci|sigstore|slsa-framework)/'
        skip: true
      # private-fork security fixes land as merge commits
      - text: '^Merge (pull request|commit) from (GHSA-|fork)'
        category: security
      # release mechanics and docs-only commits are not upgrade-relevant
      - text: '^(chore(\(release\))?: )?Bump version to'
        skip: true
      - text: '^docs(\(.+\))?!?:'
        skip: true
      - text: '(?i)\bUSERS\.md\b'
        skip: true

  # --- upgrade guide ------------------------------------------------------
  # docs/operator-manual/upgrading/<prev>-<cur>.md; breaking items are "###"
  # sections with Detection/Remediation sub-sections.
  - id: upgrade-guide
    roles: [upgrade-guide]
    releaseKinds: [major, minor]
    locator:
      kind: repo-file
      repository: github.com/argoproj/argo-cd
      ref: "{{.Tag}}"
      path: docs/operator-manual/upgrading/{{.PrevMajor}}.{{.PrevMinor}}-{{.Major}}.{{.Minor}}.md
    classify:
      - section: '(?i)breaking changes'
        breaking: true
        actionRequired: true
      - section: '(?i)deprecated'
        category: deprecation
      - section: '(?i)security changes'
        category: security
    validatedAgainst: [3.0.0, 3.1.0, 3.5.0]

  # --- compatibility ------------------------------------------------------
  # Generated from the CI k3s matrix; only the row of the release's own line
  # is authoritative.
  - id: tested-kubernetes-versions
    roles: [compatibility]
    availability: ">= 2.8.0"
    locator:
      kind: repo-file
      repository: github.com/argoproj/argo-cd
      ref: "{{.Tag}}"
      path: docs/operator-manual/tested-kubernetes-versions.md
    extract:
      type: markdown-table
      keyColumns: [Argo CD version]
      keyMatch: '^{{regexQuote .Line}}$'
      columns:
        - platform: kubernetes
          kind: tested
          headers: [Kubernetes versions]

  # --- security -----------------------------------------------------------
  - id: github-advisories
    roles: [security]
    locator:
      kind: github-advisories
      repository: argoproj/argo-cd
    notes: Private-fork fixes land as "Merge pull request from GHSA-..." commits and do not appear in generated release notes.

artifacts:
  - id: image
    type: container-image
    name: argocd
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: quay.io/argoproj/argocd
    references:
      - artifact: install-manifest
        pattern: "quay.io/argoproj/argocd:{{.Tag}}"
    notes: ghcr.io/argoproj/argo-cd/argocd only carries master snapshots; Docker Hub is stale since v2.6.

  # Static install manifest at the tag; also the source of third-party image
  # pins (dex, redis) whose versions change within patch releases.
  - id: install-manifest
    type: manifest
    name: install.yaml
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: http
        url: https://raw.githubusercontent.com/argoproj/argo-cd/{{.Tag}}/manifests/install.yaml
    contents:
      - kind: image-refs
    notes: v2.14.0 and v3.0.10 reference the previous image tag (upstream errata); the image cross-reference fails there by design.

  - id: crds
    type: crd
    name: manifests/crds
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: http
        url: https://raw.githubusercontent.com/argoproj/argo-cd/{{.Tag}}/manifests/crds/application-crd.yaml
    contents:
      - kind: crds
        locator:
          kind: repo-dir
          repository: github.com/argoproj/argo-cd
          path: manifests/crds
          glob: "*-crd.yaml"

  # Community chart: chart version != app version; the chart for an app
  # release is found by appVersion. Many app releases never ship a chart.
  - id: helm-chart
    type: helm-chart
    name: argo-cd
    # Only ~half of the app releases ever ship as a chart appVersion
    # (76/144 since v2.11.0): absence is expected and recorded as a fact.
    optional: true
    version:
      strategy: lookup
      field: appVersion
      match: "{{.Tag}}"
      select: latest
    channels:
      - kind: helm-repo
        url: https://argoproj.github.io/argo-helm
        chart: argo-cd
      - kind: helm-repo
        url: https://raw.githubusercontent.com/argoproj/argo-helm/gh-pages
        chart: argo-cd
      - kind: oci
        repository: ghcr.io/argoproj/argo-helm/argo-cd
    contents:
      - kind: helm-values
        locator:
          kind: repo-file
          repository: github.com/argoproj/argo-helm
          ref: "argo-cd-{{.ArtifactVersion}}"
          path: charts/argo-cd/values.yaml
      - kind: chart-metadata
        locator:
          kind: repo-file
          repository: github.com/argoproj/argo-helm
          ref: "argo-cd-{{.ArtifactVersion}}"
          path: charts/argo-cd/Chart.yaml

  - id: cli-linux-amd64
    type: binary
    name: argocd-linux-amd64
    version: {strategy: template, template: "{{.Tag}}"}
    exceptions:
      - versions: [3.4.0]
        reason: >-
          v3.4.0 exists only as a git tag (plus rc1..rc7): it was never
          published as a GitHub release, so its assets (argocd-linux-amd64,
          cli_checksums.txt) 404 because the release object itself 404s
          (api releases/tags/v3.4.0 -> 404; the release list jumps from
          v3.4.0-rc7 to v3.4.1, which has 11 assets). Found by `ri check
          argo-cd` on 2026-10-01; corrected 2026-10-02 after the live re-run
          (docs/rerun/REPORT.md D2).
    channels:
      - kind: http
        url: https://github.com/argoproj/argo-cd/releases/download/{{.Tag}}/argocd-linux-amd64

provenance:
  method: manual+research
  updated: "2026-10-01"
  validatedReleases: [2.14.0, 3.0.0, 3.3.14, 3.4.9, 3.5.3]
  notes: >-
    Authored from docs/research/argo-cd.md. quay.io, argoproj.github.io and
    the GitHub API were unreachable; the chart index is read from the
    gh-pages branch and the image is cross-checked against install.yaml.

# Where this product reads its configuration, from its upstream documentation (semantic-4,
# LOOP-DIAGNOSIS-2 L1): every reference was fetched and its quote checked verbatim. Used by the
# learning loop's prompts only (docs/ARCHITECTURE.md, definition constructs); never from eval data.
configSources:
- id: argocd-cm
  channel: configmap-file
  component: argocd-server, argocd-repo-server, argocd-application-controller
  summary: 'General Argo CD settings are flat data keys of the fixed-name argocd-cm ConfigMap (labelled app.kubernetes.io/part-of:
    argocd); the argo-helm chart renders them from configs.cm.'
  configMap: argocd-cm
  valuesPath: configs.cm
  references:
  - url: https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/
    quote: General Argo CD configuration
  - url: https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/
    quote: For each specific kind of ConfigMap and Secret resource, there is only a single supported resource name
      (as listed in the above table)
  - url: https://raw.githubusercontent.com/argoproj/argo-helm/main/charts/argo-cd/values.yaml
    quote: '# General Argo CD configuration. Any values you put under `.configs.cm` are passed to argocd-cm ConfigMap.'
- id: argocd-rbac-cm
  channel: configmap-file
  component: argocd-server
  summary: RBAC policy is a CSV document in the policy.csv key (plus policy.default and additional policy.*.csv
    keys) of the argocd-rbac-cm ConfigMap; the chart renders it from configs.rbac.
  file: policy.csv
  format: csv
  configMap: argocd-rbac-cm
  valuesPath: configs.rbac
  references:
  - url: https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/
    quote: It is possible to provide additional entries in the argocd-rbac-cm configmap to compose the final policy
      csv.
  - url: https://raw.githubusercontent.com/argoproj/argo-helm/main/charts/argo-cd/values.yaml
    quote: '# -- Create the argocd-rbac-cm configmap with ([Argo CD RBAC policy]) definitions.'
- id: argocd-cmd-params-cm
  channel: configmap-file
  component: argocd-server, argocd-repo-server, argocd-application-controller
  summary: Component command-line options set as flat keys of the argocd-cmd-params-cm ConfigMap, prefixed per component
    (server., reposerver., controller.; unprefixed keys are shared) and injected as env variables; chart key configs.params.
  configMap: argocd-cmd-params-cm
  valuesPath: configs.params
  references:
  - url: https://argo-cd.readthedocs.io/en/stable/operator-manual/server-commands/additional-configuration-method/
    quote: The commands can also be configured by setting the respective flag of the available options in argocd-cmd-params-cm.yaml.
      Each component has a specific prefix associated with it.
  - url: https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/
    quote: Argo CD env variables configuration
  - url: https://raw.githubusercontent.com/argoproj/argo-helm/main/charts/argo-cd/values.yaml
    quote: '# -- Create the argocd-cmd-params-cm configmap'
- id: helm-values
  channel: helm-values
  summary: 'The community argo-helm argo-cd chart: product ConfigMaps under configs.* (cm, params, rbac), workload
    settings under per-component keys (controller, server, repoServer, ...).'
  valuesPath: .
  references:
  - url: https://raw.githubusercontent.com/argoproj/argo-helm/main/charts/argo-cd/values.yaml
    quote: '# General Argo CD configuration. Any values you put under `.configs.cm` are passed to argocd-cm ConfigMap.'
- id: controller-flags
  channel: cli-flags
  component: argocd-application-controller
  summary: Each Argo CD binary (argocd-application-controller, argocd-server, argocd-repo-server, ...) accepts command-line
    flags documented in the server-commands reference; most are also settable via argocd-cmd-params-cm.
  references:
  - url: https://argo-cd.readthedocs.io/en/stable/operator-manual/server-commands/argocd-application-controller/
    quote: This command runs Application Controller in the foreground. It can be configured by following options.
  - url: https://argo-cd.readthedocs.io/en/stable/operator-manual/server-commands/argocd-application-controller/
    quote: --app-resync int Time period in seconds for application resync. (default 120)
