apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: cert-manager
name: cert-manager
description: >-
  X.509 certificate management controller for Kubernetes and OpenShift.
  Ships as a set of controller images, static install manifests, a CRD
  bundle and a Helm chart, all versioned with the git tag (v-prefixed).
homepage: https://cert-manager.io

versioning:
  scheme: semver
  tagPrefix: v
  # Stable and -alpha.N/-beta.N tags; cmd/ctl/* submodule tags and the legacy
  # v0.15-alpha.3 tag do not match and are ignored.
  tagPattern: '^v(?P<version>\d+\.\d+\.\d+(?:-(?:alpha|beta)\.\d+)?)$'
  # release-X.Y branches are maintained in parallel; X.Y.0 notes describe the
  # changes since the previous line.
  lineage: minor

sources:
  # --- canonical versions -------------------------------------------------
  - id: github-releases
    roles: [versions]
    priority: 0
    locator:
      kind: github-releases
      repository: cert-manager/cert-manager
    notes: Preferred (publish dates, prerelease flags). Requires GitHub API access.
  - id: git-tags
    roles: [versions]
    priority: 1
    locator:
      kind: git-tags
      repository: github.com/cert-manager/cert-manager
    notes: Fallback when the GitHub API is unreachable; tags are authoritative.

  # --- release notes ------------------------------------------------------
  # One file per minor in the website repo; each patch release is a section
  # headed `v1.18.0` (backticks optional). Valid since 1.5.
  - id: website-release-notes
    roles: [release-notes]
    priority: 0
    fallbackGroup: release-notes
    availability: ">= 1.5.0"
    locator:
      kind: repo-file
      repository: github.com/cert-manager/website
      ref: master
      path: content/docs/releases/release-notes/release-notes-{{.Major}}.{{.Minor}}.md
    extract:
      type: markdown-section
      heading: '^v?{{regexQuote .Version}}$'
    validatedAgainst: [1.16.0, 1.17.0, 1.18.0, 1.19.0, 1.20.0, 1.21.0]
  - id: github-release-notes
    roles: [release-notes]
    priority: 1
    fallbackGroup: release-notes
    locator:
      kind: github-releases
      repository: cert-manager/cert-manager
      ref: "{{.Tag}}"
    notes: Same content as the website notes; used when the website file is missing.

  # Minor releases carry their headline and breaking changes in a
  # "Major Themes" section at the top of the per-minor notes file, flagged
  # with "⚠️ Breaking change" / "Potentially breaking change" callouts.
  - id: website-major-themes
    roles: [release-notes]
    releaseKinds: [major, minor]
    availability: ">= 1.5.0"
    locator:
      kind: repo-file
      repository: github.com/cert-manager/website
      ref: master
      path: content/docs/releases/release-notes/release-notes-{{.Major}}.{{.Minor}}.md
    extract:
      type: markdown-section
      heading: '^Major Themes$'
    classify:
      # anchored to the callout ("> ⚠️ Breaking change" / "> ⚠️ Potentially
      # breaking change"); prose such as "reduced risk of breaking changes"
      # must not match
      - text: '(?i)⚠\S*\s*(potentially\s+)?breaking change'
        breaking: true
        actionRequired: true

  # 1.16's notes file additionally carries a dedicated "Breaking changes"
  # section (only that minor): the OperatorHub discontinuation lives there,
  # outside Themes.
  - id: website-breaking-changes
    roles: [release-notes]
    availability: ">= 1.16.0, < 1.17.0"
    locator:
      kind: repo-file
      repository: github.com/cert-manager/website
      ref: master
      path: content/docs/releases/release-notes/release-notes-{{.Major}}.{{.Minor}}.md
    extract:
      type: markdown-section
      heading: '^Breaking [Cc]hanges$'
    classify:
      - text: '(?i)discontinued|no longer publish'
        breaking: true
        actionRequired: true

  # --- upgrade guides -----------------------------------------------------
  - id: upgrade-guide
    roles: [upgrade-guide]
    releaseKinds: [major, minor]
    # Each guide opens with "please read the following important notes about
    # breaking changes": the top-level numbered items under that lead-in (no
    # heading) and "Potentially Breaking: ..." sections are breaking; advice
    # sections ("Use the latest patch version", "Next Steps") are not.
    classify:
      - section: '(?i)^next steps$'
        skip: true
      - section: '^$'
        breaking: true
      - section: '(?i)breaking'
        breaking: true
    locator:
      kind: repo-file
      repository: github.com/cert-manager/website
      ref: master
      path: content/docs/releases/upgrading/upgrading-{{.PrevMajor}}.{{.PrevMinor}}-{{.Major}}.{{.Minor}}.md
    notes: Exists for every minor except 1.13 (covered by upgrading-1.12.md, an LTS special case).
    validatedAgainst: [1.14.0, 1.15.0, 1.16.0, 1.17.0, 1.18.0, 1.19.0, 1.20.0, 1.21.0]

  # --- compatibility ------------------------------------------------------
  # Two tables with different headers: "supported/upcoming" releases use a
  # combined "Kubernetes / OpenShift" column; "old releases" use separate
  # "Compatible ..." columns. Release cells are reference links ([1.18][]).
  - id: supported-releases
    roles: [compatibility]
    locator:
      kind: repo-file
      repository: github.com/cert-manager/website
      ref: master
      path: content/docs/releases/README.md
    extract:
      type: markdown-table
      keyColumns: [Release]
      keyMatch: '^{{regexQuote .Line}}(\s|$)'
      columns:
        - platform: kubernetes
          kind: supported
          headers: [Supported Kubernetes / OpenShift Versions]
          separator: /
          part: 0
        - platform: openshift
          kind: supported
          headers: [Supported Kubernetes / OpenShift Versions]
          separator: /
          part: 1
        - platform: kubernetes
          kind: supported
          headers: [Compatible Kubernetes versions]
        - platform: openshift
          kind: supported
          headers: [Compatible OpenShift versions]
        - platform: kubernetes
          kind: tested
          headers: [Tested Kubernetes Versions]

  # --- security -----------------------------------------------------------
  - id: github-advisories
    roles: [security]
    locator:
      kind: github-advisories
      repository: cert-manager/cert-manager
    notes: Repository security advisories (GHSA). Fixes are also called out in release notes as "Security (HIGH|MODERATE)".
  - id: global-advisories
    roles: [security]
    locator:
      kind: github-global-advisories
      ecosystem: go
      package: github.com/cert-manager/cert-manager
    notes: Reviewed advisories of the GitHub global advisory database for the main Go module of the shipped binary (identity rule in docs/SECURITY_ADVISORIES.md).

artifacts:
  # Static install manifest attached to every GitHub release. It references
  # the controller, webhook, cainjector and acmesolver images by tag, which
  # makes it the cross-reference used when quay.io cannot be reached.
  - id: install-manifest
    type: manifest
    name: cert-manager.yaml
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: http
        url: https://github.com/cert-manager/cert-manager/releases/download/{{.Tag}}/cert-manager.yaml
    contents:
      - kind: image-refs
    validatedAgainst: [1.12.17, 1.13.6, 1.14.7, 1.15.5, 1.16.5, 1.17.4, 1.18.6, 1.19.6, 1.20.4, 1.21.2]

  - id: crds
    type: crd
    name: cert-manager.crds.yaml
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: http
        url: https://github.com/cert-manager/cert-manager/releases/download/{{.Tag}}/cert-manager.crds.yaml
    contents:
      - kind: crds
    validatedAgainst: [1.12.17, 1.16.5, 1.17.4, 1.18.6, 1.19.6, 1.20.4, 1.21.2]

  # Chart version == appVersion == git tag (set by make/manifests.mk at
  # release time); the in-repo Chart file is a template with v0.0.0.
  - id: helm-chart
    type: helm-chart
    name: cert-manager
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: helm-repo
        url: https://charts.jetstack.io
        chart: cert-manager
      - kind: oci
        repository: quay.io/jetstack/charts/cert-manager
    contents:
      - kind: helm-values
        locator:
          kind: repo-file
          repository: github.com/cert-manager/cert-manager
          path: deploy/charts/cert-manager/values.yaml
      - kind: chart-metadata
        availability: "< 1.21.0"
        locator:
          kind: repo-file
          repository: github.com/cert-manager/cert-manager
          path: deploy/charts/cert-manager/Chart.template.yaml
      - kind: chart-metadata
        availability: ">= 1.21.0"
        locator:
          kind: repo-file
          repository: github.com/cert-manager/cert-manager
          path: deploy/charts/cert-manager/Chart.yaml
    notes: >-
      Image value keys changed in 1.20 (per-component repository →
      imageRegistry/imageNamespace/name). kubeVersion (">= 1.22.0-0") is a
      static install guard, not the support matrix.

  - id: controller-image
    type: container-image
    name: cert-manager-controller
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: quay.io/jetstack/cert-manager-controller
    references:
      - artifact: install-manifest
        pattern: "quay.io/jetstack/cert-manager-controller:{{.Tag}}"

  - id: webhook-image
    type: container-image
    name: cert-manager-webhook
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: quay.io/jetstack/cert-manager-webhook
    references:
      - artifact: install-manifest
        pattern: "quay.io/jetstack/cert-manager-webhook:{{.Tag}}"

  - id: cainjector-image
    type: container-image
    name: cert-manager-cainjector
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: quay.io/jetstack/cert-manager-cainjector
    references:
      - artifact: install-manifest
        pattern: "quay.io/jetstack/cert-manager-cainjector:{{.Tag}}"

  - id: acmesolver-image
    type: container-image
    name: cert-manager-acmesolver
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: quay.io/jetstack/cert-manager-acmesolver
    references:
      # passed to the controller as --acme-http01-solver-image=...
      - artifact: install-manifest
        pattern: "quay.io/jetstack/cert-manager-acmesolver:{{.Tag}}"

  - id: startupapicheck-image
    type: container-image
    name: cert-manager-startupapicheck
    availability: ">= 1.14.0"
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: quay.io/jetstack/cert-manager-startupapicheck
    notes: Not referenced by the static manifest (rendered with startupapicheck disabled).

  - id: ctl-image
    type: container-image
    name: cert-manager-ctl
    availability: "< 1.15.0"
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: quay.io/jetstack/cert-manager-ctl
    notes: Replaced by startupapicheck; cmctl moved to the cert-manager/cmctl repository.

provenance:
  method: manual+research
  updated: "2026-10-01"
  validatedReleases: [1.16.5, 1.17.4, 1.18.6, 1.19.6, 1.20.4, 1.21.2]
  notes: >-
    Authored from docs/research/cert-manager.md (channels verified against
    git tags, raw repository content and release assets). quay.io,
    charts.jetstack.io and the GitHub API were unreachable during research;
    image relationships were validated through the install manifest.
    Corrected 2026-10-02 after live re-run (docs/rerun/REPORT.md):
    charts.jetstack.io, quay.io and the GitHub API are reachable; chart and
    all images validate directly (0 unverifiable).

# Where this product reads its configuration, from its upstream documentation (semantic-4,
# LOOP-DIAGNOSIS-2 L1): every reference was fetched and its quote checked verbatim. Used by the
# learning loop's prompts only (docs/ARCHITECTURE.md, definition constructs); never from eval data.
configSources:
- id: helm-values
  channel: helm-values
  summary: 'The official cert-manager chart: controller settings at the chart root (config, featureGates, extraArgs,
    ...), other components under webhook.*, cainjector.*, acmesolver.*.'
  valuesPath: .
  references:
  - url: https://cert-manager.io/docs/installation/configuring-components/
    quote: When using the Helm chart, the CLI flags can be specified in the extraArgs, webhook.extraArgs, cainjector.extraArgs
      and acmesolver.extraArgs values.
  - url: https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/charts/cert-manager/values.yaml
    quote: '# Additional command line flags to pass to cert-manager controller binary.'
- id: controller-config
  channel: configmap-file
  component: controller
  summary: 'A ControllerConfiguration (controller.config.cert-manager.io/v1alpha1) YAML file read via --config;
    the chart renders the config value into the config.yaml key of a ConfigMap (webhook: WebhookConfiguration via
    webhook.config). CLI flags take precedence.'
  file: config.yaml
  format: yaml
  valuesPath: config
  references:
  - url: https://cert-manager.io/docs/installation/configuring-components/
    quote: The configuration file can be specified using the --config CLI flag. When using the Helm chart, the
  - url: https://cert-manager.io/docs/installation/configuring-components/
    quote: The CLI flags take precedence over the configuration file.
  - url: https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/charts/cert-manager/templates/controller-config.yaml
    quote: 'config.yaml: |'
  - url: https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/charts/cert-manager/values.yaml
    quote: '# This allows setting options that would usually be provided using flags.'
- id: feature-gates
  channel: feature-gates
  component: controller
  summary: Per-component feature gates via --feature-gates or featureGates in the config file; chart keys featureGates
    (controller) and webhook.featureGates (webhook; since v1.13 the root key no longer reaches the webhook).
  flag: --feature-gates
  valuesPath: featureGates
  references:
  - url: https://cert-manager.io/docs/installation/configuring-components/
    quote: They can be enabled/ disabled using the --feature-gates flag or the featureGates value in the config
      file.
  - url: https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/charts/cert-manager/values.yaml
    quote: '# A comma-separated list of feature gates that should be enabled on the'
- id: controller-flags
  channel: cli-flags
  component: controller
  summary: cert-manager-controller command-line flags (also webhook, cainjector, acmesolver); passed via the chart's
    extraArgs / <component>.extraArgs.
  references:
  - url: https://cert-manager.io/docs/cli/controller/
    quote: --config string Path to a file containing a ControllerConfiguration object used to configure the controller
  - url: https://cert-manager.io/docs/installation/configuring-components/
    quote: To configure the cert-manager components, you can use CLI flags or a configuration file.

# Upstream-documented object relationships followed by the investigation's
# relationship graph (docs/INVESTIGATE.md "Relationships"). Release-level facts
# from the cert-manager API field documentation, not from any environment.
relationships:
- id: certificate-secret
  kind: produces
  from: {group: cert-manager.io, kind: Certificate}
  to: {kind: Secret}
  path: spec.secretName
  summary: A Certificate's controller creates and manages the Secret named by spec.secretName, in the Certificate's namespace.
  references:
  - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/pkg/apis/certmanager/v1/types_certificate.go
    quote: Name of the Secret resource that will be automatically created and managed by this Certificate resource.
- id: issuer-ca-secret
  kind: references
  from: {group: cert-manager.io, kind: Issuer}
  to: {kind: Secret}
  path: spec.ca.secretName
  summary: A CA Issuer signs with the key pair held in the Secret named by spec.ca.secretName, in the Issuer's namespace.
  references:
  - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/pkg/apis/certmanager/v1/types_issuer.go
    quote: SecretName is the name of the secret used to sign Certificates issued by this Issuer.
- id: clusterissuer-ca-secret
  kind: references
  from: {group: cert-manager.io, kind: ClusterIssuer}
  to: {kind: Secret}
  path: spec.ca.secretName
  summary: A CA ClusterIssuer signs with the Secret named by spec.ca.secretName, which cert-manager reads from its cluster resource namespace (the controller's --cluster-resource-namespace; not stated on the issuer).
  # The docs' "by default, this namespace is cert-manager" describes the chart, which always passes
  # --cluster-resource-namespace=$(POD_NAMESPACE); the binary's own default (no flag) is kube-system.
  namespaceFrom:
    container: cert-manager-controller
    arg: --cluster-resource-namespace
    default: kube-system
    configFileArg: --config
    references:
    - url: https://github.com/cert-manager/website/blob/2e32a5efc7a4ef284e271f54ac1b15e800e66fcc/content/docs/configuration/README.md
      quote: when referencing a secret via the `secretName` field, secrets will be looked for in the `Cluster Resource Namespace`.
    - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/cmd/controller/app/options/options.go
      quote: Namespace to store resources owned by cluster scoped resources such as ClusterIssuer in.
    - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/internal/apis/config/controller/v1alpha1/defaults.go
      quote: defaultClusterResourceNamespace = "kube-system"
    - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/deploy/charts/cert-manager/templates/deployment.yaml
      quote: '- --cluster-resource-namespace=$(POD_NAMESPACE)'
    - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/deploy/charts/cert-manager/templates/deployment.yaml
      quote: '- name: {{ .Chart.Name }}-controller'
    - url: https://cert-manager.io/docs/installation/configuring-components/
      quote: The CLI flags take precedence over the configuration file.
  references:
  - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/pkg/apis/certmanager/v1/types_issuer.go
    quote: SecretName is the name of the secret used to sign Certificates issued by this Issuer.
- id: certificate-cluster-issuer
  kind: references
  from: {group: cert-manager.io, kind: Certificate}
  to: {group: cert-manager.io, kind: ClusterIssuer}
  scope: cluster
  path: spec.issuerRef.name
  whenPath: spec.issuerRef.kind
  whenEquals: ClusterIssuer
  summary: A Certificate whose issuerRef.kind is ClusterIssuer is issued by the cluster-scoped ClusterIssuer of that name, usable from any namespace.
  references:
  - url: https://github.com/cert-manager/cert-manager/blob/v1.18.0/pkg/apis/certmanager/v1/types_certificate.go
    quote: If the issuer is cluster-scoped, it can be used from any namespace.

# Object kinds the controller this product ships reconciles (docs/INVESTIGATE.md "Relationships":
# the exposure of controller-behaviour changes). Release-level, from upstream documentation.
reconciles:
- id: certificates
  kinds:
  - {group: cert-manager.io, kind: Certificate}
  - {group: cert-manager.io, kind: CertificateRequest}
  summary: cert-manager turns every Certificate into a private key and CertificateRequests, stores the signed certificate in a Secret and renews it.
  references:
  - url: https://github.com/cert-manager/website/blob/2e32a5efc7a4ef284e271f54ac1b15e800e66fcc/content/docs/usage/certificate.md
    quote: cert-manager uses this input to generate a private key
  - url: https://github.com/cert-manager/website/blob/2e32a5efc7a4ef284e271f54ac1b15e800e66fcc/content/docs/usage/certificaterequest.md
    quote: The `CertificateRequest` is a namespaced resource in cert-manager that is used
- id: issuers
  kinds:
  - {group: cert-manager.io, kind: Issuer}
  - {group: cert-manager.io, kind: ClusterIssuer}
  summary: Issuers and ClusterIssuers are the certificate authorities cert-manager signs requests with; the controller keeps their Ready condition.
  references:
  - url: https://github.com/cert-manager/website/blob/2e32a5efc7a4ef284e271f54ac1b15e800e66fcc/content/docs/concepts/issuer.md
    quote: '`Issuers`, and `ClusterIssuers`, are Kubernetes resources that represent'
