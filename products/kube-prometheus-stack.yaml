apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: kube-prometheus-stack
name: kube-prometheus-stack
description: >-
  The kube-prometheus-stack Helm chart (prometheus-community/helm-charts): a
  chart that aggregates the Prometheus Operator stack — prometheus-operator
  (appVersion), Prometheus, Alertmanager, Grafana, kube-state-metrics and
  prometheus-node-exporter — with dashboards and rules, and ships the
  operator's CRDs. The product IS the chart: one monorepository publishes ~44
  charts, each with its own tag family (kube-prometheus-stack-NdN.N.N, 1151
  stable tags, no pre-releases) and one shared Helm repository; every chart
  major signals a breaking change (usually a CRD update). The sub-components
  are pinned per chart release in Chart.yaml (dependencies, appVersion) and
  values.yaml (image tags).
homepage: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

versioning:
  scheme: semver
  # The chart's own version is the release; the ~2350 tags of the sibling
  # charts (prometheus-*, alertmanager-*, kube-state-metrics-*, ...) do not
  # match and are ignored.
  tagPrefix: kube-prometheus-stack-
  # Chart majors are throwaway lines: 91.x builds on 90.x, minors of one
  # major are sequential and not maintained in parallel.
  lineage: minor

sources:
  # --- canonical versions -------------------------------------------------
  - id: git-tags
    roles: [versions]
    priority: 0
    locator:
      kind: git-tags
      repository: github.com/prometheus-community/helm-charts
    notes: >-
      1151 stable tags (9.3.4 - 91.8.2), no pre-releases. Three tags were
      never published to the Helm repository (14.6.3, 18.0.4, 19.2.0); the
      tag list is the superset, so it is canonical.
  - id: helm-index
    roles: [versions]
    priority: 1
    locator:
      kind: helm-repo
      url: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
    notes: >-
      The shared gh-pages index (1148 KPS entries; verified reachable from
      this sandbox, unlike most *.github.io hosts).

  # --- release notes --------------------------------------------------------
  # One GitHub release per chart tag, created by the release workflow: the
  # chart description plus "What's Changed" bullets with exactly this chart's
  # PRs (mostly Renovate dependency bumps) and a compare link. Fetched per
  # tag (one API request); listing all releases of the monorepo instead would
  # page through ~3500 of them. git-log A..B was rejected as a fallback: the
  # range interleaves sibling-chart commits and classify rules cannot express
  # "not [kube-prometheus-stack]" without lookahead (see record).
  - id: github-release-notes
    roles: [release-notes]
    locator:
      kind: github-releases
      repository: prometheus-community/helm-charts
      ref: "{{.Tag}}"
    classify:
      # the chart description that opens every release body
      - text: '^kube-prometheus-stack collects Kubernetes manifests'
        skip: true
      - text: '\*\*Full Changelog\*\*'
        skip: true
      # repository machinery that the chart's release range happens to
      # include (the workflow's compare window is not chart-path filtered)
      - text: '^\[(?:CI|Docs?|repo|chore|-renovate)[\]:]'
        skip: true
      # Renovate's pins, per release: "[kube-prometheus-stack] Update grafana
      # Docker tag to v13.2.7 (#7336)"
      - section: '^What''s Changed$'
        text: '(?i)^\[kube-prometheus-stack\] (?:Update|Bump) .*(?:Docker tag|helm|chart|prometheus-operator|dependency)'
        category: dependency
      - section: '^What''s Changed$'
        text: '(?i)\bCVE-\d{4}-\d+|security'
        category: security
      - section: '^What''s Changed$'
        text: '(?i)^\[kube-prometheus-stack\] (?:(?:Add|Support|Introduce|Enable|Include|Allow|Use|Provision) )'
        category: feature
      - section: '^What''s Changed$'
        text: '(?i)^\[kube-prometheus-stack\] (?:Fix|Correct|Resolve|Prevent|Restore|Revert) '
        category: bugfix
      - section: '^What''s Changed$'
        text: '(?i)\b(?:rename[ds]?|remov(?:e|ed)|no longer|incompatible|breaking)\b'
        breaking: true
      # a changed default is the chart's way of shipping a behaviour change
      - section: '^What''s Changed$'
        text: '(?i)\b(?:disable|enable|turn(?:ing)? (?:on|off))\b.{0,60}\bby default\b'
        breaking: true
      - section: '^What''s Changed$'
        category: other

  # --- the pinned operator's own notes --------------------------------------
  # The chart bundles the operator, but the operator's behavioural changes
  # ([CHANGE] entries — how Alertmanager/ScrapeConfig resources are accepted)
  # live in the OPERATOR's release notes at the PINNED tag, not in the chart's
  # own notes. {{.ArtifactVersionOf "prometheus-operator-image"}} renders the
  # Chart.yaml appVersion pin (v-prefixed since 44.0.0, the operator's own tag
  # format) into the release ref, so this source reads the notes of the exact
  # operator version the chart ships. Same availability window as the pin
  # artifact; when the pin does not resolve for a release, the source is
  # skipped/unavailable with the pin's reason, never a wrong tag.
  - id: operator-release-notes
    roles: [release-notes]
    availability: ">= 44.0.0"
    locator:
      kind: github-releases
      repository: prometheus-operator/prometheus-operator
      ref: '{{.ArtifactVersionOf "prometheus-operator-image"}}'
    classify:
      # The operator's release bodies are label-prefixed bullets in its own
      # taxonomy (CONTRIBUTING.md): CHANGE alters the operator's behaviour or
      # CRD interface (the class an upgrader must review — existing resources
      # may be rejected or interpreted differently), FEATURE adds fields or
      # capabilities, ENHANCEMENT improves existing behaviour, BUGFIX fixes
      # it. The generic classifier does not know the bracket labels; these
      # rules declare them.
      - text: '^\[CHANGE\]'
        category: api
        breaking: true
      - text: '^\[FEATURE\]'
        category: feature
      - text: '^\[ENHANCEMENT\]'
        category: feature
      - text: '^\[BUGFIX\]'
        category: bugfix

  # --- upgrade guides ------------------------------------------------------
  # Cumulative guide, one "From NN.x to NN+1.x" section per chart major; the
  # section for major N describes the transition into N. Attached to X.0.0
  # releases (the major-boundary path entries): at X.0.0 the previous line is
  # X-1, so the heading template needs no arithmetic. In UPGRADE.md since
  # 70.0.0, in the chart README before that (same heading text).
  - id: upgrade-md
    roles: [upgrade-guide]
    availability: ">= 70.0.0"
    releaseKinds: [major]
    locator:
      kind: repo-file
      repository: github.com/prometheus-community/helm-charts
      ref: "{{.Tag}}"
      path: charts/kube-prometheus-stack/UPGRADE.md
    extract:
      type: markdown-section
      heading: '^From {{.PrevMajor}}\.x to {{.Major}}\.x$'
  - id: upgrade-readme
    roles: [upgrade-guide]
    availability: ">= 9.3.4, < 70.0.0"
    releaseKinds: [major]
    locator:
      kind: repo-file
      repository: github.com/prometheus-community/helm-charts
      ref: "{{.Tag}}"
      path: charts/kube-prometheus-stack/README.md
    extract:
      type: markdown-section
      heading: '^From {{.PrevMajor}}\.x to {{.Major}}\.x$'

  # --- security ------------------------------------------------------------
  # No per-chart advisory feed exists; SECURITY.md points to the community
  # policy page (prometheus.io, not a per-release channel). The repository's
  # GitHub advisories are declared as the only upstream channel; component
  # CVEs (prometheus, operator, grafana) live in the components' own
  # advisories and are not joined from here (see record gaps).
  - id: github-advisories
    roles: [security]
    locator:
      kind: github-advisories
      repository: prometheus-community/helm-charts

artifacts:
  # --- the chart itself (the product) --------------------------------------
  - id: chart
    type: helm-chart
    name: kube-prometheus-stack
    version: {strategy: template, template: "{{.Version}}"}
    channels:
      # canonical first even when alternatives exist
      - kind: helm-repo
        url: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
      - kind: helm-repo
        url: https://raw.githubusercontent.com/prometheus-community/helm-charts/gh-pages
        chart: kube-prometheus-stack
      - kind: helm-git
        repository: github.com/prometheus-community/helm-charts
        path: charts/kube-prometheus-stack
        tagPattern: '^kube-prometheus-stack-(?P<version>\d+\.\d+\.\d+)$'
      - kind: oci
        repository: ghcr.io/prometheus-community/charts/kube-prometheus-stack
    exceptions:
      - versions: [14.6.3, 18.0.4, 19.2.0]
        reason: >-
          Tagged but never published to the Helm repository (index has 1148
          entries for 1151 tags; computed 2026-10-01). The helm-git and oci
          channels still see them.
    contents:
      - kind: helm-values
        locator:
          kind: repo-file
          repository: github.com/prometheus-community/helm-charts
          ref: "{{.Tag}}"
          path: charts/kube-prometheus-stack/values.yaml
        # the default image tags rewritten per release are reported by the
        # prometheus-image / alertmanager-image artifact diffs, with registry
        # evidence; not twice
        ignoreKeys:
          - prometheus.prometheusSpec.image.tag
          - alertmanager.alertmanagerSpec.image.tag
      # kubeVersion becomes a kubernetes compatibility constraint; the
      # appVersion fact doubles as evidence of the operator pin.
      - kind: chart-metadata
        locator:
          kind: repo-file
          repository: github.com/prometheus-community/helm-charts
          ref: "{{.Tag}}"
          path: charts/kube-prometheus-stack/Chart.yaml

  # --- CRDs (the operator's CRDs, content tracks appVersion) ----------------
  # In a local subchart since 48.0.0; a plain crds/ directory before that.
  - id: crds
    type: crd
    name: charts/kube-prometheus-stack/charts/crds/crds
    availability: ">= 48.0.0"
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: repo-dir
        repository: github.com/prometheus-community/helm-charts
        path: charts/kube-prometheus-stack/charts/crds/crds
        glob: "*.yaml"
    contents:
      - kind: crds
  - id: crds-legacy
    type: crd
    name: charts/kube-prometheus-stack/crds
    availability: "< 48.0.0"
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: repo-dir
        repository: github.com/prometheus-community/helm-charts
        path: charts/kube-prometheus-stack/crds
        glob: "*.yaml"
    contents:
      - kind: crds

  # --- pinned sub-components (version read out of the release's own files) --
  # The operator the chart deploys: Chart.yaml appVersion (README: "refers to
  # the prometheus-operator's version with matching CRDs"). v-prefixed since
  # 44.0.0 (0.61.1-style before); quay operator tags for the older era are
  # not probed.
  - id: prometheus-operator-image
    type: container-image
    name: quay.io/prometheus-operator/prometheus-operator
    availability: ">= 44.0.0"
    version:
      strategy: field
      field: appVersion
      from:
        kind: repo-file
        repository: github.com/prometheus-community/helm-charts
        ref: "{{.Tag}}"
        path: charts/kube-prometheus-stack/Chart.yaml
    channels:
      - kind: oci
        repository: quay.io/prometheus-operator/prometheus-operator
  # Dependency pins, exact since the Renovate switch: node-exporter 72.0.0,
  # grafana 73.0.0, kube-state-metrics 74.0.0 (ranges before that, and
  # prometheus-windows-exporter is still a range today — see record gaps).
  - id: kube-state-metrics-chart
    type: helm-chart
    name: kube-state-metrics
    availability: ">= 74.0.0"
    version:
      strategy: field
      field: dependencies[name=kube-state-metrics].version
      from:
        kind: repo-file
        repository: github.com/prometheus-community/helm-charts
        ref: "{{.Tag}}"
        path: charts/kube-prometheus-stack/Chart.yaml
    channels:
      - kind: oci
        repository: ghcr.io/prometheus-community/charts/kube-state-metrics
      - kind: helm-repo
        url: https://prometheus-community.github.io/helm-charts
        chart: kube-state-metrics
  - id: prometheus-node-exporter-chart
    type: helm-chart
    name: prometheus-node-exporter
    availability: ">= 72.0.0"
    version:
      strategy: field
      field: dependencies[name=prometheus-node-exporter].version
      from:
        kind: repo-file
        repository: github.com/prometheus-community/helm-charts
        ref: "{{.Tag}}"
        path: charts/kube-prometheus-stack/Chart.yaml
    channels:
      - kind: oci
        repository: ghcr.io/prometheus-community/charts/prometheus-node-exporter
      - kind: helm-repo
        url: https://prometheus-community.github.io/helm-charts
        chart: prometheus-node-exporter
  - id: grafana-chart
    type: helm-chart
    name: grafana
    availability: ">= 90.0.0"
    version:
      strategy: field
      field: dependencies[name=grafana].version
      from:
        kind: repo-file
        repository: github.com/prometheus-community/helm-charts
        ref: "{{.Tag}}"
        path: charts/kube-prometheus-stack/Chart.yaml
    channels:
      # dependency repository since 90.0.0 (was grafana-community.github.io,
      # before that grafana.github.io)
      - kind: oci
        repository: ghcr.io/grafana-community/helm-charts/grafana
      - kind: helm-repo
        url: https://grafana.github.io/helm-charts
        chart: grafana
  # The images the stack runs by default: values.yaml image tags, pinned per
  # release (registry quay.io next to the repository key).
  - id: prometheus-image
    type: container-image
    name: quay.io/prometheus/prometheus
    version:
      strategy: field
      field: prometheus.prometheusSpec.image.tag
      from:
        kind: repo-file
        repository: github.com/prometheus-community/helm-charts
        ref: "{{.Tag}}"
        path: charts/kube-prometheus-stack/values.yaml
    channels:
      - kind: oci
        repository: quay.io/prometheus/prometheus
  - id: alertmanager-image
    type: container-image
    name: quay.io/prometheus/alertmanager
    version:
      strategy: field
      field: alertmanager.alertmanagerSpec.image.tag
      from:
        kind: repo-file
        repository: github.com/prometheus-community/helm-charts
        ref: "{{.Tag}}"
        path: charts/kube-prometheus-stack/values.yaml
    channels:
      - kind: oci
        repository: quay.io/prometheus/alertmanager

provenance:
  method: discovery+review
  author: onboarding wave 1
  updated: "2026-10-01"
  validatedReleases: [91.3.0, 91.4.1, 91.5.3, 91.6.0, 91.7.1, 91.8.2]
  notes: >-
    Started from the discovery proposal (tagPrefix, the chart artifact with
    helm-values/chart-metadata contents, the CRD repo-dir, ghcr OCI channels
    and github-advisories were kept) and rebuilt around the aggregation
    topology from docs/research/kube-prometheus-stack.md: the 44 sibling
    charts the resolver proposed as independent artifacts are other products,
    and the sub-component pins needed a new generic construct
    (version.strategy: field). Verified with `ri check -n 6`.
