apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: linkerd
name: Linkerd
description: >-
  Ultralight service mesh (Rust linkerd2-proxy data plane, Go control plane,
  linkerd CLI). The canonical channel is the stable lineage of
  github.com/linkerd/linkerd2: stable-2.X.N tags through 2.14.10 (2024-02,
  the last open-source stable release with artifacts — charts on
  helm.linkerd.io/stable, images on ghcr.io/cr.l5d.io, CLI release assets,
  curated GitHub release bodies) and, since 2.15, version-2.Y designation
  markers on edge commits (no open-source artifacts; upstream: "producing
  stable Linkerd releases will be in the hands of the vendor community").
  The weekly edge-YY.M.N CalVer family is the live open-source artifact
  channel and is excluded here (istio-style channel discipline; one family
  per definition). Each release pins the data-plane proxy source
  (.proxy-version), the proxy-init image and the CNI plugin image in the
  charts' values at the tag. Related products out of scope: linkerd2-proxy,
  proxy-init, cni-plugin, the in-repo extensions (viz, multicluster,
  jaeger), linkerd-smi, Buoyant Enterprise for Linkerd.
homepage: https://linkerd.io

versioning:
  scheme: semver
  # stable-2.14.10 -> 2.14.10; version-2.15 -> 2.15.0 (component assembly,
  # PostgreSQL construct). Excluded: the edge-YY.M.N CalVer family (378 tags,
  # the weekly prerelease channel), stable-2.12.0-rc2, the 2018 v18.x/vX tags
  # and the git-* junk tags.
  tagPattern: '^(?:stable|version)-(?P<major>\d+)\.(?P<minor>\d+)(?:\.(?P<patch>\d+))?$'
  lineage: minor
  # Docs "Upgrade paths" (linkerd.io 2.15-2.17): patch skipping within a 2.x
  # line is safe; skipping minor lines is NOT supported — one line at a time,
  # which is what lineage: minor traverses.

sources:
  # --- canonical versions ---------------------------------------------------
  - id: git-tags
    roles: [versions]
    priority: 0
    locator:
      kind: git-tags
      repository: github.com/linkerd/linkerd2
    notes: >-
      463 tags in the repository: 56 stable-2.X.N (2018 - 2024-02-20), 6
      version-2.Y markers (2024-02-20 - 2026-06-22), 378 edge-YY.M.N and
      junk; the pattern keeps the stable lineage. version-2.Y tags are
      designations of edge commits (2.15 = edge-24.2.4 ... 2.19 =
      edge-25.10.7, verified double-tagged; the mapping is published in
      linkerd.io/data/versions.yaml).
  - id: github-releases
    roles: [versions]
    priority: 1
    locator:
      kind: github-releases
      repository: linkerd/linkerd2

  # --- release notes --------------------------------------------------------
  # <= 2.14: curated GitHub release body ("This stable release back-ports
  # bugfixes and improvements from recent edge releases. Introduced support
  # for ... (#11222; fixes #11175) ...").
  - id: release-notes-github
    roles: [release-notes]
    fallbackGroup: release-notes
    availability: ">= 2.12.0, < 2.15.0"
    locator:
      kind: github-releases
      repository: linkerd/linkerd2
      ref: "{{.Tag}}"
    classify:
      - text: '(?i)NOTE about 2\.15'
        skip: true
      - text: '(?i)\b(security|CVE)\b'
        category: security
      - text: '(?i)\b(fix(es|ed)?|bug)\b'
        category: bugfix
  # >= 2.15: no GitHub release exists; the curated channel is the website
  # announcement blog per logical version. The date-prefixed path is upstream
  # data (not derivable from the version), so each designation is its own
  # availability-pinned source.
  - id: announce-2-15
    roles: [release-notes]
    availability: ">= 2.15.0, < 2.16.0"
    locator:
      kind: repo-file
      repository: github.com/linkerd/website
      ref: main
      path: linkerd.io/content/blog/2024/0221-announcing-linkerd-2.15/index.md
    classify:
      - text: '(?i)^photo credit'
        skip: true
      - text: '(?i)^linkerd is for everyone'
        skip: true
      - text: '(?i)breaking change|no longer|deprecat|incompatible'
        breaking: true
      - text: '(?i)native sidecar|must|requires?'
        actionRequired: true
  - id: announce-2-16
