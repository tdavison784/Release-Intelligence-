        actionRequired: true
  - id: announce-2-17
    roles: [release-notes]
    availability: ">= 2.17.0, < 2.18.0"
    locator:
      kind: repo-file
      repository: github.com/linkerd/website
      ref: main
      path: linkerd.io/content/blog/2024/1205-announcing-linkerd-2.17/index.md
    classify:
