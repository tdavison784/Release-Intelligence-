# Runtime exercises for ingress-nginx (internal/catalog/exercises.go; docs/INVESTIGATE.md
# "Runtime validation"). Release-level triggers from upstream documentation, never from an
# evaluation case.
apiVersion: ri.dev/v1alpha1
kind: ProductExercises
product: ingress-nginx
exercises:
- id: ingress-update
  summary: >-
    Update every Ingress (an annotation the controller does not read): the controller's
    validating admission webhook validates the Ingress definition again and the controller
    re-syncs it, so changed validation and processing defaults manifest on existing Ingresses.
  target: {group: networking.k8s.io, kind: Ingress}
  action: annotate
  annotation: ri.dev/runtime-exercise
  families: [behavior, procedure]
  # the controller's response: its store records a Normal "Sync" event on an Ingress it accepted for sync
  reaction: {kind: event, reason: Sync}
  settleSeconds: 30
  references:
  - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/docs/deploy/index.md
    quote: to validate Ingress definitions.
  - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/docs/user-guide/cli-arguments.md
    quote: The address to start an admission controller on to validate incoming ingresses.
  - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/controller/store/store.go
    quote: recorder.Eventf(curIng, corev1.EventTypeNormal, "Sync", "Scheduled for sync")
- id: ingress-admission
  summary: >-
    Submit one environment Ingress as a server-side dry run against the target version's validating
    admission webhook (runtime.admission-dry-run@v1, opt-in: `ri investigate admission`): the API
    server's answer, accepted or rejected with the webhook's message, is the observation. Nothing is
    stored and the controller does not act, so it declares no reaction and the isolated upgrade never
    runs it.
  target: {group: networking.k8s.io, kind: Ingress}
  action: admission-dry-run
  families: [behavior]
  references:
  - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/docs/deploy/index.md
    quote: to validate Ingress definitions.
  - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/docs/user-guide/cli-arguments.md
    quote: The address to start an admission controller on to validate incoming ingresses.
