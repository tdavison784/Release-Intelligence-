apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: external-secrets
name: External Secrets Operator
description: >-
  Kubernetes operator that synchronises secrets from external secret managers
  into Kubernetes Secrets. One repository publishes three independently tagged
  release streams: the operator (vX.Y.Z; image, install manifest, CRD bundle),
  its Helm chart (helm-chart-X.Y.Z, released a few days after the operator and
  numbered identically) and the esoctl CLI (vX.Y.Z-esoctl).
homepage: https://external-secrets.io

versioning:
  scheme: semver
  tagPrefix: v
  # vX.Y.Z and vX.Y.Z-rcN; helm-chart-*, vX.Y.Z-esoctl and the legacy
  # "v.0.3.6" tag do not match.
  tagPattern: '^v(?P<version>\d+\.\d+\.\d+(?:-rc\d+)?)$'
  # History is linear (every tag descends from the previous one since 0.9.0)
  # and only the newest minor is supported, so patch releases are rare. The
  # minor path policy skips intermediate patches; the next X.Y.0 range
  # (previous X'.Y'.0..X.Y.0) already contains them.
  lineage: minor

sources:
  # --- canonical versions -------------------------------------------------
  - id: github-releases
    roles: [versions]
    priority: 0
    locator:
      kind: github-releases
      repository: external-secrets/external-secrets
    notes: >-
      Also lists the helm-chart-* and *-esoctl releases of the same
      repository; the version parser ignores them.
  - id: git-tags
    roles: [versions]
    priority: 1
    locator:
      kind: git-tags
      repository: github.com/external-secrets/external-secrets
    notes: Fallback when the GitHub API is unreachable; tags are authoritative.

  # --- release notes ------------------------------------------------------
  # Generated GitHub release body ("What's Changed" PR titles plus the image
  # references); there is no CHANGELOG file and no per-release notes in the
  # repository. Only reachable through the GitHub API.
  - id: github-release-notes
    roles: [release-notes]
    priority: 0
    fallbackGroup: release-notes
    locator:
      kind: github-releases
      repository: external-secrets/external-secrets
      ref: "{{.Tag}}"
  # Deterministic fallback: the generated release body is the list of merged
  # PR titles, which are the squash-commit subjects (conventional commits).
  - id: commit-log
    roles: [changelog]
    priority: 1
    fallbackGroup: release-notes
    locator:
      kind: git-log
      repository: github.com/external-secrets/external-secrets
      ref: "{{.PrevTag}}..{{.Tag}}"
    validatedAgainst: [0.9.0, 0.20.4, 1.0.0, 2.0.0, 2.11.0]
    classify:
      # Maintainers rarely mark breaking changes (2 "!" subjects and one
      # "BREAKING:" prefix in 2500 commits since v0.9.0); removals are the
      # best textual signal, and CRD/chart diffs carry the rest.
      - text: '(?i)^[a-z]+(\([^)]*\))?: (unserve|remove|drop) .*(unmaintained|secret stores?|providers?|v1alpha1|v1beta1|template func|conversion|crds? from|\bflags?\b|\bfields?\b)'
        category: removal
        breaking: true
      # tests, docs, design notes, CI, linting and refactors are not part of
      # the shipped product
      - text: '^(test|ci|doc|docs|design|sonar|style)(\(.+\))?!?:'
        skip: true
      - text: '^(feat|fix|chore)\((ci|actions|lint|linter|revive-linter|release|docs|doc|e2e|test|tests)\):'
        skip: true
      - text: '^(ref|refactor|clean|cleanup)(\(.+\))?:'
        skip: true
      - text: '(?i)\b(adopters?( list)?|typos?|skywalking|license-eye|sonar(qube|cloud)?|zizmor|harden-runner)\b'
        skip: true
      # CI/tooling dependency bumps
      - text: '^(chore|build)\(deps(-dev)?\): bump (actions|github|docker|step-security|zizmorcore|helm|aws-actions|azure|codecov|softprops|sigstore|anchore|slsa-framework|golangci)/'
        skip: true
      - text: '^(chore|build)\(deps(-dev)?\): bump (hashicorp/setup-terraform|.+ in /(e2e|hack|docs)\b)'
        skip: true
      - text: '^chore: (release helm chart|prepare release|bump charts)'
        skip: true
      - text: '(?i)\bMakefile\b|^chore: (update (helm charts|codeql)|release charts?|updates? stability support)|^\[StepSecurity\]'
        skip: true
      # docs-only changes ("... refreshInterval docs (#4601)")
      - text: '(?i)\bdocs?( \(#\d+\))*( \([0-9a-f]{7,}\))?$'
        skip: true
      - text: '(?i)^(chore: bump |update dependencies)'
        category: dependency
      - text: '(?i)^issue-\d+: fix'
        category: bugfix

  # --- compatibility ------------------------------------------------------
  # Stability & support page. The row of a release is often added only after
  # its tag (v2.8.0..v2.10.0 do not contain their own row), so the page is
  # read from main, where every line has a row. Rows are keyed by line
  # ("2.11", "0.20.x") with a few exact-patch rows ("2.4.1").
  - id: stability-support
    roles: [compatibility]
    locator:
      kind: repo-file
      repository: github.com/external-secrets/external-secrets
      ref: main
      path: docs/introduction/stability-support.md
    extract:
      type: markdown-table
      keyColumns: [ESO Version]
      keyMatch: '^(?:{{regexQuote .Version}}|{{regexQuote .Line}}(?:\.x)?)$'
      columns:
        - platform: kubernetes
          kind: tested
          headers: [Kubernetes Version]
    validatedAgainst: [0.9.20, 0.20.4, 1.0.0, 2.4.1, 2.8.0, 2.11.0]

  # --- security -----------------------------------------------------------
  - id: github-advisories
    roles: [security]
    locator:
      kind: github-advisories
      repository: external-secrets/external-secrets
    notes: Security policy in SECURITY.md; advisories are the only security channel.

artifacts:
  # Distroless controller image (default flavour). The chart's controller,
  # webhook and cert-controller all run this one image.
  - id: controller-image
    type: container-image
    name: external-secrets
    version: {strategy: template, template: "{{.Tag}}"}
    exceptions:
      - versions: [1.3.0]
        reason: >-
          The v1.3.0 release never completed: the tag exists but no image was
          promoted (the promote job broke on the in-toto manifest and was
          fixed by "fix: ignore the in-toto manifest when promoting the docker
          build", released as v1.3.1). Found by `ri check external-secrets`
          on 2026-10-01.
    channels:
      - kind: oci
        repository: ghcr.io/external-secrets/external-secrets
    references:
      - artifact: install-manifest
        pattern: "ghcr.io/external-secrets/external-secrets:{{.Tag}}"
    notes: >-
      No Docker Hub or quay.io image exists (hub.docker.com/v2/repositories/
      external-secrets is empty); ghcr.io is the only registry.

  - id: controller-image-ubi
    type: container-image
    name: external-secrets (ubi flavour)
    version: {strategy: template, template: "{{.Tag}}-ubi"}
    exceptions:
      - versions: [1.3.0]
        reason: >-
          The v1.3.0 release never completed: the tag exists but no image was
          promoted (the promote job broke on the in-toto manifest and was
          fixed by "fix: ignore the in-toto manifest when promoting the docker
          build", released as v1.3.1). Found by `ri check external-secrets`
          on 2026-10-01.
    channels:
      - kind: oci
        repository: ghcr.io/external-secrets/external-secrets

  - id: controller-image-ubi-boringssl
    type: container-image
    name: external-secrets (ubi-boringssl flavour)
    version: {strategy: template, template: "{{.Tag}}-ubi-boringssl"}
    exceptions:
      - versions: [1.3.0]
        reason: >-
          The v1.3.0 release never completed: the tag exists but no image was
          promoted (the promote job broke on the in-toto manifest and was
          fixed by "fix: ignore the in-toto manifest when promoting the docker
          build", released as v1.3.1). Found by `ri check external-secrets`
          on 2026-10-01.
    channels:
      - kind: oci
        repository: ghcr.io/external-secrets/external-secrets

  # Rendered `helm template` output with the release's chart, attached to the
  # GitHub release by release.yml (together with SBOM and provenance files).
  - id: install-manifest
    type: manifest
    name: external-secrets.yaml
    version: {strategy: template, template: "{{.Tag}}"}
    exceptions:
      - versions: [0.20.0, 1.3.0]
        reason: >-
          No release assets were attached: v0.20.0 and v0.20.1 tag the same
          commit and the assets exist only on v0.20.1; the v1.3.0 release
          failed before assets were uploaded and was redone as v1.3.1.
          Found by `ri check external-secrets` on 2026-10-01.
    channels:
      - kind: http
        url: https://github.com/external-secrets/external-secrets/releases/download/{{.Tag}}/external-secrets.yaml
    contents:
      - kind: image-refs

  # Single-file CRD bundle (what the docs tell non-Helm users to apply).
  - id: crds
    type: crd
    name: deploy/crds/bundle.yaml
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: http
        url: https://raw.githubusercontent.com/external-secrets/external-secrets/{{.Tag}}/deploy/crds/bundle.yaml
    contents:
      - kind: crds

  # The chart lives in the same repository but is released separately, after
  # the operator, from a "release-chart-X.Y.Z" branch: tag helm-chart-X.Y.Z,
  # chart version X.Y.Z, appVersion vX.Y.Z. At the operator tag vX.Y.Z the
  # chart directory still declares the previous chart, so chart contents are
  # read at the chart tag, never at the operator tag.
  - id: helm-chart
    type: helm-chart
    name: external-secrets
    availability: ">= 0.9.0"
    version:
      strategy: lookup
      field: appVersion
      match: "{{.Tag}}"
      select: latest
    exceptions:
      - versions: [0.9.15, 0.12.0, 0.20.0, 1.3.0]
        reason: >-
          The operator tag exists but no chart carries its appVersion (no
          helm-chart-<version> tag, no entry in the gh-pages index): 0.9.15
          shipped as chart 0.9.15-2 with appVersion v0.9.15-2; 0.12.0, 0.20.0
          and 1.3.0 were superseded by 0.12.1, 0.20.1 and 1.3.1 before a chart
          was cut.
    channels:
      - kind: helm-repo
        url: https://charts.external-secrets.io
        chart: external-secrets
      - kind: helm-repo
        url: https://raw.githubusercontent.com/external-secrets/external-secrets/gh-pages
        chart: external-secrets
      - kind: oci
        repository: ghcr.io/external-secrets/charts/external-secrets
    contents:
      - kind: helm-values
        locator:
          kind: repo-file
          repository: github.com/external-secrets/external-secrets
          ref: "helm-chart-{{.ArtifactVersion}}"
          path: deploy/charts/external-secrets/values.yaml
      - kind: chart-metadata
        locator:
          kind: repo-file
          repository: github.com/external-secrets/external-secrets
          ref: "helm-chart-{{.ArtifactVersion}}"
          path: deploy/charts/external-secrets/Chart.yaml

provenance:
  method: manual+research
  updated: "2026-10-01"
  validatedReleases: [0.9.20, 0.20.4, 1.0.0, 1.3.2, 2.0.0, 2.11.0]
  notes: >-
    Authored from docs/research/external-secrets.md. api.github.com,
    charts.external-secrets.io and external-secrets.github.io were
    unreachable; the chart index is read from the gh-pages branch and release
    notes fall back to the commit log.
