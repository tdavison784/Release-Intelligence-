apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: karpenter
name: Karpenter for AWS
description: >-
  Node autoscaler for Amazon EKS and self-managed AWS clusters (NodePool,
  EC2NodeClass, NodeClaim; EC2 fleet via the AWS APIs). Semver v-prefixed tags
  with minor lines maintained in parallel; since v1 (2024-11 GA) the v1beta1
  APIs are gone and the v1beta1 -> v1 migration is a standing warning in every
  upgrade-guide section. Image and Helm charts are published to Amazon ECR
  Public with chart version == appVersion == release version and, from 0.35.0
  on, v-LESS registry tags (v-prefixed before); the in-repo chart files lag the
  tag by one release because the release job rewrites them in CI. Release
  notes are conventional-commit sections in the GitHub release body; the
  upgrade guide and the Kubernetes support matrix live in the website tree.
homepage: https://karpenter.sh

versioning:
  scheme: semver
  tagPrefix: v
  tagPattern: '^v(?P<version>\d+\.\d+\.\d+(?:-rc\.\d+)?)$'
  lineage: minor

sources:
  # --- canonical versions ---------------------------------------------------
  - id: git-tags
    roles: [versions]
    priority: 0
    locator:
      kind: git-tags
      repository: github.com/aws/karpenter-provider-aws
      tagPattern: '^v(?P<version>\d+\.\d+\.\d+(?:-rc\.\d+)?)$'
    notes: >-
      272 tags: 265 stable (v0.1.0 - v1.14.1), 6 rc pre-releases and one junk
      tag (v1.7.3-hash-fix-backport) that the pattern excludes.
  - id: github-releases
    roles: [versions]
    priority: 1
    locator:
      kind: github-releases
      repository: aws/karpenter-provider-aws

  # --- release notes (GitHub release body, conventional-commit sections) -----
  # One release per tag; the body groups PRs under "## Features", "## Bug
  # Fixes", "## Documentation", "## Tests", "## Continuous Integration",
  # "## Code Refactoring", "## Performance Improvements", "## Chores" and a
  # raw "## Commits" digest (exact set varies). Breaking changes are NOT here:
  # upstream documents them in the website upgrade guide (see below). LTS
  # releases open with a support-window banner blockquote.
  - id: release-notes
    roles: [release-notes]
    locator:
      kind: github-releases
      repository: aws/karpenter-provider-aws
      ref: "{{.Tag}}"
    extract:
      type: whole
    classify:
      # LTS support-window banner (v1.9.x, v1.14.x): the upstream signal for
      # how long the target line is maintained
      - text: 'Long-Term Support'
        category: other
      - section: '^Features$'
        category: feature
      - section: '^Bug Fixes$'
        category: bugfix
      # dependabot bumps land under Chores as "**deps**: bump ..."
      - section: '^Chores$'
        text: '^\*{2}deps(?:-dev)?\*{2}: bump'
        category: dependency
      # release machinery, docs churn, CI and the raw commit digest
      - section: '^(Documentation|Tests|Continuous Integration|Chores|Commits)$'
        skip: true
      - section: '^(Code Refactoring|Performance Improvements)$'
        category: other
      - text: '\bCVE-\d{4}-\d+|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}'
        category: security

  # --- upgrade guide (website, cumulative, per-minor sections) ----------------
  # website/content/en/vX.Y/ is created by the release CI only AFTER the tag
  # (copied from preview/ by hack/release/common.sh), so at a vX.Y.0 tag the
  # line's own "### Upgrading to `X.Y.0`+" section is readable only from
  # preview/ at the tag (the tagged commit is the line's release state).
  # Sections exist per minor (v0-era headings carry a v inside: "Upgrading to
  # v0.32.0+"); patches get none. Fallback: the same guide on main, which
  # accumulates every past section, for the releases whose section was added
  # to main only after the branch point (verified: v1.13.0 / v1.13.1).
  - id: upgrade-guide
    roles: [upgrade-guide]
    priority: 0
    fallbackGroup: upgrade-guide
    availability: ">= 0.32.0"
    # major covers v1.0.0, the v0 -> v1 boundary with its own guide section
    releaseKinds: [minor, major]
    locator:
      kind: repo-file
      repository: github.com/aws/karpenter-provider-aws
      ref: "{{.Tag}}"
      path: website/content/en/preview/upgrading/upgrade-guide.md
    extract:
      type: markdown-section
      heading: '^Upgrading to [`v]?{{regexQuote .Version}}[`v]?\+$'
      # sections open with a warning callout (Hugo alert shortcode) before
      # the bullet list: read them structurally so every bullet is an item
      listItems: true
    classify: &upgrade-classify
      # Hugo shortcode fences around the real content
      - text: '^\{\{%'
        skip: true
      # trailing link list
      - text: '^(Full Changelog|https?://)'
        skip: true
      # "No breaking changes" would otherwise match the breaking-change
      # markers; the absence of a change is not an item
      - text: '^No breaking changes'
        skip: true
      # the standing v1beta1 -> v1 migration warning opens every section
      - text: 'drops the support for'
        category: migration
        actionRequired: true
        breaking: true
      - text: '(?i)breaking change'
        breaking: true
        actionRequired: true
      # the guide's feature bullets describe opt-in additions, not steps
      - text: 'This version (adds|graduates|ships|introduces|supports)'
        category: feature
        actionRequired: false
      # v1.0.0's section groups its changelog under label bullets
      - text: '^Features:'
        category: feature
      - text: '(?i)\b(deprecat|remov|no longer)s?\b'
        category: removal
        breaking: true
        actionRequired: true
  - id: upgrade-guide-main
    roles: [upgrade-guide]
    priority: 1
    fallbackGroup: upgrade-guide
    availability: ">= 0.32.0"
    # major covers v1.0.0, the v0 -> v1 boundary with its own guide section
    releaseKinds: [minor, major]
    locator:
      kind: repo-file
      repository: github.com/aws/karpenter-provider-aws
      ref: main
      path: website/content/en/preview/upgrading/upgrade-guide.md
    extract:
      type: markdown-section
      heading: '^Upgrading to [`v]?{{regexQuote .Version}}[`v]?\+$'
      listItems: true
    classify: *upgrade-classify

  # --- Kubernetes compatibility (machine-readable matrix) --------------------
  # hack/docs/compatibilitymatrix_gen/compatibility.yaml: records
  # {appVersion: "X.Y.x", minK8sVersion, maxK8sVersion}, appended at release
  # time from the version.Min/MaxK8sVersion constants and rendered into the
  # website compatibility.md by tools/kompat. Upstream anomaly: the X.Y.x
  # record is missing at most X.Y.0 tags (the file catches up on main between
  # tags; verified missing at v1.0.0 - v1.11.0 and v1.13.0/v1.13.1, present at
  # v1.12.0/v1.14.x), so the file on main is the fallback. Patch-granular
  # records (1.0.5) and the duplicated 1.12.x record are upstream quirks.
  - id: compatibility
    roles: [compatibility]
    priority: 0
    fallbackGroup: compatibility
    availability: ">= 1.0.0"
    locator:
      kind: repo-file
      repository: github.com/aws/karpenter-provider-aws
      ref: "{{.Tag}}"
      path: hack/docs/compatibilitymatrix_gen/compatibility.yaml
    extract:
      type: yaml-records
      keyColumns: [appVersion]
      keyMatch: '^{{.Major}}\.{{.Minor}}\.x$'
      columns:
        - platform: kubernetes
          kind: minimum
          headers: [minK8sVersion]
        - platform: kubernetes
          kind: maximum
          headers: [maxK8sVersion]
  - id: compatibility-main
    roles: [compatibility]
    priority: 1
    fallbackGroup: compatibility
    availability: ">= 0.21.0"
    locator:
      kind: repo-file
      repository: github.com/aws/karpenter-provider-aws
      ref: main
      path: hack/docs/compatibilitymatrix_gen/compatibility.yaml
    extract:
      type: yaml-records
      keyColumns: [appVersion]
      keyMatch: '^{{.Major}}\.{{.Minor}}\.x$'
      columns:
        - platform: kubernetes
          kind: minimum
          headers: [minK8sVersion]
        - platform: kubernetes
          kind: maximum
          headers: [maxK8sVersion]

  # --- lifecycle evidence ----------------------------------------------------
  # SUPPORT.md exists only on main (404 at every tag). Cited by the lifecycle
  # statements below; its items are reported through them, not as per-release
  # notes.
  - id: support-policy
    roles: [release-notes]
    locator:
      kind: repo-file
      repository: github.com/aws/karpenter-provider-aws
      ref: main
      path: SUPPORT.md
    extract:
      type: whole

  # --- security --------------------------------------------------------------
  - id: github-advisories
    roles: [security]
    locator:
      kind: github-advisories
      repository: aws/karpenter-provider-aws

# --- lifecycle ---------------------------------------------------------------
# SUPPORT.md: regular minors are "supported only until the next minor release
# is published"; every ~6 months a minor is designated LTS (12 months of
# support, at most two LTS lines concurrently). Release names carry "(LTS)":
# v1.9.0-v1.9.2 and v1.14.0-v1.14.1 are the two current lines (checked
# 2026-10-01). v0.x never received security backports (compatibility.md).
lifecycle:
  - state: end-of-life
    since: "2026-02"
    versions: "< 1.9.0"
    summary: >-
      Every release line below 1.9 is past its support window: v0.x lines
      never received security backports, and the pre-1.9 v1 lines have been
      superseded by later LTS lines (1.9, Feb 2026 and 1.14, Jul 2026 are the
      two concurrently supported LTS lines). Upgrading off these lines is the
      only way to keep receiving fixes.
    sources: [support-policy]
  - state: end-of-life
    since: "2026-07"
    versions: ">= 1.10.0, < 1.14.0"
    summary: >-
      Lines 1.10 - 1.13 are regular (non-LTS) releases: upstream supports them
      only until the next minor is published, so 1.14.0 (LTS, Jul 2026)
      superseded them. Users on 1.10 - 1.13 should move to the 1.14 LTS line
      (or 1.9 while it is maintained, until Feb 2027).
    sources: [support-policy]

artifacts:
  # --- controller image (ECR Public; v-less tags since 0.35.0) ----------------
  - id: controller-image
    type: container-image
    name: public.ecr.aws/karpenter/controller
    description: The Karpenter controller (ko build of ./cmd/controller).
    availability: ">= 0.35.0"
    version: {strategy: template, template: "{{.Version}}"}
    channels:
      - kind: oci
        repository: public.ecr.aws/karpenter/controller
    notes: >-
      release.sh strips the v ("${git_tag#v}") before ko publish; registry
      tags are the bare semver from 0.35.0 on and v-prefixed before (see
      controller-image-legacy). public.ecr.aws/karpenter/kwok exists but has
      zero tags (dead repository).
  - id: controller-image-legacy
    type: container-image
    name: public.ecr.aws/karpenter/controller (v-prefixed era)
    availability: "< 0.35.0"
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: public.ecr.aws/karpenter/controller

  # --- Helm charts (OCI to ECR Public; version == appVersion == release) ------
  # No contents: the chart a release ships is rewritten in CI and published
  # only to the registry; the in-repo Chart.yaml/values.yaml at the tag still
  # carry the previous release (verified across eras: v1.14.1 -> 1.13.0,
  # v1.13.0 -> 1.12.1, v1.12.0 -> 1.11.1, v1.0.0 -> 0.37.0, v0.35.0 -> 0.34.0),
  # so a repo-file snapshot would misattribute the previous release's values.
  # Neither chart declares kubeVersion.
  - id: karpenter-chart
    type: helm-chart
    name: karpenter
    description: The Karpenter controller Helm chart (charts/karpenter).
    availability: ">= 0.35.0"
    version: {strategy: template, template: "{{.Version}}"}
    channels:
      - kind: oci
        repository: public.ecr.aws/karpenter/karpenter
    notes: >-
      Chart version == appVersion == release version, verified from the ECR
      chart configs (0.37.8, 1.0.0, 1.14.1). charts.karpenter.sh answers but
      its index ends in 2022 (appVersion 0.16.3): a dead v0-era channel, not
      declared.
  - id: karpenter-chart-legacy
    type: helm-chart
    name: karpenter (v-prefixed era)
    availability: "< 0.35.0"
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: public.ecr.aws/karpenter/karpenter
  - id: karpenter-crd-chart
    type: helm-chart
    name: karpenter-crd
    description: >-
      The CRD-only chart (charts/karpenter-crd): Helm does not manage crds/
      lifecycle on upgrade, so CRDs ship as a separate chart to upgrade
      alongside the controller.
    availability: ">= 0.35.0"
    version: {strategy: template, template: "{{.Version}}"}
    channels:
      - kind: oci
        repository: public.ecr.aws/karpenter/karpenter-crd
  - id: karpenter-crd-chart-legacy
    type: helm-chart
    name: karpenter-crd (v-prefixed era)
    availability: "< 0.35.0"
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: oci
        repository: public.ecr.aws/karpenter/karpenter-crd

  # --- CRDs (source tree; also rendered into both charts) ---------------------
  - id: crds
    type: crd
    name: pkg/apis/crds
    description: >-
      CRDs at the release tag: karpenter.sh NodePool / NodeClaim /
      NodeOverlay, karpenter.k8s.aws EC2NodeClass, and the
      autoscaling.x-k8s.io CapacityBuffers CRD graduated in 1.14.
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: repo-dir
        repository: github.com/aws/karpenter-provider-aws
        path: pkg/apis/crds
        glob: "*.yaml"
    contents:
      - kind: crds

  # --- source tarball ----------------------------------------------------------
  - id: source-archive
    type: package
    name: karpenter-source.tar.gz
    description: Source tarball of the release tag.
    version: {strategy: template, template: "{{.Tag}}"}
    channels:
      - kind: http
        url: "https://github.com/aws/karpenter-provider-aws/archive/refs/tags/{{.Tag}}.tar.gz"

provenance:
  method: discovery+review
  author: onboarding wave 2
  updated: "2026-10-01"
  validatedReleases: [0.34.0, 0.35.0, 0.37.8, 1.0.0, 1.5.0, 1.9.0, 1.12.0, 1.12.2, 1.13.0, 1.13.1, 1.14.0, 1.14.1]
  notes: >-
    Started from the discovery proposal (git-tags + tagPattern, GitHub
    release notes, both charts as OCI to public.ecr.aws, CRDs in pkg/apis/crds
    with a contents view, github-advisories) and rebuilt around the release
    mechanics from docs/research/karpenter.md: the ECR tag boundary is 0.35.0
    (not 1.0.0) so the dropped controller artifact returns with a {{.Version}}
    template and a v-prefixed legacy twin for each OCI artifact; the charts are
    template-versioned (discovery's lookup/independent guesses were misled by
    the one-release chart lag in the source tree); the upgrade guide and the
    compatibility matrix come from the website tree with main-branch
    fallbacks; SUPPORT.md backs two end-of-life statements.
