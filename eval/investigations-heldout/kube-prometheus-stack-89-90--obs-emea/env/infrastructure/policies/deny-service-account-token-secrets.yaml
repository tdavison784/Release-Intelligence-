# Platform baseline: no long-lived service account tokens. Workloads use projected, expiring tokens
# from the TokenRequest API.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-service-account-token-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: "object.type != 'kubernetes.io/service-account-token'"
      message: Long-lived service account token Secrets are not allowed; use projected service account tokens.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-service-account-token-secrets
spec:
  policyName: deny-service-account-token-secrets
  validationActions: [Deny]
