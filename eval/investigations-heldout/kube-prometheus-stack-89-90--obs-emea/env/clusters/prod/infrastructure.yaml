apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 30m
  path: ./infrastructure/policies
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m
  path: ./infrastructure/monitoring
  prune: true
  dependsOn:
    - name: policies
  sourceRef:
    kind: GitRepository
    name: flux-system
