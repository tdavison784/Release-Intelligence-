id: cert-manager-1.17-1.18--billing-nordics
product: cert-manager
chart:
  repo: https://charts.jetstack.io
  name: cert-manager
from:
  version: v1.17.2
  chartVersion: v1.17.2
to:
  version: v1.18.0
  chartVersion: v1.18.0
environment:
  id: billing-prod-nordics
  root: env/
  entrypoints:
    - helmfile.yaml
    - clusters/prod/kustomization.yaml
  kubernetes: "1.31"
  description: >-
    Production cluster of the billing platform. A deploy pipeline runs helmfile -e prod apply
    (cert-manager and external-secrets from their upstream charts, values in values/) and then
    kubectl apply -k clusters/prod (the PKI objects in pki/ and the billing services in
    apps/invoicing). The billing CA is operated by the security team in Vault; external-secrets
    keeps a copy of its key pair in the cluster for the billing-ca ClusterIssuer, which signs the
    certificates the billing services use for mutual TLS. The repository is the complete
    declaration of what runs in the cluster; nothing is applied by hand.
  complete: true
scope:
  - id: B1
    title: Certificate.spec.privateKey.rotationPolicy default changed from Never to Always
    subject: spec.privateKey.rotationPolicy
    source: https://github.com/cert-manager/website/blob/2e32a5efc7a4ef284e271f54ac1b15e800e66fcc/content/docs/releases/release-notes/release-notes-1.18.md#L109-L148
  - id: B2
    title: Certificate.spec.revisionHistoryLimit default changed from unset (no limit) to 1
    subject: spec.revisionHistoryLimit
    source: https://github.com/cert-manager/website/blob/2e32a5efc7a4ef284e271f54ac1b15e800e66fcc/content/docs/releases/release-notes/release-notes-1.18.md#L151-L160
