# Callers must present a certificate from the billing CA.
server {
    listen 8443 ssl;
    server_name invoicing.billing.svc;

    ssl_certificate        /tls/tls.crt;
    ssl_certificate_key    /tls/tls.key;
    ssl_client_certificate /tls/ca.crt;
    ssl_verify_client      on;

    location / {
        default_type text/plain;
        return 200 "invoicing ok: client=$ssl_client_s_dn\n";
    }
}
