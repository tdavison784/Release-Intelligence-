apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingest-tls
spec:
  secretName: ingest-tls
  commonName: ingest.telemetry.svc
  dnsNames:
    - ingest.telemetry.svc
    - ingest.telemetry.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 360h
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: telemetry-ca
