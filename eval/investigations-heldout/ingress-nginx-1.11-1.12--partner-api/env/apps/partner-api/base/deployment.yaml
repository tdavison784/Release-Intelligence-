apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-api
  labels:
    app: partner-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: partner-api
  template:
    metadata:
      labels:
        app: partner-api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: partner-api-nginx
