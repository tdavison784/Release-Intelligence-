apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: build-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: build-root-ca
  secretName: build-root-ca
  duration: 17520h # 2y
  renewBefore: 2160h
  subject:
    organizations:
      - Example Build Infrastructure
  privateKey:
    algorithm: RSA
    size: 3072
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-bootstrap
