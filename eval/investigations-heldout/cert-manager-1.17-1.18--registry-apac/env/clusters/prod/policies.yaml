apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  source:
    repoURL: https://git.example.com/platform/gitops-registry-apac.git
    targetRevision: main
    path: platform/policies
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
