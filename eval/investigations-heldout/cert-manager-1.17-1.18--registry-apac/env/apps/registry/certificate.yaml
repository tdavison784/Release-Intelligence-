apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: artifacts-tls
spec:
  secretName: artifacts-tls
  commonName: artifacts.registry.svc
  dnsNames:
    - artifacts.registry.svc
    - artifacts.registry.svc.cluster.local
  duration: 1440h # 60d
  renewBefore: 480h
  usages:
    - server auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: build-ca
