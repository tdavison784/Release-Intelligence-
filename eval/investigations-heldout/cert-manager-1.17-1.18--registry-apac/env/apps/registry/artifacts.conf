# Build agents authenticate with a client certificate from the build CA.
server {
    listen 8443 ssl;
    server_name artifacts.registry.svc;

    ssl_certificate        /tls/tls.crt;
    ssl_certificate_key    /tls/tls.key;
    ssl_client_certificate /tls/ca.crt;
    ssl_verify_client      on;

    location / {
        default_type text/plain;
        return 200 "artifacts ok: client=$ssl_client_s_dn\n";
    }
}
