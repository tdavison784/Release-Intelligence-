apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: search
  destination:
    server: https://kubernetes.default.svc
    namespace: search
  source:
    repoURL: https://git.example.com/platform/gitops-search-latam.git
    targetRevision: main
    path: apps/search/overlays/prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
