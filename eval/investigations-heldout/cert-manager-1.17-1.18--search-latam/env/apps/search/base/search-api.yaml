apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: search-api-tls
spec:
  secretName: search-api-tls
  commonName: search-api.search.svc
  dnsNames:
    - search-api.search.svc
    - search-api.search.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 720h
  revisionHistoryLimit: 2
  usages:
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: search-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  labels:
    app: search-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: search-api-tls
        - name: conf
          configMap:
            name: search-api-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
spec:
  selector:
    app: search-api
  ports:
    - name: https
      port: 443
      targetPort: https
