apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Production CAs keep their private key across renewals.
  - path: ca-key-continuity.yaml
    target:
      group: cert-manager.io
      kind: Certificate
      labelSelector: pki.example.com/tier=ca
  - path: root-ca-subject.yaml
