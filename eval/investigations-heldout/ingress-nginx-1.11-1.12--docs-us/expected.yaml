      - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/inspector/rules.go
        lines: "L31-L37"
        quote: "validPathType enforces alphanumeric, -, _ and / characters. ... validPathType = regexp.MustCompile(`(?i)^/[[:alnum:]\\_\\-/]*$`)"
