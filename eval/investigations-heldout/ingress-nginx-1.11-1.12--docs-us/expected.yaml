        classification: not-affected
        reason: >-
          The /.well-known path contains a dot, which strict path validation rejects for Exact and Prefix
          paths, but here it is declared with pathType ImplementationSpecific, which the validation skips;
          "/" (Prefix) is valid. Observed on v1.12.0: requests served, the docs Application re-synced
          (server-side apply), an annotation change admitted, the Ingress deleted and re-created, all
          without rejection.
        mitigation: {ref: {file: env/apps/docs/base/ingress.yaml, kind: Ingress, namespace: docs, name: docs}, field: 'spec.rules[0].http.paths[1].pathType', value: ImplementationSpecific, kind: feature-unused}
