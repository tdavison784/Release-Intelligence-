        quote: "if path.PathType == nil || *path.PathType != implSpecific { if isValid := validPathType.MatchString(path.Path); !isValid { err = errors.Join(err, fmt.Errorf(\"path %s cannot be used with pathType %s\", ...))"
      - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/controller/controller.go
        lines: "L313-L357"
        quote: "// CheckIngress returns an error in case the provided ingress, when added to the current configuration, generates an invalid configuration ... if cfg.StrictValidatePathType { if err := inspector.ValidatePathType(ing); err != nil { return fmt.Errorf(\"ingress contains invalid paths: %w\", err) } }"
      - url: https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/controller/config/config.go
        lines: "L897"
        quote: "StrictValidatePathType:         true,"
    match:
