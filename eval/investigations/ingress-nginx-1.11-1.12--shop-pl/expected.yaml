          - ref: {file: env/apps/storefront/base/ingress.yaml, kind: Ingress, namespace: storefront, name: storefront}
            field: metadata.annotations[nginx.ingress.kubernetes.io/configuration-snippet]
        mitigation: null
        evidenceGaps:
