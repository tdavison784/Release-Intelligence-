        classification: insufficient-evidence
        reason: >-
          The storefront Ingress carries a Critical-risk configuration-snippet (added by the prod
          overlay), so it is exposed to the risk-level default change. Whether it breaks is decided
          entirely by controller.config.annotations-risk-level (and controller.allowSnippetAnnotations)
