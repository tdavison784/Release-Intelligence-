apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.shop.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  name: http
