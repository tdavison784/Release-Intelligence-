apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:5678
            - -text=storefront
          ports:
            - name: http
              containerPort: 5678
