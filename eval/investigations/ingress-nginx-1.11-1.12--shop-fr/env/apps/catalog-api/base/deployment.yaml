apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:5678
            - -text=catalog-api
          ports:
            - name: http
              containerPort: 5678
