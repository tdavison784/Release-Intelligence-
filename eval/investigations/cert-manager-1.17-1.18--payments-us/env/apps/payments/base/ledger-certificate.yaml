apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ledger-tls
  labels:
    app.kubernetes.io/part-of: payments-mesh
spec:
  secretName: ledger-tls
  commonName: ledger.payments.svc
  dnsNames:
    - ledger.payments.svc
    - ledger.payments.svc.cluster.local
  duration: 720h
  renewBefore: 240h
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: mesh-ca
