apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: payments
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  source:
    repoURL: https://git.example.com/platform/gitops-payments-eu.git
    targetRevision: main
    path: apps/payments/overlays/prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
