  - item: B2
    classification: not-affected
    verification: observed
    observed:
      - observed/run.log
    citations:
      - url: https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-90.2.0/charts/kube-prometheus-stack/UPGRADE.md#L43-L46
        quote: "`prometheusOperator.secretFieldSelector` no longer excludes `kubernetes.io/service-account-token`, so that changes to that Secret trigger a reconciliation."
    components:
      - ref: {renderedFrom: env/clusters/prod/kube-prometheus-stack.yaml, kind: Deployment, namespace: monitoring, name: kube-prometheus-stack-operator}
        classification: not-affected
        reason: >-
          The operator's --secret-field-selector arg loses `type!=kubernetes.io/service-account-token`
          (visible in the rendered diff). The operator now also watches token Secrets; nothing in the
          environment depends on that exclusion (no custom secretFieldSelector, no tooling relying on the
          operator ignoring token Secrets). Observed: the operator runs and reconciles normally after the
          upgrade and all ServiceMonitors are accepted.
        impactPath:
          - ref: {file: env/clusters/prod/kube-prometheus-stack.yaml, kind: Application, namespace: argocd, name: kube-prometheus-stack}
            relation: deploys
          - ref: {renderedFrom: env/clusters/prod/kube-prometheus-stack.yaml, kind: Deployment, namespace: monitoring, name: kube-prometheus-stack-operator}
            field: spec.template.spec.containers[0].args[--secret-field-selector]
        mitigation: {kind: feature-unused, detail: "the environment sets no prometheusOperator.secretFieldSelector and nothing depends on token Secrets being ignored"}
        requiredEvidence:
          - {file: env/platform/monitoring/values.yaml, object: values, field: prometheusOperator}
    match:
      - subject: prometheusOperator.secretFieldSelector
      - text: '(?i)secret-?field-?selector'

  - item: B3
    classification: not-affected
    verification: render
    observed:
      - observed/render.diff
    citations:
      - url: https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-90.2.0/charts/kube-prometheus-stack/UPGRADE.md#L48-L59
        quote: "Removed values, all replaced by the `authorization` and `tlsConfig` blocks of the same component"
    components:
      - ref: {file: env/platform/monitoring/values.yaml, kind: values, name: values.yaml}
        classification: not-affected
        reason: >-
          Neither value file sets any of the removed keys (serviceMonitor.bearerTokenFile,
          kubelet.serviceMonitor.insecureSkipVerify, kubeApiServer.tlsConfig.caSecret, the etcd /
          controller-manager / scheduler / kube-proxy TLS keys); etcd, controller-manager, scheduler and
          kube-proxy monitoring is disabled altogether. No environment setting is silently dropped.
        impactPath:
          - ref: {file: env/clusters/prod/kube-prometheus-stack.yaml, kind: Application, namespace: argocd, name: kube-prometheus-stack}
            relation: deploys
          - ref: {file: env/platform/monitoring/values.yaml, kind: values, name: values.yaml}
        mitigation: {kind: feature-unused, detail: "none of the removed values is set"}
        requiredEvidence:
          - {file: env/platform/monitoring/values.yaml, object: values, field: kubelet}
          - {file: env/platform/monitoring/values-prod.yaml, object: values, field: (whole file)}
    match:
      - subject: kubelet.serviceMonitor.insecureSkipVerify
      - text: '(?i)removed values|insecureSkipVerify|caSecret'

# Every environment-relevant hunk of observed/render.diff, labelled. Chart/app version labels and
# image tags are release noise and not listed. The namespace each ServiceMonitor renders into is
# NOT inside any hunk (it does not change between versions) — it is in the unchanged context of the
# rendered objects, which is exactly what decides the impact.
