# GPU runner capacity for the ci-buildfarm cluster. Authored against the
# v1beta1 API served by Karpenter v0.37.8.
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-runners
spec:
  template:
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["g"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: gpu-al2023
  limits:
    cpu: "192"
    nvidia.com/gpu: "16"
  disruption:
    expireAfter: 336h
