# The ingress-nginx controller ConfigMap of this cluster's ingress-nginx
# v1.12.1 install — verbatim shape of the ConfigMap in the v1.12.1 static
# deploy manifest: present, no data keys (all settings at their defaults).
# strict-validate-path-type is therefore at its v1.12 default (enabled, PR
# 11819: "Also makes validation enabled by default"); the cluster does not
# set the "false" opt-out.
# https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.1/deploy/static/provider/cloud/deploy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.12.1
