# ACME certificate solved via ingress-nginx (controller v1.12.1 in this
# cluster, i.e. BELOW the v1.12.6 fix for strict-validate-path-type).
# Note: no spec.privateKey.rotationPolicy is set anywhere, so every
# Certificate inherits the v1.18 default change Never -> Always (E1).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-com
  namespace: default
spec:
  secretName: example-com-tls
  dnsNames:
    - example.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  acme:
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
