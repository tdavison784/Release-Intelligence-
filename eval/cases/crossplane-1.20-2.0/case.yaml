  - https://github.com/crossplane/crossplane/blob/v2.0.0/cluster/crds/apiextensions.crossplane.io_compositeresourcedefinitions.yaml
  - https://github.com/crossplane/crossplane/blob/v1.20.1/cmd/crossplane/core/core.go
  - https://github.com/crossplane/crossplane/blob/v2.0.0/cmd/crossplane/core/core.go
  - https://github.com/crossplane/crossplane/blob/v1.20.1/cmd/crossplane/main.go
