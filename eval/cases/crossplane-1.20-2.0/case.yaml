  - https://github.com/crossplane/crossplane/blob/v2.0.0/cluster/charts/crossplane/values.yaml
  - https://github.com/crossplane/crossplane/blob/v1.20.1/cluster/charts/crossplane/templates/deployment.yaml
  - https://github.com/crossplane/crossplane/blob/v2.0.0/cluster/charts/crossplane/templates/deployment.yaml
