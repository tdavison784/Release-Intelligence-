expected:
  - id: E1
    title: Native patch-and-transform composition (spec.mode Resources) removed; Compositions must be migrated to function pipelines before upgrading
    kind: removal
    importance: critical
    actionRequired: true
    classification: action-required
    match:
      - text: '(?i)native patch.and.transform'
      - text: '(?i)mode: ?Resources'
      - text: '(?i)convert pipeline-composition'
    evidence:
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/guides/upgrade-to-crossplane-v2.md
        quote: "If you're using `spec.mode: Resources` in your Compositions, migrate to composition functions before upgrading."
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "Native patch and transform within composition (`mode: Resources`)"
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/whats-new/_index.md
        quote: "Crossplane deprecated native patch and transform composition in Crossplane v1.17. It's replaced by composition functions."
      - url: https://github.com/crossplane/crossplane/blob/v1.20.1/cluster/crds/apiextensions.crossplane.io_compositions.yaml
        quote: "All Compositions should use Pipeline mode. Resources mode is deprecated."
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/cluster/crds/apiextensions.crossplane.io_compositions.yaml
        quote: "default: Pipeline"
    semantics:
      - subject: {family: crd-field, product: crossplane, group: apiextensions.crossplane.io, kind: Composition, path: spec.mode}
        change: {type: validation-tightened, before: '"Resources"'}
        consequence:
          kind: migration-required
          exposedClass: action-required
          statement: The v2 Composition CRD only accepts mode Pipeline (enum [Pipeline], default changed from Resources to Pipeline) and Crossplane no longer implements patch-and-transform, so XRs and claims that use a Resources-mode Composition stop being composed.
          remediation: Convert each Resources-mode Composition with the v1.20 CLI (crossplane beta convert pipeline-composition) and switch XRs/claims to it before upgrading.
          severity: critical
        note: before names the value that was accepted (and was the CRD default) at v1.20 and is rejected at v2.0
      - subject: {family: crd-field, product: crossplane, group: apiextensions.crossplane.io, kind: Composition, path: spec.resources}
        change:
          type: removed
          replacedBy: {family: crd-field, product: crossplane, group: apiextensions.crossplane.io, kind: Composition, path: spec.pipeline}
        consequence:
          kind: migration-required
          exposedClass: action-required
          statement: spec.resources (and spec.patchSets) are no longer part of the v2 Composition schema, so the patch-and-transform templates of an unmigrated Composition are dropped and its composed resources are no longer managed.
          remediation: Move the resource templates into a function pipeline step (function-patch-and-transform) before upgrading.
          severity: critical

  - id: E2
    title: ControllerConfig type removed (replaced by DeploymentRuntimeConfig); spec.controllerConfigRef removed from package types
    kind: removal
    importance: critical
    actionRequired: true
    classification: not-affected   # class in this environment (link); generic release-level class: action-required
    match:
      - text: '(?i)ControllerConfig'
      - text: '(?i)convert deployment-runtime'
    evidence:
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/whats-new/_index.md
        quote: "Crossplane deprecated the `ControllerConfig` type in v1.11. It's replaced by the `DeploymentRuntimeConfig` type."
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/guides/upgrade-to-crossplane-v2.md
        quote: "Update any ControllerConfig resources to use DeploymentRuntimeConfig instead."
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "Remove `spec.controllerConfigRef` from package types by @negz in https://github.com/crossplane/crossplane/pull/6520"
    semantics:
      - subject: {family: gvk, product: crossplane, group: pkg.crossplane.io, version: v1alpha1, kind: ControllerConfig}
        change:
          type: removed
          replacedBy: {family: gvk, product: crossplane, group: pkg.crossplane.io, version: v1beta1, kind: DeploymentRuntimeConfig}
        consequence:
          kind: resource-rejected
          exposedClass: action-required
          statement: The v2.0.0 CRD set no longer contains controllerconfigs.pkg.crossplane.io, so ControllerConfig manifests are rejected and the provider runtime settings they carried are no longer applied.
          remediation: Convert with crossplane beta convert deployment-runtime (v1.20 CLI) and reference the DeploymentRuntimeConfig via spec.runtimeConfigRef.
          severity: high
      - subject: {family: crd-field, product: crossplane, group: pkg.crossplane.io, kind: Provider, path: spec.controllerConfigRef}
        change:
          type: removed
          replacedBy: {family: crd-field, product: crossplane, group: pkg.crossplane.io, kind: Provider, path: spec.runtimeConfigRef}
        consequence:
          kind: setting-ignored
          exposedClass: action-required
          statement: Providers that still point at a ControllerConfig through spec.controllerConfigRef lose that runtime configuration (IRSA annotations, pod settings) because the field no longer exists in the v2 Provider schema.
          remediation: Set spec.runtimeConfigRef to a DeploymentRuntimeConfig instead.
          severity: high

  - id: E3
    title: External secret stores (alpha) removed; --enable-external-secret-stores now stops Crossplane at startup and the StoreConfig API is gone
    kind: removal
    importance: important
    actionRequired: true
    classification: not-affected   # class in this environment (link); generic release-level class: action-required
    match:
      - text: '(?i)external secret stores?'
      - text: '(?i)enable-external-secret-stores'
      - text: '(?i)StoreConfig'
    evidence:
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/whats-new/_index.md
        quote: "Crossplane added external secret stores in v1.7. External secret stores have remained in alpha for over two years and are now unmaintained."
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/guides/upgrade-to-crossplane-v2.md
        quote: "If you're using external secret stores, migrate to native Kubernetes secrets or [External Secrets Operator](https://external-secrets.io/latest/) before upgrading."
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/cmd/crossplane/core/core.go
        quote: "Crossplane removed support for external secret stores. The --enable-external-secret-stores flag will be removed in a future release."
    semantics:
      - subject: {family: cli-flag, product: crossplane, name: --enable-external-secret-stores, component: crossplane}
        change: {type: removed}
        consequence:
          kind: workload-failure
          exposedClass: action-required
          statement: With --enable-external-secret-stores in the core args, crossplane core start returns the error "Crossplane removed support for external secret stores" and the Crossplane pod never becomes ready.
          remediation: Move connection details to in-cluster Secrets (writeConnectionSecretToRef) or External Secrets Operator PushSecrets, then drop the flag.
          severity: critical
      - subject: {family: gvk, product: crossplane, group: secrets.crossplane.io, version: v1alpha1, kind: StoreConfig}
        change: {type: removed}
        consequence:
          kind: resource-rejected
          exposedClass: action-required
          statement: The v2.0.0 CRD set no longer contains storeconfigs.secrets.crossplane.io, so StoreConfig manifests are rejected and nothing publishes connection details to external stores.
          severity: high

  - id: E4
    title: Default package registry removed; every package (and dependency) must be a fully qualified image reference and --registry is rejected
    kind: breaking
    importance: critical
    actionRequired: true
    classification: action-required
    match:
      - text: '(?i)default registry'
      - text: '(?i)fully qualified (image|package|url)'
      - text: '(?i)--registry\b'
    evidence:
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "If a registry is not specified, then an error will be returned for the package."
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/whats-new/_index.md
        quote: "Crossplane v2 drops the `--registry` flag that allowed users to specify a default registry value and now requires users to always specify a fully qualified URL when installing packages, both directly via `spec.package` and indirectly as dependencies."
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/cluster/crds/pkg.crossplane.io_providers.yaml
        quote: "must be a fully qualified image name, including the registry, repository, and tag or digest."
      - url: https://github.com/crossplane/crossplane/blob/v1.20.1/cmd/crossplane/main.go
        quote: 'DefaultRegistry string = "xpkg.crossplane.io"'
    semantics:
      - subject: {family: crd-field, product: crossplane, group: pkg.crossplane.io, kind: Function, path: spec.package}
        change: {type: validation-tightened}
        consequence:
          kind: resource-rejected
          exposedClass: action-required
          statement: A Function whose spec.package has no registry host (crossplane-contrib/function-patch-and-transform:v0.9.0) fails the v2 CEL rule and Crossplane returns an error for the package instead of resolving it against xpkg.crossplane.io, so the function is not installed or upgraded and pipelines using it fail.
          remediation: Prefix the package with its registry (xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.9.0) before upgrading; check package dependencies too.
          severity: critical
      - subject: {family: crd-field, product: crossplane, group: pkg.crossplane.io, kind: Provider, path: spec.package}
        change: {type: validation-tightened}
        consequence:
          kind: resource-rejected
          exposedClass: action-required
          statement: A Provider whose spec.package has no registry host is rejected by the v2 CEL validation and errors in the package manager.
          severity: critical
      - subject: {family: crd-field, product: crossplane, group: pkg.crossplane.io, kind: Configuration, path: spec.package}
        change: {type: validation-tightened}
        consequence:
          kind: resource-rejected
          exposedClass: action-required
          statement: A Configuration whose spec.package (or one of its dependencies) has no registry host errors in the package manager.
          severity: critical
      - subject: {family: cli-flag, product: crossplane, name: --registry, component: crossplane}
        change: {type: removed}
        consequence:
          kind: workload-failure
          exposedClass: action-required
          statement: Crossplane core start returns an error when --registry is set, so the Crossplane pod does not start.
          severity: critical

  - id: E5
    title: Composite resource connection details removed for modern (Namespaced/Cluster) XRs; LegacyCluster XRs from v1 XRDs keep them
    kind: removal
    importance: important
    actionRequired: true
    classification: not-affected   # class in this environment (link); generic release-level class: action-required
    match:
      - text: '(?i)composite resource connection details'
      - text: '(?i)writeConnectionSecretToRef.{0,20}v2 XRs'
      - text: '(?i)XR connection secrets'
    evidence:
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "Composite resources no longer have native connection details support."
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/cluster/crds/apiextensions.crossplane.io_compositeresourcedefinitions.yaml
        quote: "Only LegacyCluster XRs support connection secrets."
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/internal/controller/apiextensions/composite/reconciler.go
        quote: "Modern v2 XRs don't support connection details, but legacy v1 XRs do."
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/whats-new/_index.md
        quote: "When you use v1 of the XRD API `scope` defaults to a special `LegacyCluster` mode."
    semantics:
      subject: {family: crd-field, product: crossplane, group: apiextensions.crossplane.io, kind: CompositeResourceDefinition, path: spec.connectionSecretKeys}
      change: {type: removed}
      consequence:
        kind: setting-ignored
        exposedClass: action-required
        statement: For an XRD with scope Namespaced or Cluster (the apiextensions.crossplane.io/v2 default is Namespaced), Crossplane does not publish XR connection details, so consumers expecting the connection Secret get nothing.
        remediation: Compose the connection details Secret explicitly in the function pipeline (connection details composition guide).
        severity: high
      note: removal is scoped to modern XRs; the definition reconciler still wires a secret publisher when scope is LegacyCluster (the v1 XRD default)

  - id: E6
    title: CompositeResourceDefinition apiextensions.crossplane.io/v1 deprecated in favour of v2
    kind: deprecation
    importance: important
    actionRequired: false
    classification: review-required
    match:
      - text: '(?i)CompositeResourceDefinition v1 is deprecated'
      - text: '(?i)deprecation warning for v1 XRD'
    evidence:
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/cluster/crds/apiextensions.crossplane.io_compositeresourcedefinitions.yaml
        quote: "CompositeResourceDefinition v1 is deprecated and will be removed in a future release; consider migrating to v2"
      - url: https://github.com/crossplane/crossplane/commit/0cc3abf419fd1118d25bdc2504eee3b2bb39f2e1
        quote: "add deprecation warning for v1 XRD"
    semantics:
      subject: {family: gvk, product: crossplane, group: apiextensions.crossplane.io, version: v1, kind: CompositeResourceDefinition}
      change:
        type: deprecated
        replacedBy: {family: gvk, product: crossplane, group: apiextensions.crossplane.io, version: v2, kind: CompositeResourceDefinition}
      consequence:
        kind: deprecation
        exposedClass: review-required
        statement: v1 XRDs keep working (LegacyCluster scope, claims) but the API server returns a deprecation warning on every apply and the version is scheduled for removal.
        remediation: Plan the move to apiextensions.crossplane.io/v2 (no automated migration tooling for existing XRs yet, crossplane/crossplane#6726).
        severity: low

  - id: E7
    title: Upgrade providers to v2 releases (e.g. provider-aws-s3 v2.0.0) that serve both legacy cluster-scoped and namespaced managed resources
    kind: compatibility
    importance: minor
    actionRequired: false
    classification: informational
    match:
      - text: '(?i)upgrade (your )?providers'
      - text: '(?i)both\s+(legacy\s+)?(namespaced\s+and\s+cluster.scoped|cluster.scoped\s+and\s+(new\s+)?namespaced)\s+managed\s+resources'
    evidence:
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/guides/upgrade-to-crossplane-v2.md
        quote: "Upgrade your providers to versions that support both namespaced and cluster-scoped managed resources:"
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/guides/upgrade-to-crossplane-v2.md
        quote: "Provider v2 releases support both legacy cluster-scoped and new namespaced managed resources. Your existing cluster-scoped MRs continue working unchanged."
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/guides/upgrade-to-crossplane-v2.md
        quote: "For example `provider-aws-s3:v2.0.0` has two `Bucket` MRs:"
    semantics:
      subject: {family: product-relationship, product: crossplane, name: provider-aws-s3}
      change: {type: requirement-changed, after: '>=2.0.0'}
      consequence:
        kind: none
        exposedClass: informational
        statement: Existing cluster-scoped MRs keep working with provider-aws-s3 v1.x; the namespaced s3.aws.m.upbound.io MRs only exist from provider v2.0.0.
        remediation: Upgrade the provider after Crossplane core (upgrade guide step 4) when namespaced MRs are wanted.
      note: the guide frames this as step 4 of the recommended approach, not a precondition; the >=2.0.0 bound comes from its provider-aws-s3:v2.0.0 example

  - id: E8
    title: Retired core feature flags now break startup (--enable-composition-webhook-schema-validation errors; GA no-op flags --enable-composition-revisions/-functions/-functions-extra-resources removed)
    kind: breaking
    importance: critical
    actionRequired: true
    classification: action-required
    match:
      - text: '(?i)enable-composition-webhook-schema-validation'
      - text: '(?i)structural Composition validation'
      - text: '(?i)Cleanup core flags'
      - text: '(?i)enable-composition-(revisions|functions)'
    evidence:
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/cmd/crossplane/core/core.go
        quote: "Crossplane now uses CEL to validate Compositions. The --enable-composition-webhook-schema-validation flag will be removed in a future release."
      - url: https://github.com/crossplane/crossplane/blob/v2.0.0/cmd/crossplane/core/core.go
        quote: "These are features that we've removed support for. Crossplane returns an error when you enable them."
      - url: https://github.com/crossplane/crossplane/commit/8bf617ac571095c0b5e2b2b72bfedef2aaf4b308
        quote: "Also, add errors for flags that won't do anything anymore in v2."
      - url: https://github.com/crossplane/crossplane/blob/v1.20.1/cmd/crossplane/core/core.go
        quote: "These are GA features that previously had alpha or beta feature flags. You can't turn off a GA feature. We maintain the flags to avoid breaking folks who are passing them, but they do nothing."
    semantics:
      - subject: {family: cli-flag, product: crossplane, name: --enable-composition-webhook-schema-validation, component: crossplane}
        change: {type: removed}
        consequence:
          kind: workload-failure
          exposedClass: action-required
          statement: With --enable-composition-webhook-schema-validation in the core args, crossplane core start returns "Crossplane now uses CEL to validate Compositions" as an error and the v2 Crossplane pod crash-loops.
          remediation: Remove the flag from the Helm args before upgrading.
          severity: critical
      - subject: {family: cli-flag, product: crossplane, name: --enable-composition-functions, component: crossplane}
        change: {type: removed}
        consequence:
          kind: workload-failure
          exposedClass: action-required
          statement: The hidden no-op flag no longer exists in the v2 start command, so passing it makes the command-line parser reject the arguments and the Crossplane pod does not start.
          remediation: Remove --enable-composition-revisions, --enable-composition-functions and --enable-composition-functions-extra-resources from the Helm args.
          severity: critical
        note: the same holds for --enable-composition-revisions and --enable-composition-functions-extra-resources (one subject per flag the fixture uses)

  - id: E9
    title: Upgrade to v2.0 only from v1.20 (one minor version at a time) so Crossplane's CRD storage migrations run
    kind: migration-step
    importance: critical
    actionRequired: true
    classification: not-affected   # class in this environment (link); generic release-level class: action-required
    match:
      - text: '(?i)one minor version at a time'
      - text: '(?i)upgrade (to (crossplane )?v2(\.0)? )?from (crossplane )?`?v1\.20'
      - text: '(?i)running a `?v1\.20`? version before you upgrade'
    evidence:
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "To reiterate, you should be running a `v1.20` version before you upgrade to `v2.0`."
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "Upon upgrade for each minor release, Crossplane performs any necessary migrations of its CRDs to ensure the latest versions are stored in the Kubernetes API server. Therefore, it is important to upgrade sequentially through one minor version at a time."
      - url: https://github.com/crossplane/docs/blob/v2.0-archive/content/v2.0/guides/upgrade-to-crossplane-v2.md
        quote: "Only upgrade to Crossplane v2 from Crossplane `v1.20`, the final `v1.x` release."
    semantics:
      subject: {family: migration, product: crossplane, name: sequential-minor-upgrade-via-v1.20}
      change: {type: migration-required}
      consequence:
        kind: migration-required
        exposedClass: action-required
        statement: Jumping to v2.0 from a release older than v1.20 skips the CRD storage migrations Crossplane performs on each minor upgrade, so the API server can be left storing Crossplane objects at versions other than the latest ones v2.0 expects.
        remediation: Upgrade to the latest v1.20 patch first, then to v2.0.
        severity: critical

  - id: E10
    title: Prometheus metric names changed (crossplane_composition_* to engine_* / function_run_function_*)
    kind: behaviour-change
    importance: important
    actionRequired: true
    classification: unknown   # class in this environment (link); generic release-level class: review-required
    match:
      - text: '(?i)crossplane_composition_(controllers|watches|run_function)'
      - text: '(?i)metrics name changes'
      - text: '(?i)Update metrics to reflect function and controller scope'
    evidence:
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "The names of these metrics have been updated as follows:"
      - url: https://github.com/crossplane/crossplane/releases/tag/v2.0.0
        quote: "`crossplane_composition_run_function_*` --> `function_run_function_*`"
    semantics:
      - subject: {family: api-endpoint, product: crossplane, name: 'metric crossplane_composition_controllers_*', component: metrics}
        change:
          type: renamed
          replacedBy: {family: api-endpoint, product: crossplane, name: 'metric engine_controllers_*', component: metrics}
        consequence:
          kind: behavior-change
          exposedClass: review-required
          statement: Dashboards and alerts querying the old series names return no data after the upgrade.
          remediation: Rename the series in PromQL queries, recording rules and dashboards.
          severity: medium
      - subject: {family: api-endpoint, product: crossplane, name: 'metric crossplane_composition_watches_*', component: metrics}
        change:
          type: renamed
          replacedBy: {family: api-endpoint, product: crossplane, name: 'metric engine_watches_*', component: metrics}
        consequence:
          kind: behavior-change
          exposedClass: review-required
          statement: Dashboards and alerts querying the old series names return no data after the upgrade.
          severity: medium
      - subject: {family: api-endpoint, product: crossplane, name: 'metric crossplane_composition_run_function_*', component: metrics}
        change:
          type: renamed
          replacedBy: {family: api-endpoint, product: crossplane, name: 'metric function_run_function_*', component: metrics}
        consequence:
          kind: behavior-change
          exposedClass: review-required
          statement: Dashboards and alerts querying the old series names return no data after the upgrade.
          severity: medium
notExpected:
  - title: CI action digest bumps from Renovate listed in the release body
    match:
      - text: '(?i)update (github/codeql-action|actions/[a-z-]+|docker/login-action|bufbuild/buf-action|mheap/require-checklist-action) digest'
    classification: action-required
environment:
  description: >-
    Production control plane on Kubernetes 1.31. Crossplane v1.20.1 is installed
    with the Helm chart; its values pass the core args
    --enable-composition-webhook-schema-validation, --enable-composition-functions,
