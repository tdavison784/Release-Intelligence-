# Platform API: an S3 bucket abstraction offered to teams through a claim.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xbuckets.platform.example.org
spec:
  group: platform.example.org
  names:
    kind: XBucket
    plural: xbuckets
  claimNames:
    kind: Bucket
    plural: buckets
  connectionSecretKeys:
    - bucketName
    - region
  defaultCompositionRef:
    name: xbuckets-aws-pt
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                  default: eu-west-1
---
apiVersion: platform.example.org/v1alpha1
kind: Bucket
metadata:
  name: reports
  namespace: team-a
spec:
  region: eu-west-1
  compositionRef:
    name: xbuckets-aws-pt
  writeConnectionSecretToRef:
    name: reports-bucket-conn
