# Application routes, already in the traefik.io API group.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shop
  namespace: shop
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`shop.example.com`, `www.shop.example.com`)
      kind: Rule
      services:
        - name: shop-frontend
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orders-api
  namespace: shop
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.example.com`) && PathPrefix(`/orders`)
      kind: Rule
      middlewares:
        - name: office-only
      services:
        - name: orders
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: office-only
  namespace: shop
spec:
  ipAllowList:
    sourceRange:
      - 203.0.113.0/24
      - 198.51.100.17/32
