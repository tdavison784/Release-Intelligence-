# Gateway API objects served by the (experimental) Kubernetes Gateway
# provider. Only HTTP routing is used: no TCPRoute or TLSRoute exists.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: Gateway
metadata:
  name: internal
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: HTTPRoute
metadata:
  name: status-page
  namespace: status
spec:
  parentRefs:
    - name: internal
      namespace: traefik
  hostnames:
    - status.internal.example.com
  rules:
    - backendRefs:
        - name: status-page
          port: 80
