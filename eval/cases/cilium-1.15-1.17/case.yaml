id: cilium-1.15-1.17
product: cilium
from: v1.15.6
to: v1.17.0
researchedAt: "2026-10-01"
sources:
  - https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst   # 1.16 Upgrade Notes (the 1.15→1.16 hop)
  - https://github.com/cilium/cilium/blob/v1.17.0/Documentation/operations/upgrade.rst   # 1.17 Upgrade Notes (the 1.16→1.17 hop)
  - https://github.com/cilium/cilium/blob/1.15.6/install/kubernetes/cilium/values.yaml
  - https://github.com/cilium/cilium/blob/1.16.0/install/kubernetes/cilium/values.yaml
  - https://github.com/cilium/cilium/blob/1.17.0/install/kubernetes/cilium/values.yaml
expected:
  # --- hop 1: v1.15.6 → v1.16.0 (cited from the 1.16 Upgrade Notes) ---
  # Change type covered: mandatory intermediate-version requirement (multi-hop).
  - id: E1
    title: toFQDNs state migration requires running Cilium v1.15.6 or newer before upgrading to v1.16
    kind: compatibility
    importance: critical
    actionRequired: true        # the upgrade path itself is version-gated
    classification: not-affected      # corrected 2026-10-01 (eval/CHANGELOG.md): this case's edge starts at v1.15.6, which already meets the precondition
    match:
      - text: '(?i)toFQDNs.*1\.15\.6|1\.15\.6 or newer'
      - text: '(?i)toFQDNs'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "To avoid drops during upgrades in clusters with ``toFQDNs`` policies, it is required to run Cilium v1.15.6 or newer before upgrading to Cilium v1.16."
    semantics:
      subject: {family: migration, product: cilium, name: run-v1.15.6-or-newer-before-v1.16, component: toFQDNs}
      change: {type: migration-required}
      consequence:
        kind: migration-required
        exposedClass: action-required
        statement: clusters with toFQDNs policies that upgrade to v1.16 from a release older than v1.15.6 drop traffic matched by those policies during the upgrade.
        remediation: upgrade to v1.15.6 or newer first
  # Change type covered: CRD field removal announced for this minor.
  - id: E2
    title: CiliumLoadBalancerIPPool spec.cidrs removed in v1.16 (deprecated in v1.15) — migrate to spec.blocks; allowFirstLastIPs default changed to "yes"
    kind: crd-schema
    importance: critical
    actionRequired: true
    classification: action-required   # pools still on cidrs stop being served
    match:
      - text: '(?i)allowFirstLastIPs|spec\.cidrs|CiliumLoadBalancerIPPool'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "The ``CiliumLoadBalancerIPPool.spec.cidrs`` field has been deprecated in v1.15 favor of ``CiliumLoadBalancerIPPool.spec.blocks``. … The ``cidrs`` field will be removed in v1.16. Please update your IP pool configurations to use ``blocks`` instead of ``cidrs`` before upgrading."
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "The default value of of ``CiliumLoadBalancerIPPool.spec.allowFirstLastIPs`` has been changed to ``yes``."
    semantics:
      - subject: {family: crd-field, product: cilium, group: cilium.io, kind: CiliumLoadBalancerIPPool, path: spec.cidrs}
        change:
          type: removed
          replacedBy: {family: crd-field, product: cilium, group: cilium.io, kind: CiliumLoadBalancerIPPool, path: spec.blocks}
        consequence:
          kind: resource-rejected
          exposedClass: action-required
          statement: IP pools that still use spec.cidrs are not valid against the v1.16 CRD, so their addresses are no longer allocated to LoadBalancer services.
          remediation: move the pools to spec.blocks before upgrading
      - subject: {family: crd-field, product: cilium, group: cilium.io, kind: CiliumLoadBalancerIPPool, path: spec.allowFirstLastIPs}
        change: {type: default-changed, before: '"No"', after: '"Yes"'}
        consequence:
          kind: behavior-change
          exposedClass: review-required
          statement: pools that do not set allowFirstLastIPs start handing out the first and last address of each block.
  # Change type covered: API version migration of a shipped CRD.
  - id: E3
    title: Gateway API GRPCRoute moved from v1alpha2 to v1 — install the new CRD and migrate resources
    kind: api
    importance: important
    actionRequired: true
    classification: action-required
    match:
      - text: '(?i)GRPCRoute'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "Gateway API GRPCRoute which is moved from ``v1alpha2`` to ``v1``. Please install new GRPCRoute CRD and migrate your resources from ``v1alpha2`` to ``v1`` version."
    semantics:
      subject: {family: gvk, product: cilium, group: gateway.networking.k8s.io, version: v1alpha2, kind: GRPCRoute}
      change:
        type: removed
        replacedBy: {family: gvk, product: cilium, group: gateway.networking.k8s.io, version: v1, kind: GRPCRoute}
      consequence:
        kind: setting-ignored
        exposedClass: action-required
        statement: GRPCRoutes stored as v1alpha2 are no longer reconciled by Cilium's Gateway API support until the v1 CRD is installed and the resources migrated, so their gRPC routes stop being programmed.
  # Change type covered: Helm default change with upgradeCompatibility escape hatch.
  - id: E4
    title: Cilium Envoy DaemonSet now enabled by default for new installs; existing clusters keep old behavior via upgradeCompatibility
    kind: behaviour-change
    importance: important
    actionRequired: false       # capacity planning: one more Pod per node
    classification: review-required   # "Nodes at maximum Pod capacity will face an eviction" — depends on headroom the fixture cannot prove
    match:
      - text: '(?i)Envoy DaemonSet|envoy\.enabled'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "Cilium Envoy DaemonSet is now enabled by default for new installation if the helm attribute ``envoy.enabled`` is not specified … This change adds one additional Pod per Node, therefore Nodes at maximum Pod capacity will face an eviction of a single non-system critical Pod after upgrading."
    semantics:
      subject: {family: helm-value, product: cilium, path: envoy.enabled}
      change: {type: default-changed, before: 'false', after: 'true'}
      consequence:
        kind: behavior-change
        exposedClass: review-required
        statement: a separate cilium-envoy DaemonSet is deployed (one more Pod per node) when envoy.enabled is unset and upgradeCompatibility is not set to an older release; nodes at their Pod limit evict one non-critical Pod.
  # Change type covered: Helm key deprecation (1.16) that 1.17 then removes.
  - id: E5
    title: enableRuntimeDeviceDetection deprecated (native device detection is now the default); bpf.enableTCX default on kernels ≥ 6.6
    kind: helm-values
    importance: important
    actionRequired: false
    classification: informational     # a pin keeps winning / old kernels keep the default
    match:
      - text: '(?i)enableRuntimeDeviceDetection'
      - text: '(?i)bpf\.enableTCX|tcx BPF'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "The related Helm option ``enableRuntimeDeviceDetection`` has been deprecated and will be removed in future release."
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "For Linux kernels of version 6.6 or newer, Cilium by default switches to tcx BPF links … this option should be disabled via Helm through ``bpf.enableTCX=false``"
    semantics:
      - subject: {family: helm-value, product: cilium, path: enableRuntimeDeviceDetection}
        change: {type: deprecated}
        consequence: {kind: deprecation, exposedClass: review-required, statement: native device detection is now always on; the option will be removed in a future release}
      - subject: {family: helm-value, product: cilium, path: bpf.enableTCX}
        change: {type: default-changed, before: 'false', after: 'true'}
        consequence: {kind: behavior-change, exposedClass: review-required, statement: on kernels >= 6.6 Cilium attaches its BPF programs with tcx links instead of tc}
  # --- hop 2: v1.16 → v1.17 (cited from the 1.17 Upgrade Notes) ---
  # Change type covered: integration removal.
  - id: E6
    title: metallb-bgp integration removed (deprecated since 1.14); use the BGP control plane (bgpControlPlane) instead
    kind: removal
    importance: critical
    actionRequired: true
    classification: action-required
    match:
      - text: '(?i)metallb-bgp|metallb.bgp'
      - text: '(?i)bgpControlPlane'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.17.0/Documentation/operations/upgrade.rst
        quote: "Support for ``metallb-bgp``, deprecated since 1.14, has been removed."
    semantics:
      - subject: {family: helm-value, product: cilium, path: bgp.enabled}
        change: {type: removed}
        consequence: &cilE6
          kind: setting-ignored
          exposedClass: action-required
          statement: the metallb-bgp integration is gone, so LoadBalancer IPs (and pod CIDRs) are no longer announced over BGP and the services become unreachable from outside the cluster.
          remediation: move the announcements to the BGP control plane (bgpControlPlane) before upgrading
      - subject: {family: helm-value, product: cilium, path: bgp.announce.loadbalancerIP}
        change: {type: removed}
        consequence: *cilE6
      - subject: {family: helm-value, product: cilium, path: bgp.announce.podCIDR}
        change: {type: removed}
        consequence: *cilE6
  # Change type covered: annotation/behaviour removal.
  - id: E7
    title: L7 proxy-visibility Pod annotation removed (deprecated since v1.15)
    kind: removal
    importance: important
    actionRequired: true
    classification: action-required
    match:
      - text: '(?i)proxy-visibility|proxy visibility'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.17.0/Documentation/operations/upgrade.rst
        quote: "Support for L7 protocol visibility using Pod annotations (``policy.cilium.io/proxy-visibility``), deprecated since v1.15, has been removed."
    semantics:
      subject: {family: config-key, product: cilium, path: policy.cilium.io/proxy-visibility, component: pod-annotation}
      change: {type: removed}
      consequence:
        kind: setting-ignored
        exposedClass: action-required
        statement: Pods annotated with policy.cilium.io/proxy-visibility lose their L7 visibility (no L7 flows in Hubble).
        remediation: use L7 policies instead of the annotation
  # Change type covered: Helm key replaced.
  - id: E8
    title: Helm value tls.secretsBackend deprecated, replaced by tls.readSecretsOnlyFromSecretsNamespace (+ tls.secretSync)
    kind: helm-values
    importance: important
    actionRequired: true
    classification: review-required   # corrected 2026-10-01 from action-required (eval/CHANGELOG.md): the v1.17.0 chart still honours the key
    match:
      - text: '(?i)secretsBackend'
      - text: '(?i)readSecretsOnlyFromSecretsNamespace'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.17.0/Documentation/operations/upgrade.rst
        quote: "The Helm value ``tls.secretsBackend`` … has been deprecated and replaced with ``tls.readSecretsOnlyFromSecretsNamespace``"
      - url: https://github.com/cilium/cilium/blob/1.16.0/install/kubernetes/cilium/values.yaml
        quote: "tls: secretsBackend: local"
      - url: https://github.com/cilium/cilium/blob/1.17.0/install/kubernetes/cilium/values.yaml
        quote: "secretsBackend: ~"
    semantics:
      subject: {family: helm-value, product: cilium, path: tls.secretsBackend}
      change:
        type: deprecated
        replacedBy: {family: helm-value, product: cilium, path: tls.readSecretsOnlyFromSecretsNamespace}
      consequence:
        kind: deprecation
        exposedClass: review-required
        statement: the v1.17 chart still honours tls.secretsBackend when tls.readSecretsOnlyFromSecretsNamespace is unset (k8s → false, local → true; templates/_helpers.tpl at v1.17.0), but the key is deprecated in favour of the new one.
        remediation: set tls.readSecretsOnlyFromSecretsNamespace (false keeps the k8s behaviour) and drop tls.secretsBackend
  # Change type covered: removal across the hop boundary (deprecated in hop 1, removed in hop 2).
  - id: E9
    title: WireGuard userspace-mode fallback (wireguard.userspaceFallback) removed in v1.17 after v1.16 deprecation; kernel WireGuard required
    kind: removal
    importance: important
    actionRequired: true
    classification: action-required
    match:
      - text: '(?i)userspaceFallback|userspace-mode fallback'
    evidence:
      - url: https://github.com/cilium/cilium/blob/v1.16.0/Documentation/operations/upgrade.rst
        quote: "The built-in WireGuard userspace-mode fallback (Helm ``wireguard.userspaceFallback``) has been deprecated and will be removed in a future version of Cilium."
      - url: https://github.com/cilium/cilium/blob/v1.17.0/Documentation/operations/upgrade.rst
        quote: "The previously deprecated built-in WireGuard userspace-mode fallback (Helm ``wireguard.userspaceFallback``) has been removed."
    semantics:
      subject: {family: helm-value, product: cilium, path: encryption.wireguard.userspaceFallback}
      change: {type: removed}
      consequence:
        kind: workload-failure
        exposedClass: action-required
        statement: nodes without kernel WireGuard support can no longer run WireGuard transparent encryption, so encrypted pod traffic on them fails.
        remediation: ensure every node runs a kernel with WireGuard support before upgrading
notExpected:
  - title: metrics renames and new metrics are not operator upgrade blockers
    match: [{text: '(?i)policy_regeneration_total|endpoint_regenerations_total|Added Metrics'}]
environment:
  description: >-
    Production cluster running Cilium v1.15.6 installed via the Helm chart,
    upgrading across two minors to v1.17.0. The values file carries keys from
    both hops: the containerRuntime section (removed by the v1.16 chart), a
    pin of the old enableRuntimeDeviceDetection default (flipped in v1.16),
    the legacy metallb-bgp integration (bgp.enabled, removed in v1.17) and the
    deprecated tls.secretsBackend key. Hubble certificates are pinned to the
    old 1095-day validity. The mirror list pins the agent images to v1.15.6.
  kubernetes: "1.29"
  expectedImpact:
    - expected: E1
      relevance: not-affected  # corrected 2026-10-01 from action-required (eval/CHANGELOG.md)
      why: the environment runs Cilium v1.15.6 (the edge's from-version, also pinned in images.txt), which already satisfies "run v1.15.6 or newer before upgrading to v1.16" — the precondition is met, nothing to do
      exposure:
        op: all
        of:
          - {op: edge-from-version, state: out-of-range, range: '>=1.15.6'}
          - op: any
            of:
              - {op: resource, group: cilium.io, kind: CiliumNetworkPolicy, of: [{op: field, path: 'spec.egress[].toFQDNs', state: set}]}
              - {op: resource, group: cilium.io, kind: CiliumClusterwideNetworkPolicy, of: [{op: field, path: 'spec.egress[].toFQDNs', state: set}]}
      environmentEvidence: [from, images.txt#L2-L3]
    - expected: E6
      relevance: action-required
      why: the values file enables bgp.enabled/bgp.announce, which v1.17.0 removes; announcements must move to bgpControlPlane
      exposure: {op: values-key, path: bgp.enabled, state: equals, values: ['true']}
      environmentEvidence: values.yaml#L5-L8
    - expected: E8
      relevance: review        # corrected 2026-10-01 from action-required (eval/CHANGELOG.md)
      why: 'the values file sets tls.secretsBackend: k8s; the v1.17.0 chart deprecates it but still maps k8s to readSecretsOnlyFromSecretsNamespace=false while the new key is unset (templates/_helpers.tpl), so it keeps working — migrate to the replacement key'
      exposure:
        op: all
        of:
          - {op: values-key, path: tls.secretsBackend, state: set}
          - {op: values-key, path: tls.readSecretsOnlyFromSecretsNamespace, state: unset}
      overlap: {op: values-key, path: tls.readSecretsOnlyFromSecretsNamespace, state: set}
      environmentEvidence: values.yaml#L9-L10
  expectedFindings:
    - id: F1
      match:
        subject: containerRuntime.integration
        rule: impact:values-removed
      classification: action-required
      why: the values file sets a section the v1.16.0 chart removed (containerRuntime); the setting stops taking effect
    - id: F2
      match:
        subject: enableRuntimeDeviceDetection
      classification: informational
      why: the pin keeps the old explicit false; the v1.16.0 default flip does not change this cluster's setting
    - id: F3
      match:
        subject: bgp.enabled
        rule: impact:values-removed
      why: the user sets a key the v1.17.0 chart no longer has (metallb-bgp removed)
    - id: F4
      match:
        subject: tls.secretsBackend
      why: the user sets a key the v1.17.0 chart deprecates/empties; the replacement is readSecretsOnlyFromSecretsNamespace
    - id: F5
      match:
        subject: hubble.tls.auto.certValidityDuration
      classification: informational
      why: the user pins 1095 days, so the lowered 365-day default for new certificates does not change this cluster
  notExpectedFindings:
    - title: no Cilium CRD is removed by this upgrade
      match: {rule: impact:crd-removed}
      why: the CRD file sets of v1.15.6 and v1.17.0 are identical (repo tree comparison at both tags)
