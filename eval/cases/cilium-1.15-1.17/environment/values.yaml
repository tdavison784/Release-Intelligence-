# Cilium values as set by the platform team (v1.15.6 chart era).
containerRuntime:
  integration: containerd
enableRuntimeDeviceDetection: false
bgp:
  enabled: true
  announce:
    loadbalancerIP: true
tls:
  secretsBackend: k8s
hubble:
  enabled: true
  tls:
    auto:
      certValidityDuration: 1095
