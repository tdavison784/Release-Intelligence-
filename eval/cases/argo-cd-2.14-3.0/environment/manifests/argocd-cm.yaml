# argocd-cm as shipped by the declarative (manifest/kustomize) install this
# environment uses — verbatim shape of manifests/base/config/argocd-cm.yaml at
# v2.14.5: the ConfigMap is present with no data keys (every documented key is
# optional/commented upstream). The platform sets no RBAC override keys here:
# no server.rbac.disableApplicationFineGrainedRBACInheritance, no
# server.rbac.log.enforce.enable, no resource.exclusions override.
# https://github.com/argoproj/argo-cd/blob/v2.14.5/manifests/base/config/argocd-cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argo-cd
