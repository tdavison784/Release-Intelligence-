apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: prod-kafka
spec:
  replicas: 3
  roles:
    - broker
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 500Gi
        class: fast-ssd
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: prod-kafka
spec:
  kafka:
    metadataVersion: 3.8-IV0
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
    logging:
      type: external
      valueFrom:
        configMapKeyRef:
          name: kafka-logging
          key: log4j.properties
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: dc-failover
spec:
  version: 3.8.0
  connectCluster: "target"
  clusters:
    - alias: "source"
      bootstrapServers: source-kafka:9092
    - alias: "target"
      bootstrapServers: prod-kafka:9092
  mirrors:
    - sourceCluster: "source"
      targetCluster: "target"
      topicsPattern: ".*"
      groupsPattern: ".*"
