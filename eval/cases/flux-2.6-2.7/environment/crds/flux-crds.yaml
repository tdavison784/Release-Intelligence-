spec:
  group: notification.toolkit.fluxcd.io
  names:
    kind: Alert
    plural: alerts
  scope: Namespaced
  versions:
    - name: v1beta1
      deprecated: true
      served: true
      storage: false
    - name: v1beta2
      deprecated: true
      served: true
      storage: false
    - name: v1beta3
      served: true
      storage: true
status:
  storedVersions:
    - v1beta1
    - v1beta2
    - v1beta3
