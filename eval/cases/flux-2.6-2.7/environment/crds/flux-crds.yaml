# (Flux v2.6.4). openAPIV3Schema bodies, conversion and managedFields elided; versions,
# served/storage/deprecated flags and status.storedVersions are as exported. The cluster
# was first bootstrapped in 2021 on Flux v0.x (image automation added in 2022) and upgraded
# in place ever since, so the storage versions of every era are still recorded in
# status.storedVersions.
