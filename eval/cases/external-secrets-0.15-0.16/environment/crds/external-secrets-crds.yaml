# Installed external-secrets.io CRDs, exported with
# `kubectl get crd <name> -o yaml` from the running cluster (chart 0.15.0,
# installCRDs: true, crds.conversion.enabled: true). Trimmed for size: the
# openAPIV3Schema of each version is reduced to its root and
# managedFields/printer columns are dropped. spec.versions, spec.conversion
# and status.storedVersions are as exported. ESO was first installed on this
# cluster in 2021 (v0.3.x), when v1alpha1 was the storage version.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: externalsecrets.external-secrets.io
  labels:
    app.kubernetes.io/managed-by: Helm
    external-secrets.io/component: controller
  annotations:
    meta.helm.sh/release-name: external-secrets
    meta.helm.sh/release-namespace: external-secrets
spec:
  group: external-secrets.io
  names:
    categories:
      - external-secrets
    kind: ExternalSecret
    listKind: ExternalSecretList
    plural: externalsecrets
    shortNames:
      - es
    singular: externalsecret
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions:
        - v1
      clientConfig:
        service:
          name: external-secrets-webhook
          namespace: external-secrets
          path: /convert
status:
  storedVersions:
    - v1alpha1
    - v1beta1
