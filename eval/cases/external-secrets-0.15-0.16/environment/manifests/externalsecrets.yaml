# ExternalSecrets as committed in the platform GitOps repository. All of them
# were moved to external-secrets.io/v1beta1 in 2023; the billing team's
# template was never rewritten for engine v2.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-db
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: payments-aws
  target:
    name: payments-db
  data:
    - secretKey: username
      remoteRef:
        key: prod/payments/db
        property: username
    - secretKey: password
      remoteRef:
        key: prod/payments/db
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orders-api
  namespace: orders
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: orders-api
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .user }}:{{ .pass }}@orders-db:5432/orders"
  data:
    - secretKey: user
      remoteRef:
        key: orders/db
        property: user
    - secretKey: pass
      remoteRef:
        key: orders/db
        property: pass
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: billing-grafana-datasource
  namespace: billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: billing-grafana-datasource
    template:
      engineVersion: v1
      data:
        datasources.yaml: |
          datasources:
          - name: Billing
            type: postgres
            url: billing-db:5432
            user: "{{ .user | toString }}"
            secureJsonData:
              password: "{{ .password | toString }}"
  data:
    - secretKey: user
      remoteRef:
        key: billing/grafana
        property: user
    - secretKey: password
      remoteRef:
        key: billing/grafana
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smoke-credentials
  namespace: eso-smoke
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: fake-smoke
  target:
    name: smoke-credentials
  data:
    - secretKey: username
      remoteRef:
        key: /smoke/username
        version: v1
    - secretKey: password
      remoteRef:
        key: /smoke/password
        version: v1
