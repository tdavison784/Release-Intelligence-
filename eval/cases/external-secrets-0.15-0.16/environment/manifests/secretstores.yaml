# Secret stores as committed in the platform GitOps repository.
# The payments team's store was written in 2021 and never migrated off
# external-secrets.io/v1alpha1; the platform-owned cluster stores were
# rewritten on v1beta1 when the Vault integration was added.
apiVersion: external-secrets.io/v1alpha1
kind: SecretStore
metadata:
  name: payments-aws
  namespace: payments
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: payments-aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: payments-aws-credentials
            key: secret-access-key
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: https://vault.internal.example.com:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-prod
          role: external-secrets
          serviceAccountRef:
            name: vault-auth
            namespace: external-secrets
---
# Store used by the e2e smoke tests in the "eso-smoke" namespace. Only plain
# key/value entries; no valueMap entries.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: fake-smoke
spec:
  conditions:
    - namespaces:
        - eso-smoke
  provider:
    fake:
      data:
        - key: /smoke/username
          value: smoke-user
          version: v1
        - key: /smoke/password
          value: not-a-real-password
          version: v1
