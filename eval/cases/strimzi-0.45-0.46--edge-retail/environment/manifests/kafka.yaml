apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: edge-nodes
  labels:
    strimzi.io/cluster: edge-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 200Gi
    class: local-nvme
    deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: edge-kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: "3.9.0"
    metadataVersion: "3.9-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: true
        configuration:
          brokers:
            - broker: 0
              advertisedHost: edge-kafka-0.retail-edge.example.com
              advertisedPort: 32400
            - broker: 1
              advertisedHost: edge-kafka-1.retail-edge.example.com
              advertisedPort: 32401
            - broker: 2
              advertisedHost: edge-kafka-2.retail-edge.example.com
              advertisedPort: 32402
    authorization:
      type: opa
      url: http://opa.retail-edge.svc.cluster.local:8181/v1/data/kafka/authz/allow
      delegateToKafkaAcls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      default.replication.factor: 3
      min.insync.replicas: 2
    logging:
      type: external
      valueFrom:
        configMapKeyRef:
          name: edge-kafka-logging
          key: log4j.properties
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: edge-kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator: {}
    userOperator: {}
