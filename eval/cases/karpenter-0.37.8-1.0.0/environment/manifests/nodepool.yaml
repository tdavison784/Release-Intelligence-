apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: general-purpose
spec:
  template:
    spec:
      requirements:
        - key: karpenter.k8s.io/instance-category
          operator: In
          values: ["c", "m"]
      kubelet:
        systemReserved:
          cpu: 200m
  limits:
    cpu: 200
  disruption:
    consolidationPolicy: WhenUnderutilized
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: prod-cluster}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: prod-cluster}
  role: KarpenterNodeRole-prod
