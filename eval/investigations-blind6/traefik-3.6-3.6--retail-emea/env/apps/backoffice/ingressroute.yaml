apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backoffice
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`backoffice.retail-emea.example.com`)
      middlewares:
        - name: edge
      services:
        - name: backoffice
          port: 80
  tls: {}
