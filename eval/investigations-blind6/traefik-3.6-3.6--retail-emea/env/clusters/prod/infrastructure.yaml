apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/traefik
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-middlewares
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: traefik
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/edge-middlewares
  prune: true
