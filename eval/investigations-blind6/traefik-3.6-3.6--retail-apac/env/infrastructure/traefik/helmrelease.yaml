apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: 39.0.5
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      replicas: 2
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
        # Application namespaces attach the platform's shared edge middlewares
        # (infrastructure/edge-middlewares, namespace traefik).
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false
    service:
      type: LoadBalancer
    logs:
      general:
        level: INFO
      access:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
