environment:
  id: treasury-prod-us
  root: env/
  entrypoints:
    - clusters/prod/kustomization.yaml
  kubernetes: "1.34"
  description: >-
    Production cluster of the treasury platform, managed by Argo CD from this repository
    (app-of-apps rooted at clusters/prod). cert-manager is installed from the upstream Helm chart
    with the values in platform/cert-manager/values.yaml. All internal serving certificates come
    from the vault-pki ClusterIssuer (platform/pki), backed by the security team's Vault, which
