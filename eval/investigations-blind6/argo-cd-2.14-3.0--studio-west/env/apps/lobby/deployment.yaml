apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby
  labels:
    app: lobby
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lobby
  template:
    metadata:
      labels:
        app: lobby
    spec:
      containers:
        - name: lobby
          image: registry.example.com/studio/lobby:4.12.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_FORMAT
              value: json
