apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  labels:
    app: ledger-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
    spec:
      containers:
        - name: api
          image: traefik/whoami:v1.10.3
          args: ["--port=8443", "--cert=/tls/tls.crt", "--key=/tls/tls.key", "--name=ledger-api"]
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: tls
          secret:
            secretName: ledger-api-tls
