# Database credentials, rotated in AWS Secrets Manager by the DBA team; refreshed hourly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: orders-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: orders/prod/db
        property: username
    - secretKey: password
      remoteRef:
        key: orders/prod/db
        property: password
