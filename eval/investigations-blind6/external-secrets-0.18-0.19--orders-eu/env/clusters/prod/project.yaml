apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons and platform configuration
  sourceRepos:
    - https://git.example.com/orders/gitops-orders-eu.git
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
