apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://git.example.com/orders/gitops-orders-eu.git
    targetRevision: main
    path: platform/secret-stores
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
