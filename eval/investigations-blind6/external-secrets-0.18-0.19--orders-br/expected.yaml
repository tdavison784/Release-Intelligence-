    item: B1
    impact: breaking        # breaking under client-side apply, harmless under server-side apply (the withheld input decides)
  - diff: observed/render.diff#L1536-L1611
    object: CustomResourceDefinition/sshkeys.generators.external-secrets.io
    change: added (new generator)
