apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: orders
  destination:
    name: orders-prod-br
  source:
    repoURL: https://git.example.com/orders/gitops-orders-br.git
    targetRevision: main
    path: platform/secret-stores
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
