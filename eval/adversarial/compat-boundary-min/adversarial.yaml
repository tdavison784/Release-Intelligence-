# Attack: the cluster sits EXACTLY on the minimum of the target's supported
# range. Off-by-one boundary handling flags it; inclusive boundaries admit it.
id: compat-boundary-min
attacks: cluster version exactly at minimum boundary
expectation: >-
  the minimum admits → informational in-range (impact:kubernetes-in-range),
  never below-range
edge:
  changes:
    - rule: note
      title: "Kubernetes support: v2.0.0 supports Kubernetes 1.27-1.29"
      subjects: [kubernetes/supported]
      category: compatibility
  compatibility:
    - platform: kubernetes
      kind: supported
      versions: ["1.27", "1.28", "1.29"]
environment:
  kubernetes: "1.27"
expect:
  present:
    - rule: impact:kubernetes-in-range
      classification: informational
  absent:
    - rule: impact:kubernetes-below-range
