apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: external-secrets
name: external-secrets
homepage: https://github.com/external-secrets/external-secrets
versioning:
  scheme: semver
  tagPrefix: v
  tagPattern: ^v(?P<version>\d+\.\d+\.\d+(?:-(?:rc\d+))?)$
  lineage: linear
sources:
  - id: tags
    roles:
      - versions
    locator:
      kind: git-tags
      repository: github.com/external-secrets/external-secrets
      tagPattern: ^v(?P<version>\d+\.\d+\.\d+(?:-(?:rc\d+))?)$
  - id: github-releases
    roles:
      - versions
    locator:
      kind: github-releases
      repository: external-secrets/external-secrets
    priority: 1
  - id: release-notes-github
    roles:
      - release-notes
    locator:
      kind: github-releases
      repository: external-secrets/external-secrets
      ref: '{{.Tag}}'
    fallbackGroup: release-notes
    validatedAgainst:
      - 2.8.0
      - 2.9.0
      - 2.10.0
      - 2.11.0
  - id: advisories
    roles:
      - security
    locator:
      kind: github-advisories
      repository: external-secrets/external-secrets
    notes: 'Security policy: SECURITY.md'
artifacts:
  - id: external-secrets-chart
    type: helm-chart
    name: external-secrets
    version:
      strategy: lookup
      field: appVersion
      match: '{{.Tag}}'
      select: latest
    channels:
      - kind: helm-repo
        url: https://external-secrets.github.io/external-secrets
        chart: external-secrets
      - kind: helm-repo
        url: https://charts.external-secrets.io
        chart: external-secrets
      - kind: helm-repo
        url: https://raw.githubusercontent.com/external-secrets/external-secrets/gh-pages
        chart: external-secrets
      - kind: helm-git
        repository: github.com/external-secrets/external-secrets
        path: deploy/charts/external-secrets
        tagPattern: ^helm-chart-(?P<version>\d+\.\d+\.\d+)$
    contents:
      - kind: helm-values
        locator:
          kind: repo-file
          repository: github.com/external-secrets/external-secrets
          path: deploy/charts/external-secrets/values.yaml
      - kind: chart-metadata
        locator:
          kind: repo-file
          repository: github.com/external-secrets/external-secrets
          path: deploy/charts/external-secrets/Chart.yaml
    validatedAgainst:
      - 2.8.0
      - 2.9.0
      - 2.10.0
      - 2.11.0
  - id: crds
    type: crd
    name: bundle.yaml
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: repo-file
        repository: github.com/external-secrets/external-secrets
        path: deploy/crds/bundle.yaml
    contents:
      - kind: crds
    validatedAgainst:
      - 2.8.0
      - 2.9.0
      - 2.10.0
      - 2.11.0
    notes: Single CRD bundle file; the repository's install documentation references it.
  - id: external-secrets
    type: container-image
    name: external-secrets
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: oci
        repository: ghcr.io/external-secrets/external-secrets
    validatedAgainst:
      - 2.8.0
      - 2.9.0
      - 2.10.0
      - 2.11.0
provenance:
  method: discovery
  author: discovery.resolve@v1
  updated: "2026-10-02"
  validatedReleases:
    - v2.8.0
    - v2.9.0
    - v2.10.0
    - v2.11.0
  notes: Proposed by automated discovery; relationship checks run against v2.8.0, v2.9.0, v2.10.0, v2.11.0.
