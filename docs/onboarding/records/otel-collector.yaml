gaps:
  - "The per-release core/contrib pins of distributions/*/manifest.yaml are not machine-readable through version.strategy field (module path and version share one gomod string); the lockstep template + existence channel represents the release-level fact, but a hypothetical future pin at a different number would not be detected by the definition (drift would, via the check baseline)."
  - "~200 per-component gomod pins per release are not representable without ~200 artifacts; component add/remove/upgrade surfaces through the three changelog sources instead (classified, evidence-cited), not as computed artifact diffs."
  - "No upstream upgrade-guide document exists (opentelemetry.io/docs/collector/upgrade is 404): the '🛑 Breaking changes' sections plus 'otelcol validate' are the migration discipline, so the definition has no upgrade-guide role source."
  - "No machine-readable compatibility matrix: collector-to-core is the lockstep pin; the kubernetes/collector matrix lives in the opentelemetry-operator repository — a related product (own v0.x train) that should be onboarded separately and joined to this one."
  - "prometheus-image is verdict-insufficient (distribution created at 0.162.0, one release old, experimental); ebpf-profiler/prometheus have no docker.io repositories to declare."
  - "The OTel operator, OCB builder and opampsupervisor ride adjacent trains and are noted as related products, not artifacts."
sampleEdge:
  from: 0.160.0
  to: 0.162.0
  summary: "39 breaking · 2 action required · 270 changes · 1 warnings"
  evidenceRecords: 418
  notes: >-
    Path 0.161.0 → 0.162.0 (minor-lineage). Breaking = removals and feature
    gate promotions from all three changelogs (mezmo and wavefront receiver
    removals, queuebatch→queue_batch rename as migration, gate promotions as
    configuration), each with evidence lines. Action required (non-breaking):
    the GHSA still affecting 0.162.0 (vendored Prometheus library) and the
    contrib container image no longer being published at 0.162.0 — the
    upstream index-tag gap surfacing as a user-visible migration fact.
    Artifacts: 11 verified version bumps, prometheus-image added (new
    distribution), contrib-image removed-at-target per the exception.
    Classification provenance is heuristic/medium for text-matched rules and
    declared/high for section-only rules, by design.
notes: >-
  Third zero-new wave-2 product: onboarding was research plus configuration.
  The scope decision: the product is the RELEASES repository (the six
  distributions users deploy — binaries, deb/rpm/msi packages, images on
  docker.io + ghcr), not the core framework and not the contrib component
  repo; core and contrib are modeled as the distribution's content — their
  changelog sections read at the same-numbered tags (the release body itself
  links exactly those two), plus a core-release artifact with the honest
  distribution-only-patch exceptions. The k8s operator is noted as a related
  product. The definition is the construct-leanest big-product shape so far
  (57 constructs, all reused; no fallback groups needed — raw git hosts
  answered everything). Discovery quality was the highest yet for images
  (six ghcr channels historically-validated by itself) but its binary-asset
  proposer still cannot template per-OS/arch asset families, and it missed
  the multi-repository topology entirely — the one class of finding research
  had to supply. The upstream anomalies this product exposed (three
  releases that published nothing, a missing multi-arch index tag on the
  newest release, sections mis-headed as follow-up patches) are exactly
  what the exceptions construct exists for; none required Go changes.
