# Discovery proposed the right skeleton: versioning (strict v-pattern, 157
# stable tags, junk = cmd/* subdirectory tags + nightlies), the releases
# CHANGELOG.md heading, github-releases fallback, github-advisories, and the
# ghcr image family with SIX of eight images historically-validated itself.
# Its wrong calls: it EXCLUDED the contrib ghcr image as "test-only" (it is
# referenced from distributions/otelcol-contrib/.goreleaser.yaml), its binary
# asset templates used the repo name + a nonexistent .Binary template
# variable (static-validation failures), it proposed the OCB builder and
# opampsupervisor images as product artifacts, and it saw nothing of the
# core/contrib relationship (a single-repo scanner cannot). Research added
# the core/contrib changelog sources, the docker.io+mirror channels, the
# packages, the core-collector artifact and every exception.
