  - {id: kubectl-ingress-nginx-binary, reason: "dropped by discovery (failed validation); confirmed by probing 1.1.0 ... 1.15.1: no release has the asset, krew-index is at v0.31.0"}
  - {id: defaultbackend-amd64, reason: "coordinates are not registries (an eu.gcr.io /manifests/ URL, quay.io repository paths); the image is independently versioned (registry.k8s.io/defaultbackend-amd64:1.5) and disabled by default"}
