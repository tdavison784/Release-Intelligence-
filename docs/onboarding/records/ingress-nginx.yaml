    - {subject: controller-image, change: "tag v{{.Version}}; reference pattern for k8s.gcr.io (<= 1.2.1)", reason: "image tags carry a v and the pre-migration manifests name another registry host"}
    - {subject: controller-changelog, change: "availability >= 1.6.4; exceptions 1.8.4, 1.8.5", reason: "check -n 20: the per-release files start at 1.6.4 and two were never back-filled"}
    - {subject: supported-versions, change: "availability >= 1.3.1; exceptions 1.7.0 1.8.0 1.8.1 1.8.2 1.8.5", reason: "check -n 20: the README table has rows for some patch releases only"}
    - {subject: deploy-aws-nlb-tls, change: "availability >= 1.1.2", reason: "check -n 20: the file first exists in controller-v1.1.2"}
    - {subject: deploy-oracle, change: "availability >= 1.8.1", reason: "check -n 20: the file first exists in controller-v1.8.1"}
    - {subject: "deploy-* (9 manifests)", change: "exceptions 0.47.0 0.51.0 1.6.4 1.7.1 1.8.2 1.8.5 1.9.0 1.9.3 (one YAML anchor)", reason: "found after the check reported the image reference unverifiable on those tags: the tag was cut before the manifest-bump commit, so the manifest names the previous release's image"}
