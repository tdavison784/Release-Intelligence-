    - {subject: controller-chroot-image, reason: "registry.k8s.io blocked and no manifest names the chroot image (the changelog 'Images:' block does, but references only accept artifacts)"}
    - {subject: github-release-notes, reason: "api.github.com blocked (covered by the changelog file for 1.6.4+)"}
    - {subject: helm-chart canonical channel, reason: "kubernetes.github.io blocked; verified through gh-pages/index.yaml on raw.githubusercontent.com"}
    - {subject: github-advisories, reason: "api.github.com blocked; not part of ri check"}
constructs:
  new:
    # the free-text name "lifecycle" covers the computed family: the lifecycle
    # list field and its state/since/sources/summary sub-fields (the versions
    # constraint is data inside the statement, not a separate construct)
    - name: field:lifecycle
      kind: "definition field `lifecycle[]` (state deprecated|end-of-life, since, versions constraint, summary, evidence sources) + upgrade rule"
      justification: >-
        The product's retirement is a fact about the future (no more releases or fixes) that no release artifact,
        note or table carries, so it cannot be ingested, only stated, with evidence. With existing constructs the
        README banner can only be a release-notes source: it then surfaces as three unrelated bullets attributed
        to the first path release ('[controller-v1.14.0] Best-effort maintenance will continue until March 2026',
        classified as a deprecation), including a reassurance as an action-required item, and says nothing about the
        target. The construct states the status once, cites the banner as evidence (its note items are removed from
        the per-release notes), applies it to a version range, and the edge reports an action-required deprecation
        when the target is end-of-life, an informational one when the upgrade leaves an end-of-life line, plus a
        warning. Deterministic (declared, no clock), no new domain types or schema changes of the edge.
      otherProducts: [argo-cd, cert-manager, istio, postgresql, elasticsearch, redis, linkerd]
      note: "per-line end-of-life (versions: '< 3.3.0') is needed by Argo CD (last 3 minors supported), cert-manager and Istio today, PostgreSQL / Elasticsearch / Redis (published EOL dates) in waves 1-3, Linkerd (stable channel discontinued); rolling windows are better extracted from the support tables (gap below), terminal states like this one are best declared"
    - name: field:lifecycle.state
      kind: lifecycle field
      justification: "The declared state of the statement's version range (end-of-life here; deprecated is the other one): what the edge keys the action-required versus informational deprecation on."
    - name: field:lifecycle.since
      kind: lifecycle field
      justification: "When the state applies: 2026-03, the README wording ('until March 2026'; last tag 2026-03-19, see ambiguousRelationships)."
    - name: field:lifecycle.sources
      kind: lifecycle field
      justification: "Evidence sources cited by the statement (the README 'Retiring' banner); their note items are removed from the per-release notes."
    - name: field:lifecycle.summary
      kind: lifecycle field
      justification: "The one-line statement carried into the edge: 'ingress-nginx is retired: best-effort maintenance ended in March 2026 and there will be no further releases, bug fixes or security fixes.'"
  considered:
    - {name: "release-notes source for the banner", rejected: "works without code but misattributes a product-level fact to a release, splits it per bullet, repeats per path release and cannot be scoped to the target; kept as the evidence source only"}
    - {name: "new source role `lifecycle`", rejected: "touches the role enum, schema and ingest for no gain over a notes source cited by the statement"}
    - {name: "compatibility kind `bundled` for the README's Nginx/Alpine columns", rejected: "validator allows supported/tested/minimum only and the edge would say 'verify you use a supported Nginx'; also needed by Argo CD (Helm/Kustomize/Dex), Istio (Envoy), Cilium (Envoy) and kube-prometheus-stack, so a candidate for the next wave, recorded as a gap"}
    - {name: "variants / matrix expansion for the 9 provider manifests", rejected: "representable (9 stanzas of 11 lines, one YAML anchor for exceptions); a matrix construct would also serve Argo CD manifests, cert-manager/istioctl/vault/prometheus binaries per OS/arch"}
