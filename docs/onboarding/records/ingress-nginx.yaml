  - {host: registry.k8s.io, reason: "egress policy (controller and chroot images, OCI chart)"}
  - {host: k8s.gcr.io, reason: "302 to registry.k8s.io"}
  - {host: kubernetes.github.io, reason: "egress policy (Helm repo, docs); gh-pages/index.yaml on raw.githubusercontent.com used instead"}
  - {host: kubernetes.io, reason: "egress policy (retirement blog post, official CVE feed)"}
  - {host: api.osv.dev, reason: "egress policy"}
  - {host: gcr.io/k8s-staging-ingress-nginx, reason: "anonymous access denied (401)"}
ambiguousRelationships:
  - "Chart OCI tags in the k8s.io promotion list carry a v (charts/ingress-nginx: v4.15.1) while the chart version has none; a channel cannot carry its own tag template, so the OCI chart is not declared (and registry.k8s.io is blocked anyway)."
  - "Releases through 1.9.3: the tag is cut before the commit that bumps the manifests (8 tags), so 'manifest at the tag' is not 'manifest of the release'; consistent from 1.9.4."
  - "Several charts per controller version in 4.0.x (1.1.0 -> 4.0.10-4.0.13) and nine duplicate index entries for 4.12.0-beta.0; select: latest picks one."
  - "Tags helm-chart-3.16.0, 4.0.0, 4.0.4, 4.0.7 exist but are absent from the index; 49 legacy `ingress-nginx-*` chart tags and 4.0.0-beta.1 are index-only."
  - "The exact end-of-maintenance date is not published ('until March 2026'); since = 2026-03 is the README wording, last tag 2026-03-19, repository pushed_at 2026-03-23, archived (GitHub search API, 2026-10-01)."
representability: full            # of the release topology, once the lifecycle construct exists; partial without it
gaps:
  - "Per-release support windows: the README 'Supported' column and k8s lists are the project's own support state, but only the k8s list is extractable (a compat constraint); a table cell state (supported / not) has no home. Argo CD, cert-manager, Istio, PostgreSQL, Elasticsearch, Redis need the same: a source-extracted support/EOL state per release line would replace curated lifecycle ranges for rolling windows."
  - "Bundled component versions (NGINX, Alpine per release; README columns) have no compatibility kind (see considered)."
  - "`references` can only point at another artifact; the changelog 'Images:' block (digest-pinned controller and controller-chroot refs) and the k8s.io promotion list (controller digest -> tag) are strong registry-free evidence in documents, but cannot back an image artifact."
  - "No http/asset channel for a helm-chart artifact (validator allows helm-repo, oci, helm-git), so the GitHub release .tgz cannot be probed directly; the index entry lists it."
  - "A channel has no tag template: OCI chart tags with a v prefix (see ambiguous) cannot be declared."
  - "Docs/config surface (annotations, ConfigMap options) is not diffed; only chart values, images and note items are."
  - "Discovery: it follows the most numerous tag family (here the chart); finding the product train needs 'the family whose versions equal the chart's appVersion'. It also missed the README support table, the cloud manifest, the controller changelog and the banner."
sampleEdge:
  from: 1.13.9
  to: 1.15.1
  summary: "0 breaking · 2 action required · 132 changes · 3 warnings"
  evidenceRecords: 260
  also: "1.10.6 -> 1.12.1: 9 breaking · 9 action required · 328 changes · 3 warnings (516 evidence records); the nine breaking items are eight warning-sign bullets plus the computed removal of the podSecurityPolicy values section"
notes: >-
  The retired state made two things visible. (1) A product is not only its releases: the strongest upgrade-relevant
  fact here (do not rely on future fixes) lives outside any release. (2) Verification is weakest where it matters
  least: the chart (gh-pages index), manifests (git) and notes are all verifiable; only the registry is not. The
  definition is 7 sources, 12 artifacts, one lifecycle statement; 25 minutes, 0 product-specific Go lines.
