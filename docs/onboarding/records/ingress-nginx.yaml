  historicalReleasesChecked: [0.47.0, 0.48.1, 0.49.0, 0.49.3, 0.51.0, 1.0.0, 1.0.5, 1.1.0, 1.1.3, 1.2.0, 1.2.1, 1.3.0, 1.3.1, 1.4.0, 1.5.1, 1.6.4, 1.7.0, 1.7.1, 1.8.0, 1.8.5, 1.9.0, 1.9.6, 1.10.0, 1.10.6, 1.11.0, 1.11.8, 1.12.0, 1.12.8, 1.13.0, 1.13.9, 1.14.0, 1.14.5, 1.15.0, 1.15.1]
