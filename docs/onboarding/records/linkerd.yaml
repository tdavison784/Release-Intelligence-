constructs:
  new: []                  # 82 constructs used, all introduced by earlier products
  considered:
    - name: "tag-alias join (map a release to another tag of the same commit via an upstream data table)"
      reason: "stable 2.15+ designations (version-2.Y) are double-tags of edge releases whose artifacts are published under the edge tag; the mapping lives in linkerd.io/data/versions.yaml. No other onboarded product needs a data-table tag join (istio/argo-cd channels are template-derivable), so it is recorded as a gap, not a construct"
    - name: "rendered-CRD extraction from helm chart templates"
      reason: "linkerd's CRDs exist only as helm templates in-tree and in the published tarball; rendering would mean embedding helm. Strimzi ships CRDs as release assets and istio generates a flat crd-all.gen.yaml, so no cross-product need; recorded as a gap"
