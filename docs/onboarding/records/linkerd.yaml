ambiguousRelationships:
  - "Stable 2.15+ designations carry no artifacts of their own; the artifacts of their commits are published under the sibling edge-YY.M.N tag (2.15=edge-24.2.4 ... 2.19=edge-25.10.7, verified double-tagged). The join is upstream data (versions.yaml), not a template"
  - "Published chart versions are independent trains per era (linkerd-control-plane 1.9.x-1.16.11, linkerd2-cni 30.x): only appVersion == stable-2.X.N joins them to releases, and only through 2.14.10 (index frozen 2024-02-20)"
  - "cr.l5d.io is an alias of ghcr.io (its 401 advertises ghcr.io/token; identical tags through both hosts): declared as the second channel, not a separate registry era. registry.k8s.io has no linkerd repositories at all (404) — the hypothesised k8s.io mirror does not exist"
representability: full
gaps:
  - "The version-2.Y ↔ edge-tag mapping is data, so 2.15+ releases surface as artifact-absent (with the announcement, values, pins, kubeVersion and CRD file set) instead of joined to their edge-carrier artifacts; an edge-channel definition would see those artifacts directly"
  - "No crds contents/diffs: CRDs publish only as helm templates (no rendered per-release manifest upstream)"
  - "Announcement-blog paths are date-prefixed, so each future stable designation needs one new availability-pinned source block (2.21+ is a reviewer edit, the standing cost of the artifact-less era)"
  - "The edge channel (weekly, the only live OSS artifact stream) is out of scope: one family per definition, istio-style channel discipline; it would be its own product id if ever needed"
sampleEdge:
  from: 2.19.0
  to: 2.20.0
  summary: "0 breaking · 3 action required · 11 changes · 8 warnings"
  evidenceRecords: 32
notes: >-
  The topology surprise: the mission brief's hypothesis (stable-2.X.N and edge
  tags, stable canonical, edge possibly dead) was inverted by research — the
  stable TAG scheme itself changed in February 2024 (stable-2.14.10 was the
  last OSS stable release; since 2.15 stable releases are version-2.Y
  designation markers on edge commits with NO open-source artifacts, upstream
  announcing "producing stable Linkerd releases will be in the hands of the
  vendor community"), while the weekly edge channel lives on. Canonical =
  stable lineage via one component-group pattern (postgresql construct).
  Highest-value edge output: the cross-era edge 2.14.10 -> 2.15.0 shows the
  entire stable artifact set (chart 1.16.11, five images, CLI) verified ->
  removed with evidence, next to the kubeVersion narrowing; 2.19.0 -> 2.20.0
  shows the proxy pin v2.326.0 -> v2.359.0, cni v1.6.4 -> v1.6.8, the
  proxy-init pin removed (native sidecars default) and kubeVersion 1.23 ->
  1.31, all registry/tag-verified. Classification tuning was two iterations
  found by reading edges, not checks: "circuit breaking" false-positived the
  breaking rule (now "breaking change|no longer|deprecat|incompatible") and
  the blog's boilerplate sections (Photo credit, Linkerd is for everyone) are
  skipped. Zero new constructs, zero Go changes: the dual tag scheme
  (component groups), the chart join (lookup), the three per-release pins
  (field/pattern), the optional artifact-less era and the announcement
  sources are all wave-0/1/2 vocabulary.
