unreachableSources: []            # none: prometheus-community.github.io, raw.githubusercontent.com, ghcr.io (anonymous token), quay.io, api.github.com (60/h anonymous) and grafana.github.io all answered — the opposite of the historical *.github.io/quay/ghcr blocks other products hit
ambiguousRelationships:
  - "Tags 14.6.3, 18.0.4, 19.2.0 exist but have no index entry (1148 index versions vs 1151 stable tags): chart exceptions; the helm-git and OCI channels still see them."
  - "Dependency pins were ranges before the Renovate switch (node-exporter exact from 72.0.0, grafana 73.0.0, kube-state-metrics 74.0.0): the pin artifacts stop there; Chart.lock (exact resolutions) existed only up to ~47.x."
  - "appVersion carries a v since 44.0.0 (0.61.1-style before): the operator image artifact starts at 44.0.0; pre-44 quay tags unprobed."
  - "The release body's What's Changed is generated over the compare window, which includes repository-level PRs ([CI] ...): classify skips them, but they are in the upstream notes."
  - "Every chart major is declared 'breaking' by the README convention (CRD updates), but many X.0.0 sections only bump dependencies; the model reports what the section says, not the convention."
  - "grafana dependency repository moved twice (grafana.github.io → grafana-community.github.io → oci://ghcr.io at 90.0.0); only the oci era is probed."
representability: full             # of the release topology, with the field construct; the sub-chart pin *ranges* are the one deliberate cut
gaps:
  - "prometheus-windows-exporter: a dependency pin that is a semver range (\"0.12.*\") cannot be an artifact version; the component is invisible to the edge (only its values keys appear). Needs a 'constraint pin' notion or a resolution step."
  - "Sub-chart pins before the exact era (< 72/73/74.0.0) are ranges resolved by Chart.lock (present ≤ 47.x): not represented; availability cuts the artifacts off."
  - "Sub-component security: operator/grafana/prometheus CVEs live in the components' own advisories; this product cannot join them without a cross-product version join on the pinned versions (an impact-model question, G6/G7)."
  - "thanos image default is pinned at two values keys (prometheusSpec.thanos, thanosRulerSpec): ambiguous as one artifact, so only the values diff reports it."
  - "The chart's .tgz/.tgz.prov release assets have no channel kind for helm-chart artifacts (same gap ingress-nginx recorded); the index entry lists the URL."
  - "git-log has no path filter and classify cannot negate a prefix: monorepo per-chart commit filtering is impossible without the GitHub API."
  - "Discovery on a chart monorepo: the resolver proposes every sibling chart as an independent artifact and names the product after the repository; the tagPrefix (from -id) and the main chart artifact were right. A 'charts/* are separate products' rule and a dependency-pin candidate type are inputs for G3."
