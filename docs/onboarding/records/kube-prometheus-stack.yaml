constructs:
  new:
    - name: version:field
      kind: "version relation `version.strategy: field` + `field` (YAML path: dotted keys, [name=value] list selectors) + `from` (repo-file/http locator rendered at the release ref)"
      justification: >-
        The mirror of lookup: lookup finds the artifact whose index field matches the release
        (operator products use it for "the chart whose appVersion is my version"); field reads the
        version FROM a file of the release — required whenever the product is an aggregator that
        pins sub-components per release. Here it yields probe-able artifact instances with upstream
        evidence (Chart.yaml L9 for a dependency pin, values.yaml for an image tag), which a
        content snapshot cannot: the edge then states "kube-state-metrics chart 8.4.2 → 8.6.0
        [verified]" instead of diffing text. Catalog gains the strategy + path validation
        (catalog.SplitYAMLPath), normalize the path walker over yaml.Node
        (normalize.ReadYAMLPath, ErrNoMatch semantics), ingest the resolution with the document as
        evidence, plus JSON Schema and unit tests in all three packages.
      otherProducts:
        - prometheus-operator (order 24, wave 3: the chart-side of the appVersion join between these two products)
        - loki-stack (same monorepo family: loki/promtail/grafana dependency pins; well known, not in the plan)
        - bitnami application charts (app image tag pinned in values.yaml, common dependency; well known)
        - vault-helm (appVersion is the Vault version; vault already models the reverse lookup — the chart product would use field)
    - name: field:artifacts.version.from
      kind: "definition field: the locator the field strategy reads (repository, ref, path; release-context templates)"
      justification: "the document half of version:field; stats counts the parent and each leaf separately"
      otherProducts: ["same as version:field"]
    - name: field:artifacts.version.from.kind
      kind: "definition field: locator kind of the document the field strategy reads"
      justification: "the document half of version:field; stats counts each leaf separately. from is a repo-file/http locator rendered at the release ref"
      otherProducts: ["same as version:field"]
    - name: field:artifacts.version.from.path
      kind: "definition field: path of the document (Chart.yaml, values.yaml) with release-context templates"
      justification: "each pin lives in a named file at the release ref; the path is the join key between artifact and evidence line"
      otherProducts: ["same as version:field"]
    - name: field:artifacts.version.from.ref
      kind: "definition field: ref the document is read at ({{.Tag}})"
      justification: "pins move with the chart tag, so the ref is the release tag; without it the pin would be read from the default branch and drift"
      otherProducts: ["same as version:field"]
    - name: field:artifacts.version.from.repository
      kind: "definition field: repository the document is read from (the chart monorepo)"
      justification: "the aggregator's pins live in the product repository itself, unlike lookup whose index is a registry"
      otherProducts: ["same as version:field"]
    - name: field:artifacts.channels.glob
      kind: "definition field: glob selecting entries in a helm-repo index channel"
      justification: "the gh-pages index of the monorepo lists every sibling chart; the channel needs kube-prometheus-stack-*.tgz to select its own entries (mirror of the tagPrefix idea on tags)"
      otherProducts: ["loki-stack and any helm monorepo product (grafana charts moved to a monorepo too)"]
    - name: field:sources.locator.chart
      kind: "definition field: chart selector on a versions/note source inside a chart monorepo"
      justification: "git-tags of prometheus-community/helm-charts carries every chart's tag family; the versions source needs chart=kube-prometheus-stack to keep its own tags (tagPrefix keeps the version shape, chart keeps the product)"
      otherProducts: ["any product whose canonical channel is a chart in a multi-chart repository"]
    - name: template-var:ArtifactVersionOf
      kind: "template variable {{.ArtifactVersionOf \"artifact-id\"}} in source locators and extracts: renders another artifact's resolved version, so a source follows a pinned component (reading the component's own notes at its pinned tag). The followed artifact resolves before sources are consulted (strategy template/field/pattern only — derivable from the release alone, so no circularity); a follow that fails becomes the source's skipped/unavailable status, never a wrong locator"
      justification: >-
        The render-side mirror of version:field/pattern: those read a component pin out of
        the release's own files; this renders the resolved pin into a source locator. It
        closes the loop an aggregator needs — the chart's own notes (What's Changed,
        UPGRADE.md) state THAT the operator was bumped, but its behavioural changes live
        only in the operator's release body at the pinned tag, which the eval dataset's
        standing misses (kube-prometheus-stack-90-91 E4/E5, important and minor, since its
        first run) measured. Catalog gains the reference scanner (double-quoted literal
        argument, statically checkable), validation (unknown artifact ids, unresolvable
        strategies lookup/independent, and any use outside source templates rejected —
        self-references included), ingest a pinned pre-resolution before the parallel
        source/artifact fan-out with the resolution cached and reused by the followed
        artifact (one from-document fetch, statuses and evidence recorded exactly once),
        plus JSON Schema wording and unit tests in catalog and ingest.
      otherProducts:
        - flux (order 15): per-controller release notes at their kustomization pins — the *-controller pattern artifacts would each be followed by a notes source
        - karpenter (order 7): the sigs.k8s.io/karpenter go.mod pin it recorded as a gap would be a version:pattern artifact whose upstream notes this construct then follows
        - grafana (order 13) and the loki-stack family: aggregators whose sub-component pins are read with field can now also read the components' own notes at those pins
  considered:
    - {name: "chart-metadata snapshot diff (dependencies + appVersion as a content kind)", rejected: "would report pin changes as text diffs without versions, coordinates or probe verification; the artifact view subsumes it and reuses artifact diffing"}
    - {name: "git-log {{.PrevTag}}..{{.Tag}} as release notes", rejected: "the range interleaves sibling-chart commits of the monorepo; the locator has no path filter and classify cannot negate a prefix (RE2); the per-tag GitHub release body is already scoped"}
    - {name: "github-releases as the versions source", rejected: "listing monorepo releases pages through ~3500 of them (~35 API requests per run); git-tags is one clone/ls-remote"}
    - {name: "prometheus-windows-exporter-chart artifact", rejected: "its dependency pin is a range (\"0.12.*\"), not a version; recorded as a gap, not forced"}
    - {name: "CRD handling via the packed files/crds.bz2", rejected: "the plain YAMLs in charts/crds/crds are the same content, readable and diffable"}
