  from: 90.1.2
  to: 91.8.2
  summary: "1 breaking · 1 action required · 26 changes · 0 warnings"
  evidenceRecords: 452
  notes: >-
    Chart-major crossing (path 90.2.0 → 91.0.0 → ... → 91.8.2, 8 backports
    skipped). The migration item is UPGRADE.md "From 90.x to 91.x" (operator
    v0.94.0, tightened ClusterRole, CRD-update commands) and the one breaking
    item is "Disable prometheusScrape by default" (91.8.1). The artifact table
    IS the aggregation topology: operator v0.93.1 → v0.94.1, kube-state-metrics
    8.4.2 → 8.6.0, node-exporter 4.56.3 → 4.59.0, grafana 13.2.4 → 13.2.7,
    prometheus v3.14.0 → v3.15.0-distroless, alertmanager v0.34.0 → v0.34.1,
    all verified at their registries; 4 CRD schema diffs and 8 values changes
    alongside. Within-major edge 91.7.1 → 91.8.2: 1 breaking · 0 action · 4
    changes · 140 evidence records.
notes: >-
  The stress test this product was chosen for resolved into one generic
  construct (field) plus configuration: the chart is the release (template
  relation), the sub-components are per-release pins read out of the release's
  own files, the CRDs are a contents snapshot behind an availability window,
  and the upgrade guidance is a heading-selected section of a cumulative guide.
  Zero check failures on the first run (research before authoring paid for
  itself: every availability window came from the git history of Chart.yaml),
  zero unverifiable subjects, and — unlike every earlier product — no blocked
  hosts. 27 minutes, 6 sources, 9 artifacts, 0 product-specific Go lines.
