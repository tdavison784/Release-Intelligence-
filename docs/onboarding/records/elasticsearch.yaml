constructs:
  new:
    - name: "format:adoc"
      kind: extract-format converter (normalize.ASCIIDocToMarkdown + catalog format value + ingest branch + schema enum)
      justification: >-
        Elasticsearch's per-major migration guides — its highest-value
        upgrade intelligence — exist in the repository only as AsciiDoc:
        docs/reference/migration/migrate_7_0.asciidoc + migrate_7_0/*.asciidoc,
        migrate_8_0.asciidoc + migrate_8_0/*.asciidoc (the aggregator only
        include::s 15 topic files) and migrate_9_0.asciidoc ("== Migrating to
        9.0" with .Block-title [%collapsible] ==== topics, *Details* + / *Impact* +
        labels and |==== pipe tables). No markdown twin exists in-repo for 7.0
        and 8.0; the 9.0 markdown twin (docs/release-notes/breaking-changes.md)
        embeds AsciiDoc definition lists ("Area" / ":   * entry") that the
        markdown reader folds into one item per area — the same file is
        therefore also declared adoc, and the ':'-marker stripping makes every
        bullet an item. The converter parallels normalize.RSTToMarkdown:
        line-preserving, one-line "="-prefix titles and two-line underline
        titles (AsciiDoc's FIXED style-to-level mapping, unlike rst's
        first-use ordering), anchors/attribute lists/macros/comments/block
        delimiters blanked, .Block titles bolded, link macros flattened,
        hard breaks stripped, pipe tables converted; converted markup is read
        in list-item mode like docbook/rst. This is the third format in the
        slot created for docbook and filled for rst; cilium's record and
        strimzi's both named Elasticsearch as the AsciiDoc decision to make,
        and the answer is yes on its own evidence.
      otherProducts: [opensearch (the fork of this very repository keeps the same migrate_N_0.asciidoc conventions), neo4j (upgrade/migration docs are AsciiDoc), the elastic stack siblings (kibana/logstash/beats docs are AsciiDoc; logstash ships per-version breaking-changes asciidoc), the wider Asciidoctor/Antora ecosystem (WildFly, Groovy/Gradle docs)]
  considered:
    - {name: "extract:changelog-yaml (the ES per-PR docs/changelog schema: summary/pr/type/area per file)", rejected: "generic constructs need named cross-product users and the convention's other users are unverified (kibana generates .md; logstash uses a different per-version yaml); recorded as a gap instead — the gap is real: 8.19.x→8.19.x edges carry no note items"}
    - {name: "format:html (elastic.co per-version release-notes pages, the only per-release notes of 7.0-7.13 and the readable rendering of 7.14-8.x)", rejected: "a second converter with a much bigger surface; the markdown files and migration guides cover 9.x and the majors, so the gap is bounded to 8.x-era patch notes and older lines"}
    - {name: "reading docs/release-notes/index.md at the release's own tag", rejected: "a release's own section lands on main only after the release (at v9.5.4's tag the newest section is 9.4.3; main has all 51); main is the fixed ref that always has the section (traefik's migration-v2 precedent)"}
    - {name: "docker.io mirror channel for the image", rejected: "the official registry answers the anonymous token flow end to end (the first product whose whole publication chain is reachable); no server-image mirror exists"}
    - {name: "bundled JDK as a second version:pattern artifact", rejected: "no stable anonymous URL serves the exact openjdk vendor build (26.0.2+10@hash); declared for lucene only, JDK recorded as a gap"}
