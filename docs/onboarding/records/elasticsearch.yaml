notes: >-
  The headline decision: format:adoc implemented. Two records deferred it to
  this product (cilium's rst justification: 'Strimzi/Elasticsearch are
  AsciiDoc'; strimzi's: 'Elasticsearch should decide on its own evidence'),
  and the evidence says yes — the per-major migration guides exist only as
  AsciiDoc, and even the 9.x markdown breaking-changes file embeds AsciiDoc
  definition lists. The stale lead (docs/changelog.asciidoc) does not exist
  at any tag. Dual majors are represented the traefik/redis way: one semver
  space, lifecycle statements scoped by constraint — everything below 8.x
  end-of-life (7.17's support ended 2026-01-15), 8.x deprecated since 9.0's
  GA with the published 2027-01-15 end of maintenance quoted (v8.19.22
  shipped eight days before v9.5.4). The AGPL re-licensing era (8.19/9.0+)
  is descriptive only. Second and third edges exercised: 9.5.0 → 9.5.4 (1
  breaking · 134 changes · 4 CVE-carrying dependency upgrades; lucene
  10.5.0 → 10.5.1) and 7.17.23 → 8.19.22 (165 breaking · 167 changes · 1
  warning: the target line is deprecated — the deprecated-major edge cites
  the 15-file 8.0 guide). Discovery quality: right versioning and the
  advisories feed, one structurally-perfect proposal that yields zero
  intelligence (the item-yield blind spot), zero artifacts, and the real
  image excluded as docs-only. First onboarding with every canonical host
  reachable (docker.elastic.co via the anonymous token flow,
  artifacts.elastic.co, www.elastic.co, repo1.maven.org): nothing is
  unverified and no mirror was needed. Elapsed time is agent wall-clock and
  excludes this record.
