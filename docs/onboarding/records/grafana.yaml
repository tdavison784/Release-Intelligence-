ambiguousRelationships:
  - "Docs are merged to main after the release branch is cut: the changelog section and the per-minor upgrade guide are absent at the X.Y.0 tags, so both are read at main. The changelog-at-main covers 11.0.0+ today; older majors are archived into .changelog-archive/CHANGELOG.NN.md as the file grows, so the >= 11.0.0 availability window will age (drift-report material, not a broken relationship)."
  - "v13.0.0 was removed from distribution (Git Sync migration bug that could lose dashboards): git tag and changelog section exist, but the GitHub release, the plain Docker tag and all dl.grafana.com packages are gone — exceptions on four subjects; only CI-build-id image tags (13.0.0-<id>) remain."
  - "Chart version vs app version are fully independent (chart 10.5.15 ships app 12.3.1; chart 13.2.7 ships app 13.2.3) and the chart itself moved repositories in January 2026 (grafana/helm-charts deprecated at 10.5.15 → grafana-community/helm-charts, full history re-published; ghcr OCI mirror froze at the deprecated era)."
  - "Security-only releases vX.Y.Z+security-N exist as tags, Docker X.Y.Z-security-N tags and changelog sections; the next regular patch's changelog does NOT repeat their CVEs, so an upgrade crossing one (12.4.3 → 12.4.4 crosses +security-02) is silent about the fix in the notes even though the code contains it."
  - "~10 published GHSAs have unbounded affected ranges ('>= 8.3.0-beta1' with patched 9.3.4) and ~14 have no machine-readable range: the edge reports both as warnings ('still affects target' / 'check manually') — upstream data shape, same as cilium recorded."
  - "The changelog lists Enterprise-only entries with an '(Enterprise)' marker inside the OSS changelog; classify skips them (this product is OSS)."
  - "The What's new pages are the canonical breaking-changes channel from v12 on, but their content is not in the repository (Hugo shortcode); the in-repo upgrade guide + the changelog's ### Breaking changes carry v12+ breaking changes instead."
representability: full
gaps:
  - "security-only releases (+security-N) are not modeled: their CVE fixes are invisible when an upgrade path crosses one, because the next regular patch's changelog does not repeat them (see ambiguousRelationships). Needs either a build-metadata version shape or an advisory-side join on 'security releases between A and B'."
  - "What's new content (and therefore the official v12+ breaking-changes lists) lives outside the repository; only the prose index page is in git."
  - "changelog-at-main availability ages as upstream archives old majors (>= 11.0.0 today); releases older than the archive cutoff depend on the rate-limited GitHub release bodies."
  - "no support-window model: the published 9/15-month per-minor table cannot be expressed (the lifecycle statement is product-wide); the edge cannot say '13.0 is EOL January 2027'."
  - "GitHub release assets (deb/rpm/spdx with CI build ids) and the Enterprise artifact set (grafana-enterprise image, grafana-enterprise_* packages, same-versioned) are out of model by design; grafana-operator is a separate product (its chart still lives in the old monorepo)."
sampleEdge:
  from: 13.1.0
  to: 13.2.3
  summary: "1 breaking · 10 action required · 179 changes · 25 warnings"
  evidenceRecords: 498
  notes: >-
    Minor-lineage edge (path v13.2.0 → 13.2.3, 7 backports skipped). The one
    breaking item is the upstream "### Breaking changes" entry "Remove
    alertingSaveStateCompressed feature flag" (changelog, declared); action
    required is dominated by the still-affects GHSA warnings (upstream
    unbounded ranges); 85 features / 58 bug fixes; 9 security items across
    the four patches; the chart moves 12.7.2 → 13.2.7 [verified] and its
    values diff reports the default image.tag switch to
    {{ .Chart.AppVersion }}-distroless plus 12 other values changes; CRDs
    unchanged. Major edge 12.4.12 → 13.0.10 (path of 11 patches): 17
    breaking · 30 action required · 376 changes · 646 evidence records —
    the upstream Breaking changes section (14 items) is reported 1:1
    (grafana-cli/grafana-server commands removed, core Elasticsearch
    datasource removed, enable_gzip default flip), the upgrade guide's
    technical notes arrive as declared items (the v13.0.0 Git Sync data-loss
    warning as action-required "Git Sync early adopters: ...", the Image
    Renderer JWT token requirement, the deprecated numeric-id APIs disabled
    by default), and the CRD diff computes the four
    notifications.alerting.grafana.app storage-version changes
    v0alpha1 → v1beta1 with migration guidance.
notes: >-
  Zero new constructs, zero Go changes: the wave-2 convergence point the
  plan predicts — everything this product needed (docs-at-main sources with
  release-kind and availability windows, a monorepo chart lookup by
  unprefixed appVersion, optional artifacts, exceptions for a
  removed-from-distribution release, package channels on a downloads host,
  CRD repo-dirs) already existed after ten onboardings. The two definition
  corrections that mattered (read the changelog and the upgrade guides at
  main; attach guides at majors too) were upstream timing facts found by
  research, and the classify tuning (whole-word deprecation, delete as
  removal, skip (Enterprise) items and plugin-development churn) was found
  by reading the edges, not by failing checks. Discovery's strengthened
  resolver was closer than for any earlier product: it had the right
  versioning, the right chart relation at the right post-migration index,
  and it validated the CRD artifact itself — its two wrong drops were both
  "the relationship template was rendered at the tag / with a v prefix",
  which is exactly the class of correction a reviewer can make in seconds.
