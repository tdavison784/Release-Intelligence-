# Discovery (deterministic, post-G3: tag-family/train detection, chart
# relations, image classes) got the versioning exactly right (tagPattern
# kept verbatim; 739 tags classified 551/78/110 with a strict pattern that
# already excludes the +security-N tags), found the CHANGELOG, the per-minor
# upgrade docs, the chart monorepo relation (chart.external-lookup-appversion
# at grafana-community.github.io — the repository the chart moved to in
# January 2026), 7 CRD candidates of which it historically validated the
# notifications repo-dir, and the GHSA feed. It dropped the changelog and the
# upgrade guide because their sections do not exist AT THE TAG (docs are
# merged after the branch cut), and dropped the chart because its lookup
# matched appVersion "v13.0.0" against unprefixed appVersions — both are
# relation-template corrections, not wrong channels. It also excluded
# docker.io/grafana/grafana as image.no-release-evidence (the only in-repo
# references are floating devenv tags) and never looked at dl.grafana.com.
