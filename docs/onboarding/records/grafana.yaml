relationships:
  # Default `ri check` (6 releases) plus two era runs:
  #   8.0.0 9.0.0 10.0.0 10.3.0 11.0.0 11.6.0 12.0.0 12.2.0 12.3.0 12.4.0 12.4.12
  #   and, after the fixes below, 8.0.0 9.0.0 10.0.0 10.3.0 11.0.0 12.0.0 13.0.0.
  historicalReleasesChecked: [8.0.0, 9.0.0, 10.0.0, 10.3.0, 11.0.0, 11.6.0, 12.0.0, 12.2.0, 12.3.0, 12.4.0, 12.4.12, 13.0.0, 13.0.10, 13.1.0, 13.1.7, 13.2.0, 13.2.3]
  initialFailures: 0              # first complete draft, default check: 0 failing, 0 unverifiable
  initialFailuresExtended: 1      # the first era run found breaking-changes-10-3 failing (dash filename) and, silently, X.0.0 guides not attaching (releaseKinds [minor] excludes majors)
  finalFailures: 0
  manualInterventions:
    - {subject: breaking-changes-10-0/10-3/11-0, change: "path breaking-changes-vX-Y.md (dash, not vX.Y)", reason: "404: upstream filenames use v10-3.md form"}
    - {subject: upgrade-guide + breaking-changes, change: "releaseKinds [major, minor]", reason: "X.0.0 is kind major; the yearly comprehensive guide must attach at 13.0.0 — with [minor] the most important guide of each major was silently never ingested (found by reading the check matrix n/a columns, not by a failure)"}
    - {subject: changelog classify, change: "deprecation rule requires whole words \\b(deprecate|deprecated|...)\\b", reason: "'Provisioning: Strip deprecatedInternalId label for dashboards' was classified a deprecation (identifier, not a deprecation note)"}
    - {subject: changelog classify, change: "Breaking-changes removal rule adds delete[sd]?", reason: "'Gauge: Delete from @grafana/ui' fell through to the catch-all instead of removal"}
  unverifiable:
    - {subject: github-release-notes, reason: "api.github.com anonymous rate limit (60/h) exhausted by discovery's validation pass plus research; the 8.0.0-10.3.0 era run marked it unverifiable while the default-window run verified it fully from the fetch cache"}
constructs:
  new: []                        # zero: every construct existed (see below); the definition is configuration only
  considered:
    - {name: "release tags for +security-N releases (assembled or build-metadata versions)", rejected: "security-only releases are vX.Y.Z+security-N: semver build metadata of an already-shipped patch ('the indicated version PLUS the security fix'); modeling them as releases needs a non-semver version shape for the sake of out-of-band fixes that ship in the next regular patch anyway — recorded as a gap"}
    - {name: "whatsnew source (docs/sources/whatsnew/whats-new-in-vX-Y.md)", rejected: "since v12 the file is a Hugo posts: index; the item content (including the Breaking changes posts) is rendered by the {{< docs/whats-new >}} shortcode from content outside this repository — no git channel"}
    - {name: "grafana-oss image artifact", rejected: "docker.io/grafana/grafana-oss published the SAME OSS images 10.0.0-13.0.2 and stopped ('Starting with 12.4.0 ... will no longer be updated', in-repo docker docs); grafana/grafana is OSS across all of history — noted on the image artifact instead of duplicating it"}
    - {name: "GitHub release assets as package artifacts", rejected: "asset names embed CI build ids (grafana_13.2.3_36482603486_linux_amd64.deb) that no template can predict; dl.grafana.com/oss/release is the predictable channel"}
    - {name: "support-window table as a compatibility source (when-to-upgrade)", rejected: "a markdown table of per-minor support end dates (9 months, 15 for the last minor of a major) exists in the repo; the model has no support-window construct and the lifecycle statement (ingress-nginx) is product-wide, not per-minor — gap"}
    - {name: "image variant artifacts (-ubuntu/-slim/-distroless)", rejected: "one image artifact carries the channel truth; the variants surface where they matter (the chart values diff reports the default image.tag switch to {{ .Chart.AppVersion }}-distroless in the 13.2 edge)"}
    - {name: "a compatibility role source", rejected: "Grafana publishes no platform matrix (not a Kubernetes component); the only constraint is the chart's kubeVersion, already captured via chart-metadata"}
