ambiguousRelationships:
  - "The Helm chart was forked in March 2026: the OSS chart lives in grafana-community/helm-charts (index + OCI + git tags, versions independent of the app, joined by appVersion), while the in-repo production/helm/loki chart continues as the Grafana Enterprise Logs chart under the SAME chart name with OVERLAPPING versions (two different 'loki' charts both have a 7.0.0: community 2026-03-21 vs old-index/GEL 2026-04-23). The old grafana.github.io index is therefore not a lookup channel for this product."
  - "The chart->app join is patchy by patch release: no chart ships appVersion 3.7.0/3.6.0/3.6.17/3.5.12 while 44 chart versions ship appVersion 3.7.2 — which app release becomes an appVersion is publish-cadence luck, hence optional + insufficient verdicts, and helm-values diffs skip when the From release has no chart (a warning, not an error)."
  - "Changelog sections are merged after the tag is cut and live in two places: X.Y.0/X.Y.1 sections on main, later patches on release-X.Y.x — a three-source fallback chain (branch, main, API body) covers both; the branch files carry duplicate [3.6.0] and [3.7.3] sections (re-cuts; a heading selector reads the first)."
  - "The in-flight minor's upgrade guidance is the '## Main / Unreleased' section of the upgrade index until the release is cut (today: TSDB schema v14, the new head-WAL chunk format that 3.7.x and earlier cannot read, SSD mode removal) — a heading selector cannot attach it deterministically before the rename."
  - "Promtail's paper trail disagrees slightly: deprecated in 3.0 (release notes), code removed in 3.7.3, docs page says EOL 2026-03-02, but the last promtail IMAGE and release assets are 3.6.0 — the definition uses the artifact truth (<= 3.6.0) and cites the docs page for the statement."
  - "The community repository's re-published pre-fork tags do not reconstruct the originally published packages: chart 6.31.0's OCI layer and its own loki-6.31.0 tag differ by hundreds of values keys (compareWith found +360/-143/~47), while 18.13.7 agrees exactly."
representability: full
gaps:
  - "No machine-readable schema-version/index-format source: the schema v13 requirement (3.0) and the announced v14 (3.8) are prose topics in the upgrade guide, carried as upgrade-guide note items rather than compatibility constraints the impact join could match a schema_config against."
  - "The lifecycle statement renders as '<product> vX is end-of-life'; a component-scoped variant would word the promtail retirement better (the summary text does, the generated title does not)."
  - "The in-flight minor's upgrade section ('## Main / Unreleased') is unreachable by the heading template until upstream renames it at release time."
  - "Upstream publishes no per-minor support-window policy (unlike grafana), so no lifecycle-by-line statements are possible."
  - "helm-values diffs only exist when BOTH edge endpoints have a chart appVersion; edges whose From release has none warn instead of diffing."
sampleEdge:
  from: 3.6.17
  to: 3.7.8
  summary: "5 breaking · 21 action required · 569 changes · 2 warnings"
  evidenceRecords: 705
  notes: >-
    Minor edge across the chart fork (path v3.7.0 -> 3.7.8, 9 releases).
    5 breaking = the chart-migration umbrella (12 chart majors of values
    changes) + the four declared app breaking changes (engine scheduler
    capacity/worker sharing, parsed labels vs structured metadata, OpenShift
    stream-label default). Action required is dominated by the
    upgrade-to-community guide's per-symptom migrations (deploymentMode
    default flip, canary tenant move, cluster -> app_instance label rename,
    minio subchart deprecation, enterprise.* removal, kubeVersion 1.25
    floor) + the promtail end-of-life statement; 33 security items
    ([SECURITY] dependency bumps); 104 features / 402 bug fixes; chart
    18.13.7 [verified] from a missing From-chart; kubeVersion >=1.25 from the
    OCI chart metadata. Major edge 2.9.10 -> 3.0.0 (second edge exercised):
    40 breaking · 98 action required · 241 changes — the schema story is
    fully visible: 'Structured metadata is enabled by default and requires
    tsdb and v13 schema or Loki won't start' and 'Upgrade your index version
    and schema version before updating to 3.0' as declared migration items,
    next to the shared_store removals, the metrics namespace rename and the
    label-limit/line-size default changes.
notes: >-
  The OCI-chart G8 verdict karpenter's record hoped for: YES, and it works
  end to end on ghcr.io anonymous tokens. The loki chart is read as a
  published-oci-chart (config media type + content layer, digest-verified)
  for BOTH helm-values and chart-metadata; kubeVersion lands as the
  Kubernetes constraint and appVersion as the pin evidence. The lookup still
  needs the index (a bare OCI tag list has no appVersion), so the OCI channel
  serves packages/probes while the community index serves the relation —
  ARTIFACTS.md already records that split as deliberate. The compareWith
  divergence the mission asked about is real but is NOT
  production/helm-vs-published (those are different charts since the March
  2026 fork — comparing them would be apples/oranges and the definition does
  not): it is published-OCI-layer vs the community repo's own source tag,
  and it found that the re-published pre-fork tags do not reconstruct the
  originally published packages (6.31.0: +360/-143/~47 keys) while current
  releases agree exactly (18.13.7: 2112 keys, representations agree) —
  exactly the silent-preference problem the construct exists to surface.
  Everything else was configuration over existing constructs (the 5 new
  constructs are the compareWith family, first exercised here after existing
  as G8 code): the tag-family trap cost discovery its canonical channel, the
  branch-read changelog is the grafana docs-at-main pattern per branch, the
  promtail EOL is the ingress-nginx lifecycle construct, the chart fork is
  an optional lookup with the old index explicitly excluded, and the
  3.x-upgrade-pain (schema v13/v14, storage backends) rides the
  upgrade-guide role with karpenter's listItems making every topic its own
  item. One small generic ingest fix landed (unresolved-artifact contents
  are n/a, not unverifiable); zero product-specific Go. 34 minutes
  wall-clock.
