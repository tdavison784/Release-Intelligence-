constructs:
  # ri stats loki -o json: 93 used, 5 unaccounted -> all five are the
  # compareWith family, exercised by a definition for the first time here.
  new:
    - name: field:artifacts.contents.compareWith
      kind: field
      justification: >-
        First definition exercise of the G8 material-difference guard: the
        loki chart's values are declared from the published OCI chart layer
        (the artifact users install) with the community repository's source
        tree at the chart's own tag as the alternate representation, so a
        divergence is a recorded fact instead of a silent preference. The
        construct existed since the G8 work (docs/ARTIFACTS.md credits
        istio's packaged-vs-source values as the motivating case) but no
        earlier definition declared it — ri stats listed it unaccounted
        until this one.
      otherProducts: [istio (retire the ignoreKeys caveat on its rewritten packaged values), kube-prometheus-stack (packaged subchart CRDs vs source tree), cilium (chart tarball release assets), ingress-nginx (packaged chart vs source tree)]
    - {name: field:artifacts.contents.compareWith.kind, kind: field, justification: "leaf of compareWith (stats counts parent and leaf separately)", otherProducts: "[same as field:artifacts.contents.compareWith]"}
    - {name: field:artifacts.contents.compareWith.path, kind: field, justification: "leaf of compareWith", otherProducts: "[same]"}
    - {name: field:artifacts.contents.compareWith.ref, kind: field, justification: "leaf of compareWith (charts/loki/values.yaml at tag loki-{{.ArtifactVersion}})", otherProducts: "[same]"}
    - {name: field:artifacts.contents.compareWith.repository, kind: field, justification: "leaf of compareWith (github.com/grafana-community/helm-charts)", otherProducts: "[same]"}
  considered:
    - {name: "component-scoped lifecycle statement", rejected: "the lifecycle construct states the PRODUCT (or a version range of it); promtail is a component of the loki releases — the product-scoped statement carries it with a promtail-worded summary, at the cost of the rendered title 'Grafana Loki vX is end-of-life' (recorded as a gap)"}
    - {name: "the in-repo GEL chart as a second chart artifact", rejected: "Enterprise artifact set of the same tags (grafana-enterprise precedent); its 7.x version collision with the community chart is recorded as an ambiguity instead"}
    - {name: "frozen sibling charts (promtail, loki-canary, loki-distributed, loki-simple-scalable, loki-stack)", rejected: "retired channels, nothing published since 2025-10-31 and none carried to the community index; loki-stack (whose loki/promtail/grafana pins kube-prometheus-stack's record asked about) lives on in-tree at production/helm/loki-stack but does not release"}
    - {name: "schema/index-format compatibility source", rejected: "Loki publishes no machine-readable schema-version table; schema v13 (3.0 requirement) and the announced v14 are prose in the upgrade guide, which the upgrade-guide role already carries item-per-topic"}
    - {name: "oci as the chart lookup channel", rejected: "a bare OCI tag list carries no appVersion field, so the lookup needs the index; the oci channel serves probes and the chart package layer (ARTIFACTS.md records version-relations-still-read-documents as deliberate)"}
goChanges:
  productSpecific: 0
  generic:
    - file: internal/ingest/contents.go
      purpose: >-
        Packaged-chart contents of an artifact whose version did not resolve
        (an optional lookup not published for that release) now report
        not-applicable through the existing unresolvedError path — the same
        semantic a {{.ArtifactVersion}}-templated locator gets — instead of
        unavailable/unverifiable. Benefits any optional lookup artifact with
        published-package contents (grafana dodges it via templated refs,
        loki hit it with a locator-less oci package read).
    - file: internal/ingest/artifact_contents_test.go
      purpose: TestIngestContentsPackageUnresolvedVersion covering that semantic.
