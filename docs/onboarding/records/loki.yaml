# version == {{.Version}} — the actions-runner-controller lineage trap,
# sharpened by the chart major being numerically larger than the app major.
# Its individually correct finds (kept after re-anchoring): github-advisories,
# the release-asset URL family, docker.io/grafana/loki-canary, the ghcr OCI
# chart location, the operator CRD directory (a related product's). It
# dropped the GitHub release body, loki-canary and the release-asset binaries
# because their relationships were validated against helm-loki-* tags.
