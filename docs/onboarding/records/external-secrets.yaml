ambiguousRelationships:
  - "chart == operator version (appVersion == tag) for every release since 0.9.16, but the chart is cut 1-3 days after the operator tag, so the newest release can be chart-less for a few days; modelled as required with exceptions for the four historical gaps"
  - "chart changes land in the operator commit range but can be reverted before the chart ships (v2.11.0: feat(charts) global.imageRegistry #6983 reverted by #6996 after the tag; helm-chart-2.11.0 lacks it); the values diff, read at chart tags, is authoritative and disagrees with the notes"
  - "history is linear and only the newest minor is supported, which does not fit lineage `minor` (parallel maintained lines); chosen only for its path policy"
  - "stability-support is read from main (not immutable) because a release's own row appears only after its tag; rows mix line granularity (2.11, 0.20.x) and exact patches (2.4.1)"
representability: full
gaps:
  - "support window: Release Date / End of Life per line (and the 'only the newest minor is supported' policy) cannot be expressed; relevant for impact analysis of a running EOL version"
  - "esoctl CLI (tags vX.Y.Z-esoctl, own version, goreleaser assets) is a separate release stream in the same repository and is not modelled"
  - "breaking-change detection from commit subjects is weak (2 '!' subjects and 1 'BREAKING:' in 2500 commits); breaking changes are caught only by the CRD diff (served/storage/removed versions, removed fields) and removal-keyword rules; no per-release upgrade guide exists"
  - "chart dependency bitwarden-sdk-server (oci chart, own version) and the Go modules (apis/runtime/providers share the operator tag) are not modelled"
  - "GitHub advisories and generated release bodies need the GitHub API (blocked here); no reachable alternative adapter"
