notes: >-
  The v5 -> v6 boundary edge: path = 6.0.0 exactly (minor-lineage over an
  essentially linear history). 26 breaking = 19 OpsWorks + 2 Worklink resource
  removals and 3 removed provider arguments from the v6 guide's removal
  sections (declared), 2 breaking changelog items (s3_prefix now required,
  sagemaker exclusive blocks) and SimpleDB. 153 changes: 148 guide items (the
  per-resource Data Source/Resource sections as action-required migrations)
  and 5 changelog items. Two more edges were exercised: 6.66.0 -> 6.67.0, the
  weekly hop (23 changes = exactly the changelog's 23 bullets, 22 declared + 1
  heuristic, 0 breaking — classification quality is 1:1 with the document) and
  6.57.0 -> 6.57.1, a true patch (1 bug fix; the edge also shows the
  aws-sdk-go-v2 pin being REVERTED v1.43.1 -> v1.43.0 with go.mod + module
  proxy evidence — the fix for the UnknownError regression introduced in
  6.57.0). Discovery baseline at this velocity: 15 seconds end to end over 521
  tags (blobless clone, 4-release validation window); it coped trivially
  because the topology is simple — but it found no artifacts (there are none in
  the tree; binaries are attached by the release workflow) and no upgrade
  guides (website/docs/guides/), and it excluded the registry reference that
  is actually the publication index. No host was unreachable from the sandbox:
  releases.hashicorp.com, registry.terraform.io (/v1 API), proxy.golang.org,
  api.github.com (quota-limited), developer.hashicorp.com and
  discuss.hashicorp.com all answered. Elapsed time is agent wall-clock and
  excludes this record.
