ambiguousRelationships:
  - "publication is two-channel and they disagree: 12 of 518 stable git tags are delisted from registry.terraform.io (6.1.0, 6.57.0, 5.71.0, 3.64.3, eight 3.26.x), and 10 of those are ALSO absent from releases.hashicorp.com (only git and the GitHub release remain); the exceptions encode the host side, the registry side is a gap"
  - "the changelog section at the release's own tag may say (Unreleased) (whole v5 era) and majors are tiny at the tag (6.0.0: 5 bullets pointing at the upgrade guide); the full impact of a major lives in the guide, the changelog fills in over the following days on main"
  - "guides are read at the tag, so each major sees its release-time guide; upstream keeps amending them after release (the v6 guide at v6.67.0 has 686 lines vs the release-time one)"
  - "changelog-github shows 'covered' in check runs once the anonymous api.github.com quota (60/h, shared with research probes) is exhausted: the git fallback answered, so the GitHub endpoint itself is verified only within its quota windows — transient, not a block"
  - "the 15 OS/arch zips are represented by 2 members (linux/amd64, darwin/arm64); the family shares the version relation and host, so the others add no relationship information"
representability: full
gaps:
  - "registry.terraform.io — the channel Terraform users actually consume — is not declarable: /v1/providers/hashicorp/aws/versions and /…/download/{os}/{arch} answer anonymously as JSON, but no locator kind reads them; the registry's delisting of 12 releases (and its per-version protocol numbers) is therefore invisible to the edge"
  - "Terraform Core compatibility is prose: the guides' Prerequisites sections say 'upgrade to latest 5.x first, expect no deprecation warnings'; the machine-readable fact is the provider protocol version (5.0, constant since 2019) inside terraform-registry-manifest.json — a JSON file no extract type reads, and a constant carries no per-release constraint either way"
  - "provider protocol_versions ['5.0'] and the registry's per-version protocols (4/4.0/4.0,5.0/5.0) are not extracted (would need a JSON compatibility extract; see considered)"
  - "SECURITY.md/.release/security-scan.hcl configure scanning, not advisories; historical provider CVEs (e.g. CVE-2018-15857) predate the GitHub advisory database and no machine-readable HashiCorp CVE feed exists for providers (discuss.hashicorp.com is reachable but renders HTML)"
