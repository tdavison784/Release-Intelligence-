# Discovery quality: the best chart call of any onboarding so far — it found
# BOTH charts in charts/ and proposed the appVersion-lookup relation for
# kyverno-policies itself (historically-validated 6/6 by its own checks), and
# its validation run flagged the real readiness-checker boundary (fail at
# v1.17.0, absent from ghcr). Its two chart/CLI drops were proposer
# static-validation errors (ghcr.io/${{/ template syntax, goreleaser .Arch
# variables), and it missed the six other images (release-workflow-only
# evidence), the upgrade guide and the kyverno-api pin (research supplied
# those).
