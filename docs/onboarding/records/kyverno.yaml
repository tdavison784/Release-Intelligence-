ambiguousRelationships:
  - "The charts' appVersion is v-PREFIXED (v1.19.1), unlike Argo CD/flux whose lookups match the unprefixed version: match is {{.Tag}}, not {{.Version}}."
  - "Chart majors track app majors (chart 2.x -> app 1.5-1.9, 3.x -> 1.10+) but chart minors are their own (chart 3.4.5 AND 3.4.6 both have appVersion v1.14.5); select latest resolves, and a chart fix can re-publish the same appVersion."
  - "Upstream writes an 'Upgrading to Kyverno v1.X' section only for minors that need steps (1.13, 1.19 today); 1.14-1.18 are declared as source exceptions — absence is upstream's statement that none are needed (the 1.18 blog: 'There are no breaking changes')."
  - "From 1.19 the chart installs CRDs via the kyverno-api dependency while config/crds stays in the source tree: two representations of one CRD set; the definition snapshots the source tree (cilium precedent), the kyverno-api pin reports the shipped chart version."
  - "Tag v1.15.20 is an extra-looking patch of the 1.15 line (after 1.15.3); never traversed by the checked edges."
  - "readiness-checker is a Helm test-hook image (test.image), not a workload image; published by the release workflow like the other six."
  - "2023-era advisories (CVE-2023-4281x) carry no machine-readable affected ranges; they surface as check-manually warnings (the flux pattern)."
representability: full          # the multi-image + same-repo-chart + pinned-CRD-chart topology is fully represented with constructs from orders 1-15
gaps:
  - "The deprecation schedule's forward-looking rows ('v1.20 | Nov 2026 | Removed') reach edges only as text items of the 1.19 sources; there is no construct for a future-removal constraint keyed by a target release that does not exist yet (the CRD-version diff will state the removal factually once v1.20 ships)."
  - "The Kubernetes supported SET per release (v1.33-1.35 for 1.19) exists only on the mutable releases.md page; only the chart kubeVersion minimum is captured per release (the set-valued compatibility column flux also recorded)."
  - "The CLI asset family per OS/arch (darwin/windows, arm64/s390x) is one modeled channel (linux_x86_64); asset families are not expressible (flux recorded the same)."
  - "policies-chart contents are not snapshotted (see constructs.considered)."
sampleEdge:
  from: 1.18.2
  to: 1.19.1
  summary: "7 breaking · 14 action required · 77 changes · 9 warnings"
  evidenceRecords: 235
  notes: >-
    Path v1.19.0 -> v1.19.1 (minor crossing). The breaking list IS the
    documented deprecation/removal policy: the four 'deprecated in 1.19,
    removed in v1.20' statements (ClusterPolicy/Policy, CleanupPolicy/
    ClusterCleanupPolicy, legacy PolicyException, from upgrading.md
    L24-L37), the schedule items from the 1.19 blog, and the 'kyverno json
    scan' CLI removal — each breaking + action required with line evidence.
    The artifact table shows the whole topology verified: chart 3.8.2 ->
    3.9.1, policies-chart 3.8.2 -> 3.9.1, kyverno-api 0.0.1-alpha.2 ->
    0.0.1-alpha.4 (the CRD chart pin), all seven images v1.18.2 -> v1.19.1
    at ghcr, install.yaml and the CLI tarball at the release tag. Computed
    deprecations from the CRD diff (kyverno.io/v1 of ClusterPolicy, v2 of
    PolicyException, ...) echo the documented policy from the other side:
    the CRDs themselves gained the deprecation markers. Helm-values diffs
    (nodeSelector os keys moved to global, new prometheusRule section),
    20 crd-schema additions, 5 GHSA fixes at 1.19.1, the EOL lifecycle
    change (1.18.2 end-of-life since 2026-08) and 8 no-range advisories as
    warnings. Tuning iterations: 3, all found by reading the edge, not by
    failing checks.
notes: >-
  The fifth zero-new-construct onboarding (grafana, strimzi, otel-collector,
  redis): the multi-image + same-repository-chart + pinned-CRD-subchart
  topology decomposed entirely into constructs earlier products introduced —
  lookup (argo-cd), version:field pins (kube-prometheus-stack), availability
  windows, source exceptions (vault), lifecycle statements (ingress-nginx,
  traefik, flux) and listItems (karpenter). 96 constructs used, 0 new, 0
  product-specific Go. Discovery contributed the versioning, both notes
  channels, the advisories, the install manifest and the readiness-checker
  boundary; research contributed the six release-workflow images, the chart
  relation correction, the kyverno-api pin and the website's deprecation
  channels. Fastest onboarding so far (17 minutes): every relationship
  validated from the first draft except one heading assumption, and no host
  was blocked.
