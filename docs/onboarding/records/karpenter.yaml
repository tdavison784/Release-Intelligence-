constructs:
  new:
    - name: column-kind:maximum
      kind: "compatibility column kind `columns[].kind: maximum` (a support-matrix column that bounds the platform from above)"
      justification: >-
        Karpenter's compatibility.yaml carries minK8sVersion AND maxK8sVersion per app
        version; the closed kind vocabulary (supported/tested/minimum) could not say
        "1.36 is the highest Kubernetes this release supports", so a maximum column
        would have rendered as a one-line 'supported' set. Catalog validator enum +
        JSON Schema enum + a place in upgrade's kindOrder; the constraint pipeline
        (ParseVersionRange, comparison, rendering) needed no change.
      otherProducts:
        - "Strimzi (order 12, wave 2: Kafka-versions and Kubernetes support matrices bound both sides)"
        - "Elasticsearch (order 18, wave 3: the support matrix lists a maximum Kubernetes per stack version)"
        - "Prometheus Operator (order 24, wave 3: kubeVersion-style upper bounds in compatibility docs)"
    - name: field:sources.extract.listItems
      kind: "definition field `extract.listItems` (boolean, whole/markdown-section): the structural reading every list item is one item and section prose is its own"
      justification: >-
        Karpenter's upgrade-guide sections open with a Hugo warning shortcode
        ({{% alert %}}) before the bullet list; the markdown section reader treats a
        prose-led section as one item and folds the whole list into it, so the 1.14
        guide bullets (CapacityBuffers graduation, DRA, balanced consolidation) were
        invisible and the folded item said breaking while containing "No breaking
        changes 🎉". The structural reading already existed for docbook/rst
        conversions (internal/ingest/docs.go structuralLists); this exposes it
        declaratively for markdown: catalog field + validation + schema + one
        condition in ingest, tests in normalize (per-bullet + callout items) and
        ingest (DocInput.ListItems pass-through).
      otherProducts:
        - "Traefik (order 13, wave 2: migration guides open with warning/highlight fences before bullet lists)"
        - "Grafana (order 11, wave 2: breaking-change docs use callouts above lists)"
        - "any Hugo/MDX docs site with alert shortcodes ahead of change lists (HashiCorp platform docs use the same shape)"
    - name: column-kind:minimum
      kind: "compatibility column kind `columns[].kind: minimum` (pre-existing; first accounted here)"
      justification: >-
        The kind existed in the vocabulary since the Phase 1 support-matrix work
        (cert-manager's record accounted supported/tested only) but no earlier
        product used it: karpenter's minK8sVersion is its first exercise. Accounted
        here so the product's unaccounted-construct list is empty; no code change.
      otherProducts: ["cert-manager and Istio declared minimums in their matrices but used supported/tested kinds"]
    - name: field:lifecycle.versions
      kind: "definition field `lifecycle[].versions` (semver constraint scoping a lifecycle statement; leaf of the lifecycle construct)"
      justification: >-
        The lifecycle construct landed with ingress-nginx (order 9), whose record
        declared the free-text family name "field:lifecycle" and explicitly called
        the versions constraint data, not a construct; stats counts the leaf
        separately. Karpenter is the first product to need TWO scoped statements
        (end-of-life of "< 1.9.0" and of "1.10.0 - 1.13.x"), so the leaf is
        accounted here. No code change.
      otherProducts: ["ingress-nginx (order 9) used one unscoped statement"]
  considered:
    - {name: "contents from OCI chart layers (helm-values/chart-metadata of the release's real chart)", rejected: "the chart a release ships is rewritten in CI and published only to public.ecr.aws; the in-repo files at the tag lag one release in every era, so a repo-file snapshot would misattribute the previous release's values. An OCI chart-layer content fetch (manifest -> layer blob -> tgz member) is the G8 shape and would also serve grafana/loki (OCI-only charts), but it is a new adapter capability, not a definition construct; recorded as a gap"}
    - {name: "version.strategy field on go.mod (the sigs.k8s.io/karpenter pin)", rejected: "field walks YAML documents (normalize.ReadYAMLPath); go.mod's require blocks are not YAML. The pin is also sometimes a pseudo-version (v1.14.1-0.20260819221709-6e7eab7a0f48) or lagged (v0.37.8 -> v0.37.7); gap recorded"}
    - {name: "exceptions for the missing compatibility records", rejected: "the X.Y.x record is absent at most X.Y.0 tags (verified 1.0.0-1.11.0, 1.13.0/1); that is 12+ exceptions and growing, not curation — the main-branch fallback group represents it and reports the miss honestly per release"}
    - {name: "chart contents from the lagged in-repo files anyway", rejected: "would produce wrong values diffs (at v1.14.1 values.yaml pins controller 1.13.0); a knowingly-wrong relationship is worse than none"}
    - {name: "classify rule for the LTS banner blockquote", rejected: "blockquotes do not parse as note items; the support window is represented by the lifecycle statements instead, which is the better channel"}
    - {name: "labelParagraphs for the v1.0.0 section's label bullets ('* Features:' with nested bullets)", rejected: "labelParagraphs promotes standalone paragraphs, not list-item labels; the groups stay one item per label with the full sub-bullet text and a sensible category"}
