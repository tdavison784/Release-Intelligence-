ambiguousRelationships:
  - "The image/chart registry-tag boundary is 0.35.0, not the v1.0.0 GA: release.sh strips the v before ko publish/helm package, so ECR tags are bare semver from 0.35.0 and v-prefixed before (documented in the website compatibility.md); git tags stay v-prefixed throughout — hence the legacy artifact twins."
  - "The in-repo chart files lag the tag by exactly one release in every era checked (v1.14.1 -> 1.13.0, v1.13.0 -> 1.12.1, v1.12.0 -> 1.11.1, v1.0.0 -> 0.37.0, v0.35.0 -> 0.34.0, v0.34.0 -> 0.33.0): the release job rewrites Chart.yaml/values.yaml in CI and the bump reaches main via the generated stable-release PR. This is what misled discovery into lookup/independent chart relations."
  - "The versioned website dirs appear only after the line's .0 tag (prepare-website copies preview/ post-tag, keeps last 3 + v1.0 + preview + docs); the line's own guide section is at the tag only in preview/, and even that fails for v1.13.0/v1.13.1 (section added after the branch point) and v1.5.0 — the main fallback answers those."
  - "compatibility.yaml record timing is inconsistent upstream: present at v1.12.0/v1.14.x tags, absent at v1.0.0-v1.11.0 and v1.13.x; the 1.12.x record is duplicated and 1.0.5 has a patch-granular record shadowed by 1.0.x."
  - "ECR Public throttles bursts of anonymous probes (3 chart probes reported unavailable on the first check run, cleared on re-run and verified by hand); the definition treats that as transient, not as a channel property."
  - "LTS designation is carried by release names ('v1.14.0 (LTS)', 'Supported until Jul 2027') and SUPPORT.md prose (main only); the two lifecycle statements approximate 'all but the two current LTS lines' with version constraints and will need updating when the LTS lines roll over."
  - "The v1beta1 -> v1 migration warning is repeated in EVERY upgrade-guide section since 1.0, so every minor-crossing edge reports it; faithful to the upstream document."
representability: full             # of the release topology: 9 sources, 8 artifacts, every channel verified incl. the new public.ecr.aws; the chart's contents and the libs pin are the cuts recorded below
gaps:
  - "Chart contents are not representable: the release's chart exists only as an OCI artifact to public.ecr.aws and the in-repo files lag one release, so the definition declares no helm-values/chart-metadata contents and edges carry no values diff. Needs the G8 OCI-chart-layer content fetch (also grafana/loki)."
  - "The upstream-libs relationship (sigs.k8s.io/karpenter pinned in go.mod, mostly == release version, occasionally a pseudo-version or one patch behind) is not an artifact: the field strategy reads YAML only and go.mod is not YAML; it surfaces only as the upgrade guide's 'Full Changelog' prose link to the libs release."
  - "LTS per release is not machine-readable (release names + SUPPORT.md prose on main): the lifecycle statements are curated approximations that will drift when the LTS lines roll over."
  - "Patch-level upgrade-guide sections (0.27.3-style) are not selected by the minor-anchored heading (same gap shape Cilium recorded); v1.0.0's label bullets ('* Features:' + nested bullets) fold into one item per label."
  - "compatibility.yaml's patch-granular records (1.0.5, maxK8s 1.31) are shadowed by the line records (1.0.x, maxK8s 1.30): the keyMatch cannot prefer the exact match."
  - "The LTS banner in release bodies is a blockquote and does not parse as a note item; the support window reaches edges only through the lifecycle statements."
sampleEdge:
  from: 1.13.1
  to: 1.14.1
  summary: "1 breaking · 4 action required · 18 changes · 0 warnings"
  evidenceRecords: 78
  notes: >-
    Path v1.14.0 -> v1.14.1 (minor-lineage). Breaking = the guide's standing
    v1beta1 -> v1 migration warning (1.1.0 drops v1beta1 APIs); action
    required = the guide bullets (CapacityBuffers graduation with the
    karpenter-crd chart step, DRA, balanced consolidation, preview instance
    types) plus the EOL statement "v1.13.1 is end-of-life since 2026-07; the
    upgrade target v1.14.1 is not" citing SUPPORT.md; computed: new
    autoscaling.x-k8s.io CapacityBuffers CRD; artifacts verified at ECR
    (controller/chart/crd-chart 1.13.1 -> 1.14.1) and via the tag archive;
    compatibility minimum 1.26 / maximum 1.36 unchanged (the new maximum
    kind). v0 -> v1 major edge 0.37.8 -> 1.0.0: 1 breaking · 13 action
    required · 43 changes — the v1.0.0 guide section (API moves/renames,
    behavior changes, env-var drops, RBAC diffs, IMDS default) plus computed
    v1beta1 -> v1 storage-version migrations for all three CRDs and the
    Kubernetes minimum narrowing 1.23 -> 1.25.
notes: >-
  First ECR Public product: public.ecr.aws answered anonymously end to end
  (token, tags, manifests, chart configs), so every image and chart
  relationship is registry-verified — the fleet-level verdict is "reachable,
  channel it normally; throttle bursts are transient". Onboarding was
  research-dominated: the two structures that dominate this product (the
  0.35.0 registry-tag boundary and the one-release chart/website lag around
  the tag) are invisible to per-tag probing from the newest release alone and
  are exactly what discovery's relationship checks flagged as failures; both
  recovered as declarations (template relations + legacy twins, preview-at-tag
  + main fallbacks). Two generic constructs landed (a vocabulary slot and a
  boolean exposing an existing reading), both small and both with wave-2/3
  beneficiaries; zero product-specific Go. Classification quality: the
  conventional-commit sections map 1:1 to categories, and the guide's tuning
  (skip '^No breaking changes', role-default action-required accepted) was
  found by reading edges, not by failing checks — the checks passed from the
  first draft (0 failures, 12 releases, 2 eras).
