# Discovery found the right skeleton: git-tags with the strict tagPattern,
# GitHub release body as notes, both charts as OCI on public.ecr.aws, CRDs in
# pkg/apis/crds (validated 6/6 itself) and github-advisories — and it probed
# public.ecr.aws successfully, establishing the new registry as reachable. It
# was misled twice by the one-release chart lag in the source tree (proposed
# lookup appVersion for karpenter-crd, independent for karpenter) and it
# dropped the controller image and the website upgrade-guide after validation
# failures ({{.Tag}} assumed for the image, versioned-docs path template for
# the guide) — both are structurally recoverable (tag boundary 0.35.0; preview
# docs at the tag), which is what research added.
