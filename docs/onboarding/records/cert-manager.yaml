goChanges:
  productSpecific: 0
  generic:
    - file: "internal/{domain,catalog,fetch,sources,gitsrc,github,httpsrc,oci,helm,normalize,ingest,upgrade,store,app}, cmd/ri, schemas/"
      purpose: "platform bootstrap shared by all three Phase 1 products (f2cb060 .. 9ea2472, cf69ea9): model, catalog format and validator, fetch cache, source adapters, parsing, ingestion, upgrade engine, CLI. Designed contract-first from docs/research/ of all three products"
    - file: internal/normalize/tables.go, internal/normalize/api.go, internal/ingest/docs.go
      purpose: "TableSelector.ValueColumns: skip tables that share the key column but have none of the value columns; cert-manager's LTS vendor table shadowed the 1.17 compatibility row (57a7b8f)"
    - file: internal/normalize/classify.go
      purpose: "a strong keyword (CVE, deprecat, removed) refines a weak 'Other (Cleanup or Flake)' section category, recorded as heuristic (57a7b8f)"
    - file: internal/normalize/classify.go
      purpose: "CVE/GHSA ids make an item a security item; future-tense phrasing is not a removal; found reviewing the v1.17.0 to v1.18.0 edge (a40e3ad, a6b5721)"
unreachableSources:
  - {host: api.github.com, reason: "egress policy 403 (GitHub release bodies and advisories); the website release notes cover it"}
  - {host: quay.io, reason: "egress policy 403 (images and OCI chart); four images are verified through the install manifest"}
  - {host: charts.jetstack.io, reason: "egress policy 403 (Helm repository index)"}
ambiguousRelationships:
  - "No upgrade guide exists for 1.13: upgrading-1.12.md covers it (LTS special case); left as an uncovered release"
  - "Release notes and the upgrade guide are read from website master, which is edited after release; evidence pins the digest of the bytes read"
representability: full
gaps:
  - "Mutable documentation: notes, guides and the support matrix on master change after release, so 'what the docs said at release time' needs history that the definition cannot express"
  - "Chart.yaml kubeVersion is a static install guard, not the support matrix; it is captured as chart-kubeVersion, separate from the compatibility table"
sampleEdge:
  from: v1.17.0
  to: v1.18.0
  summary: "5 breaking · 0 action required · 51 changes · 2 warnings"
  evidenceRecords: 112
notes: >-
  Phase 1 baseline, reconstructed from the version history and docs/FINDINGS.md. The
  platform was designed contract-first from the research of all three
  products and built in parallel, so the constructs credited here are the base
  set rather than additions to a working system, and goChanges includes the
  platform bootstrap. Neither the order-1 construct count nor the Go change
  count is comparable with later waves. Constructs are credited to the first
  product whose final definition uses them, with one exception:
  field:sources.fallbackGroup is credited to Istio because the named-group form
  was introduced for it (the first cert-manager draft used a boolean
  fallback flag that no longer exists). ri stats reports cert-manager's use of
  it as adopted later.
