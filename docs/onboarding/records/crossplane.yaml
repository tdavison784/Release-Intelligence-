ambiguousRelationships:
  - "CLI (>= v2.3) version vs core version: same minor line, independent patch; X.Y.0 is used as the line's representative, which says nothing about the CLI patch a given core patch pairs with"
  - "GitHub release bodies are hand-written for X.Y.0 and generated for patches; their structure (breaking-change conventions) could not be read, so classification of the fallback commit log is heuristic"
  - "xpkg.crossplane.io is the chart default image registry from v1.20.0 (xpkg.upbound.io before) but both are blocked; whether xpkg.crossplane.io carries every older tag is unknown"
  - "the stable chart index and bucket promote X.Y.0-rc.1 but never X.Y.0-rc.0; irrelevant while pre-releases are excluded, would need availability by pre-release otherwise"
  - "docs master retains v1.20 and the last three minors; older lines exist only as vX.Y-archive tags (including the typo v1.10-architve), so docs sources need an ordered fallback"
representability: partial
gaps:
  - "Kubernetes compatibility: docs only say 'an actively supported Kubernetes version'; no matrix, no chart kubeVersion, so the compatibility section of an edge is empty for Crossplane"
  - "Support window / EOL per release line (README table, release-cycle docs) cannot be expressed; same data exists, unrepresented, for cert-manager, Istio and Argo CD"
  - "Upgrade path constraints are prose only: upgrade one minor at a time, v2 only from v1.20 (the edge path policy matches the first, nothing encodes the second)"
  - "CLI of crossplane/cli: minor-aligned, patch-independent relation to core versions is approximated (X.Y.0 representative)"
  - "Release notes: hand-written GitHub release bodies are unreachable; the git log fallback is about half free-form subjects, has no breaking markers, double-counts cherry-picked backports, and leaves about half (224 of 429) of the v1.20.13 -> v2.0.8 items as 'other'"
  - "Chart archives (.tgz on S3), image digests and the CLI binaries are not read (G8); only existence is verified, the values come from the source tree at the tag"
  - "Provider/function compatibility (spec.crossplane.version in package metadata) and the crossplane-runtime dependency are outside the definition"
sampleEdge:
  from: 1.20.13
  to: 2.0.8
  summary: "24 breaking · 20 action required · 429 changes · 1 warnings"
  evidenceRecords: 672
notes: >-
  Representable as pure configuration for versions, chart, image, CRDs,
  docs-repo sources and the v1 -> v2 major transition; the major edge is the
  strongest output (10 declared removals from the upgrade guide plus CRD diffs
  such as the removed ControllerConfig/StoreConfig CRDs and the
  Composition v1 fields). Three S3 buckets (chart index, core release bundle,
  CLI bundle) were found behind blocked CloudFront hosts and make the chart,
  crank and CLI relationships verifiable without any new construct. The
  default `ri check` window (6 releases) found nothing wrong; the relationship
  errors only showed up when checking v1.0 .. v1.18 (values.yaml.tmpl, crank
  absent before v1.10). A recent minor edge (2.3.6 -> 2.4.2) has 0 breaking
  and 78 changes of which 19 are security items (Renovate [security] bumps plus
  one TOCTOU fix) and 22 are 'other'; real behaviour changes are only visible
  in those subjects.
