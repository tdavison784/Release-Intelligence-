notes: >-
  Second wave-2 product, first one with zero new constructs: every channel is
  covered by existing constructs (markdown changelog sections, fallback
  groups, OCI/helm-repo channels, availability eras, references
  cross-checks, and version.strategy field for the bridge pin introduced by
  kube-prometheus-stack two orders earlier). Onboarding was configuration
  plus critical reading: the two substantive decisions were negative — no
  format:adoc construct (Strimzi's per-release intelligence is markdown/YAML,
  the adoc docs are generic procedures; Elasticsearch should decide that on
  its own evidence) and no kafka-versions compatibility source (a point
  constraint diffed as a set change states falsehoods; the changelog carries
  the matrix truthfully). The definition also demonstrates the placeholder-
  Chart.yaml trap: a chart whose in-tree metadata is rewritten at packaging
  can only be related to releases through the published artifact. Discovery
  quality: it proposed the right skeleton (versions, notes, chart, CRDs,
  zip, operator image with references, advisories) and validated 9 elements
  itself; its two wrong calls were the chart "independent" version (read the
  placeholder) and four overlapping install manifests.
