constructs:
  new: []                  # zero: the first wave-2 product adds no construct
  considered:
    - "extract.format adoc: REJECTED. Strimzi's documentation is AsciiDoc, but every per-release upgrade fact lives outside it: release notes are CHANGELOG.md (markdown), the Kafka support matrix is kafka-versions.yaml (YAML), and the adoc assemblies are generic procedures parameterised by attributes (no per-release sections to select). A line-preserving adoc->markdown renderer would parallel rst/docbook but has no load-bearing content to read here. Elasticsearch (wave 3) is the named second AsciiDoc product: it should decide on its own evidence, not on Strimzi's — building it now would be speculative. (The one adoc-located fact, the :KubernetesVersion: attribute, is a one-line attribute assignment, not a document; an attribute reader would be a different, smaller construct — also not justified by one line.)"
    - "kafka-versions.yaml as a compatibility source (yaml-records over the version/supported/default records): REMOVED after reading the edge output. Any single-record selection (default version, oldest supported) yields a point constraint whose set-diff language is half-true ('drops 4.2' / 'adds 4.2'); representing the supported SET needs multi-record selection AND set-aware compat diffing (constraints are keyed by (platform, kind) alone) — a deep change whose cross-product demand is arguable (other onboarded matrices are one-row-per-release). Recorded as a gap instead."
    - "version.strategy field with a root-scalar path (bridge.version is a whole-file '1.1.0'): NOT needed — the same pin lives at kafkaBridge.image.tag of the chart values.yaml, a plain YAML path (the construct's intended shape, per kube-prometheus-stack)."
    - "extending the image-refs scanner to env values (STRIMZI_DEFAULT_*_IMAGE / STRIMZI_KAFKA_IMAGES of the install manifest): rejected — bare 'value: repo:tag' lines have no image key and would false-positive across products; the bridge pin is already an artifact, the kaniko/buildah/maven pins restate the release tag their artifacts verify."
    - "operator image on docker.io as mirror: kept as second channel (token-auth pull verified 200), unexercised while quay answers — same declaration pattern as Cilium."
