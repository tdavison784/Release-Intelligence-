  - "The Kubernetes minimum ('1.30 and later' at 1.2.0) is only an AsciiDoc attribute (:KubernetesVersion:) plus changelog prose; captured as action-required compatibility notes, not a platform constraint."
  - "The Kafka broker image (quay.io/strimzi/kafka, one tag per supported Kafka version) is a matrix artifact no version relation expresses; it is visible only through the changelog bullets and (partially) the CRD/values diffs."
  - "Install-manifest env image pins (STRIMZI_KAFKA_IMAGES map) are not scanned by the image-refs content (it reads image:/--x-image= lines only), so per-Kafka-version image moves do not appear as image changes; the release-tagged images (operator, kaniko, buildah, maven-builder, bridge) are artifacts and do."
