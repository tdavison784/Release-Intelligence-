constructs:
  new:
    - name: version:pattern
      kind: "version relation `version.strategy: pattern` + `pattern` (a regular expression with a named `(?P<version>…)` capture group, release-context templates allowed) + `from` (repo-file/http locator rendered at the release ref): the artifact version is the first capture in the raw text of the document"
      justification: >-
        The text-mode twin of version:field. field reads a version out of an addressable YAML
        scalar; pattern reads it out of a document where the pin lives inside a string — required
        for the umbrella-pins-controllers topology of this product: every controller version is
        embedded in a kustomize remote-resource URL (manifests/bases/<controller>/kustomization.yaml
        carries `resources: [https://github.com/fluxcd/source-controller/releases/download/v1.9.6/…]`),
        there is no YAML field anywhere at the tag (go.mod pins the same versions but is not YAML,
        the release body lists them as markdown links). Yields probe-able artifact instances with
        line evidence, so the edge states "source-controller v1.8.5 → v1.9.6 [verified]" for every
        controller of every release. Catalog gains the strategy + CompileVersionPattern (named
        group enforced), ingest the resolution with the matched line as evidence, JSON Schema and
        unit tests in all three packages.
      otherProducts:
        - karpenter (order 14: its record explicitly asks for this — 'the field strategy reads YAML only and go.mod is not YAML' for the sigs.k8s.io/karpenter pin; pattern over a raw go.mod at the tag reads it)
        - cluster-api and the kustomize-remote-resource style generally (CAPI's kustomization files pin component versions in releases/download/vX.Y.Z URLs of the same shape)
        - any aggregator pinning in Dockerfile FROM lines, Makefiles or .env files (the pin-in-text problem is the norm outside Helm charts)
    - name: field:artifacts.version.pattern
      kind: "definition field: the pattern of the pattern strategy (leaf; stats counts it separately from the strategy enum)"
      justification: "the pattern half of version:pattern; the sibling leaf of field:artifacts.version.field"
      otherProducts: ["same as version:pattern"]
    - name: field:sources.extract.tableHeading
      kind: "definition field `extract.tableHeading` (markdown-table): restrict the table search to tables under a heading matching a regex"
      justification: >-
        The field existed in the catalog since the Phase 1 table work (normalize.TableSelector
        carried it) but no earlier product used it: flux's release bodies are one document in
        which the compatibility table sits under '### Kubernetes compatibility' next to prose and
        PR lists, so the selector must be scoped or it would grab an unrelated table. First
        exercise; no code change.
      otherProducts: ["cert-manager/Istio-style support pages that mix several tables in one document (their matrices are single-table documents today)"]
    - name: field:artifacts.contents.locator.url
      kind: "definition field `contents[].locator.url` (an http content locator: contents read from a URL rather than a repo path)"
      justification: >-
        Content locators were repo-file in every earlier product (kube-prometheus-stack reads
        Chart.yaml/values.yaml from the repository). The install bundle's contents (image pins,
        CRD versions) must be read from the published install.yaml release asset — the generated
        manifests do not exist in the source tree (manifests/crds holds remote refs) and the OCI
        artifact denies anonymous pulls. First exercise of the url leaf on a contents locator; no
        code change.
      otherProducts: ["ingress-nginx/karpenter-style products whose only readable representation of an artifact is a release asset (the release-asset representation already exists, G8)"]
  considered:
    - {name: "version.strategy field for the controller pins", rejected: "the pins are not YAML scalars: ReadYAMLPath addresses mappings and [field=value] list selectors, and even an index selector would return the URL string, not the version — pattern is the minimal generic capability that fits"}
    - {name: "go.mod as the pin document (pattern over a raw go.mod)", rejected: "same versions today, but go.mod pins the /api Go modules whose minors can lag the controller releases; the bases kustomization is what the release actually ships (the manifests build resolves those URLs), so it is the canonical pin"}
    - {name: "chart contents via {{.ArtifactVersion}} (community chart values.yaml controller tags)", rejected: "would duplicate the controller pins the pattern artifacts already report verified (kube-prometheus-stack ignoreKeys precedent), and the chart lags upstream so the snapshot would misattribute; recorded as a gap instead"}
    - {name: "the 'Upgrade Procedure for Flux v2.7+' GitHub discussion as an upgrade-guide source", rejected: "a discussion page is HTML behind github.com, not a declaratively readable channel; the upgrade.md page and the per-release pointers carry the declarative parts"}
    - {name: "Kubernetes compatibility from the e2e workflow's kind node version at the tag", rejected: "a point constraint in workflow YAML env (no table/records shape for the compatibility extract); the release-body table is upstream's own support statement"}
    - {name: "per-controller CRD artifacts", rejected: "the CRDs of all controllers ship inside the install bundle; one contents snapshot (install-bundle/crds) diffs them without seven more artifacts"}
