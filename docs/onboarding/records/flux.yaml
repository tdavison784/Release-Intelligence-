ambiguousRelationships:
  - "The controller pins appear three times upstream with the same values: the bases kustomization URLs (what the manifests build resolves), go.mod require lines (the /api Go modules, occasionally lagging) and the release-body 'Components changelog' links. The definition reads the bases (the shipping pin) and skips the section in the notes (not-twice); the other two are unrepresented text."
  - "The community chart has its own majors: chart 2.19.x tracks appVersion 2.9.5 while chart 2.9.x tracked appVersion 2.0.0 — only the lookup (appVersion == release) is stable; 50 of ~70 stable releases 0.20.1-2.9.6 have a chart, minor .0 releases often never do, and the newest release lags by days-to-weeks."
  - "The Kubernetes compatibility table lists three supported minors per release; the table extract selects one row (the first = the floor) as a minimum constraint. The upper rows are a per-release supported SET the column model cannot express (karpenter's min/max columns are per-release rows, a different shape)."
  - "Patch releases carry no compatibility table and no guide: edges between patches have no compat statement even though the line's minor declared one (constraints attach to the release that declared them)."
  - "api.github.com anonymous is 60/h: both check runs exhausted it mid-run (release-note bodies are per-release API calls); every unverifiable was quota, cleared after the hourly reset — the definitions never changed."
  - "source-watcher is a default component since v2.7.0 but a separate upstream product (own repo, v2.x tags, pre-releases on its own line); modeled as the seventh pinned artifact, not as a version-independent presence."
representability: full             # of the release topology: the umbrella-pins-controllers shape is fully represented after one generic construct (pattern); the cuts below are the chart contents and the pin-text alternatives
gaps:
  - "The community chart's own files (values.yaml controller tags, Chart.yaml) are not snapshotted: their tags are per CHART version, and a contents locator would need the chart tag ({{.ArtifactVersion}} exists for channels but contents render at the release ref); the controller pins reach edges through the pattern artifacts instead."
  - "The Kubernetes supported SET (three minors per release) is reduced to the floor row; a set-valued compatibility column does not exist."
  - "Controller-CVE to flux-release joins: controller advisories declare affected ranges in their own version space (or none — the public endpoint returns null ranges, surfaced as check-manually warnings); pinning the join needs the pin map, the same cross-product question kube-prometheus-stack recorded."
  - "go.mod require pins (the /api module versions) are unrepresented text: pattern could read them but they are a different (sometimes lagging) version of the same pins — declaring both would state two truths for one component."
  - "The GitHub discussion 'Upgrade Procedure for Flux v2.7+' (the actual step-by-step migration guide every body points at) has no readable channel kind."
  - "The gotk-components OCI artifact cannot be probed anonymously; the definition probes its http twin instead, so the canonical channel's availability is inferred, not verified."
sampleEdge:
  from: 2.8.8
  to: 2.9.6
  summary: "6 breaking · 2 action required · 119 changes · 7 warnings"
  evidenceRecords: 303
  notes: >-
    Path v2.9.0 -> ... -> v2.9.6 (minor crossing, 6 patch steps). Breaking =
    six computed v1beta2 API removals (ImagePolicy/ImageRepository/
    ImageUpdateAutomation/Alert/Provider/Receiver — the real Flux 2.9 EOL
    story), each citing the install.yaml CRDs of both ends; action required =
    the upgrade-guide procedure; 1 removal from the guide's EOL warning; 1
    security change: GHSA-mwcp-qpcg-fr7c (CVE) computed as fixed by the
    upgrade at v2.9.3. The artifact table IS the aggregation topology: all
    seven controllers verified at ghcr (source-controller v1.8.5 -> v1.9.6,
    kustomize v1.8.5 -> v1.9.6, helm v1.5.5 -> v1.6.5, notification v1.8.4
    -> v1.9.4, image-reflector v1.1.2 -> v1.2.5, image-automation v1.1.4 ->
    v1.2.5, source-watcher v2.1.1 -> v2.2.4) plus CLI image/binary/sbom/
    source/manifests at the release tag, and chart 2.18.4 -> missing (no
    chart for 2.9.6 yet, warned). Warnings: the chart lag + 6 advisories
    with no machine-readable range. Minor-within-2.x edge 2.7.0 -> 2.8.0:
    7 breaking (the 2.8 v1beta2/v2beta2 removals of the source/kustomize/
    helm APIs) · 2 action required · 56 changes, Kubernetes minimum >= 1.32
    rendered from the body table.
notes: >-
  The umbrella-pins-controllers stress test resolved into one generic
  construct (pattern, the text twin of field — asked for by karpenter's
  record one order earlier) plus configuration: the umbrella is canonical
  (v2 tags), each controller is a per-release pin read out of the release's
  own kustomization URLs and verified at its own registry, the generated
  install bundle is probed and snapshotted through its release-asset twin,
  and the chart is an optional lookup in the community repository. Discovery
  proposed the right skeleton and its failure on the controllers was the
  topology speaking; 91 constructs used, 4 new (2 code, 2 first-exercise),
  0 product-specific Go. Two definition corrections came from the era check
  (the v0.25.3 asset boundary, the major-kind compat table), the rest from
  reading edges. 46 minutes wall-clock, ~25 of them waiting out the
  anonymous GitHub API quota (twice), the standing tax of a notes source
  behind api.github.com.
