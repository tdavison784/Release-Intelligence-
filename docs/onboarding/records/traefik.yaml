constructs:
  new:
    - name: field:lifecycle.versions
      kind: catalog-field (first exerciser; the field shipped with the lifecycle construct in wave 1)
      justification: >-
        The lifecycle statement must be scoped by a semver constraint to
        represent a dead major next to a live one: ">= 2.0.0, < 3.0.0" marks
        all of v2 end-of-life (v2.11 security support ended 2026-09-07 per the
        support-policy page) while v3 stays live in the same product and the
        same version list. ingress-nginx's statement covered the whole
        (retired) product, so the field existed but had never been used;
        ri stats listed it as unaccounted until this definition.
      otherProducts: [postgresql (parallel REL_N_STABLE majors, 5-year support windows), vault (LTS 1.19.x / extended maintenance 1.16.x, recorded as a gap in its record)]
  considered:
    - {name: "source-level optional (a markdown section may be absent for patch releases)", rejected: "absence is only curated per release (exceptions) and the patch-section set grows every release; restricted to releaseKinds [minor] and recorded as a gap instead"}
    - {name: "conditional path template ({{if ge .Minor 6}}migrate{{else}}migration{{end}}/v3.md)", rejected: "vault already rejected conditional templates; two availability-split sources are clearer, and the boundary (3.5.1) is mid-minor anyway"}
    - {name: "GitHub release body as a security source (per-release 'CVE fixed' GHSA list)", rejected: "same advisories as the github-advisories feed (deterministic, deduplicated); kept as the release-notes fallback only"}
    - {name: "docker.io/traefik/traefik as a second image artifact", rejected: "legacy containous repository superseded by the official image; the ghcr mirror covers reachability"}
    - {name: "docs/content/deprecation/features.md as a deprecation source", rejected: "three rows, a strict subset of the migration guides, and table rows are not note items"}
