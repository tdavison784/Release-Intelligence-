gaps:
  - "Patch-level migration steps (v3.md '## v3.7.13', v2.md '## v2.11.N') are not ingested: a source cannot declare 'the section exists only for some patches' (optional is an artifact fact), and the set grows each release; the v3.7.12 -> v3.7.13 edge therefore misses the h2c upgrade-requests step that the release body points at"
  - "The support-policy table (per-line active/security support dates) is markdown table rows, not note items and not compatibility constraints: the EOL date reaches edges only as text inside the lifecycle statement; a machine-readable per-line lifecycle would benefit PostgreSQL and Vault equally (their records list the same gap)"
  - "No Kubernetes support matrix exists upstream; only the chart kubeVersion floor (>= 1.25) is captured, and only for releases that ship a chart"
  - "Image presence on the canonical Docker Hub registry is unverifiable from this sandbox (anonymous 401); verification relies on the daily ghcr.io mirror"
  - "v3.md sub-topics are sometimes written at the version-section level ('## Dynamic configuration' inside the v3.7.13 area): those sub-items fall out of the extracted section (upstream formatting defect, content loss without a resolution failure)"
  - "The -ea.N (early access) prerelease family is parsed but excluded from the canonical list together with all other prereleases (includePrereleases unset)"
sampleEdge:
  from: 2.11.57
  to: 3.7.13
  summary: "43 breaking · 16 action required · 775 changes · 2 warnings"
  evidenceRecords: 1214
notes: >-
  Cross-major edge through the full dual-major history: path 3.0.0 -> 3.1.0
  -> ... -> 3.7.13 (21 releases traversed, 59 backports skipped). 43 breaking
  = the 23-topic v2-to-v3 guide (each topic breaking + action required) plus
  crd-schema diffs; the leaves-end-of-life lifecycle change cites the
  support-policy rules; the containo.us -> traefik.io CRD group change
  appears as the CRD diff (9 breaking crd-schema items). Second edge
  exercised: 3.6.25 -> 3.7.13 within v3 (0 breaking · 4 action required ·
  494 changes · 2 warnings; ingressClassName and retry-middleware CRD
  additions, Gateway API 1.5.1 pin, chart 35.x -> 41.6.1). Both edges were
  read critically: two classify tunings later the major edge shows exactly
  one deprecation item (the lifecycle statement) and no doc noise. Discovery
  (deterministic) correctly found the tag scheme, changelog, CRD directory,
  chart-by-appVersion relation and advisory feed, proposed an impossible
  chart tagPattern, and excluded every image: its release-infrastructure
  rules do not know the library-image + mirror-sync publishing model.
  Elapsed time is agent wall-clock and excludes this record.
