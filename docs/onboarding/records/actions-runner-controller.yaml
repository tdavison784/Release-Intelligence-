notes: >-
  Project status: ACTIVE, with the FIRST lineage dead. Releases continue on
  the gha-runner-scale-set family (0.13.1 2025-12-23, 0.14.0 2026-03-19,
  0.14.1 2026-04-15, 0.14.2 2026-05-22, 0.15.0 2026-10-01 - cut the day of
  onboarding; master commits the same day), developed with the GitHub Actions
  team. The v-tagged controller lineage ended at v0.27.6 (2023-10-20) and the
  README has called the legacy autoscaling modes "legacy ... maintained by
  the community only" since the v0.27.5 era (wording absent at v0.27.4
  2023-05-10, present at v0.27.5 2023-08-25; discussion #2775). Represented
  as one deprecated lifecycle statement citing the README (the modes ship
  inside every canonical release, so it applies to all of them; an
  end-of-life variant cannot scope to the dead family, see considered).
  Zero new constructs: the era switch is ingress-nginx's tagPrefix family
  selection plus the lifecycle construct, both wave-1/2 vocabulary.
  Discovery baseline was the lineage trap: version-sorted "latest tag" put
  it on the dead family's newest release, so every proposal described the
  legacy era while the live one (0.15.0, same repository, same day) was
  invisible to it - the strongest argument yet for discovery to enumerate
  tag families before choosing a canonical channel. Its template bug
  ('ghcr.io/${{/' from unmasked workflow expressions) dropped all three
  chart artifacts with Go template parse errors. 15 minutes wall clock,
  zero Go changes, checks green from the first default-window run.
