# Discovery scanned the repository at v0.27.6 - the newest tag by version
# sort, which is the NEWEST TAG OF THE DEAD LINEAGE (the live family
# gha-runner-scale-set-X.Y.Z numbers only reach 0.15.0, and 0.27.6 > 0.15.0).
# Everything it proposed therefore described the legacy controller era: the
# v-family tag pattern, docs/releasenotes sections, the legacy
# actions-runner-controller chart on gh-pages, the summerwind image. Its
# transferable skeleton was right (git-tags + github-releases versions,
# release body as notes - historically-validated by itself 5/5, CRD repo-dir
# config/crd/bases + contents - the same path in both eras, the
# actions-runner-controller.yaml release asset, github-advisories), and its
# gha-runner-scale-set chart proposals had the right repositories but (a) an
# "independent" version relation and (b) a template bug that broke static
# validation: the OCI channel template 'ghcr.io/${{/...' captured the
# workflow expression ${{ github... }} mid-string, so all three chart
# artifacts were dropped with a Go template parse error (a discovery defect
# worth fixing: mask ${{ }} before templating).
