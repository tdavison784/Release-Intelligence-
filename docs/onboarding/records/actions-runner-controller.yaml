ambiguousRelationships:
  - "The release lineage switched families inside one repository: v0.X.Y controller releases (2020 - 2023-10-20) then gha-runner-scale-set-X.Y.Z chart releases (2023-02-23 - today), both numbered from 0.x. The canonical channel selects the live family; the dead one is a lifecycle statement, so 'upgrading from v0.27.x' has no versioned answer in ri (see gaps)."
  - "The release unit is the CHART release: tag gha-runner-scale-set-X.Y.Z cuts both charts and the controller image at the same version (hack/check-gh-chart-versions.sh enforces binary == chart == appVersion); the tag is cut on the 'Prepare X.Y.Z release' bump commit, so the in-tree chart files at the tag ARE the release's (no karpenter-style CI lag)."
  - "ghcr /tags/list truncates by default (gha-runner-scale-set-controller showed numeric tags only up to 0.5.0 until ?n=1000; every 0.6.0-0.15.0 manifest answers 200 to HEAD). ri probes manifests, so verification is unaffected; any future tags/list-based feature must paginate."
  - "The one release asset, actions-runner-controller.yaml, is the LEGACY install path's kustomize build: its image is summerwind/actions-runner-controller:gha-runner-scale-set-X.Y.Z - a legacy-repo Docker Hub tag carrying the full release tag name. It exists (verified via the Hub API) but belongs to no declared artifact; the image-refs snapshot records it faithfully."
  - "At 0.2.0 the runner chart was still named charts/auto-scaling-runner-set (renamed at 0.3.0), so chart artifacts/contents carry availability >= 0.3.0 while the OCI chart tags for 0.2.0 exist."
  - "The deprecated lifecycle statement renders as 'Target ... is deprecated since 2023-08' although its content is the legacy-MODES deprecation (the modes ship inside every canonical release); the standing-banner semantics follow the ingress-nginx/karpenter precedents."
  - "docs/releasenotes/app-version-mapping.md is an upstream controller<->chart mapping table for the legacy lineage (0.27.0 -> 0.22.0 ...); nothing in the canonical family corresponds to it."
representability: full             # of the live lineage: 5 sources, 6 artifacts, every channel verified against all 21 checked releases incl. ghcr images and OCI charts; the cuts are the dead-lineage version list and the upstream-absent upgrade/compatibility documents
gaps:
  - "The dead v-tagged lineage (v0.1.0 - v0.27.6, the legacy modes' releases) is not a version list: one canonical channel per product cannot hold two families with colliding 0.x numbers, so 'upgrade from v0.27.6' resolves to no path. It is represented by the deprecated lifecycle statement, the description and the research doc. A cross-product 'alternate lineage' construct (also traefik's pre-3.0 tags, kubernetes's legacy naming) would need version namespaces, a model change beyond a field."
  - "No upgrade-guide source exists for the live family: upstream publishes none (docs.github.com is generic, the in-repo UPGRADING.md is the legacy chart's versionless CRD procedure). Edges carry the generated release body and computed CRD/values diffs instead - which is where this project's real breaking changes live."
  - "No compatibility matrix (Kubernetes or runner versions) is published in machine-readable form; runner compatibility arrives only as 'Updates: runner to vX' release-body bullets (classified dependency), k8s compatibility only as CI matrices."
  - "Runner image pins are note items, not artifacts: the gha-runner-scale-set values default the runner image to a floating latest, so no per-release runner version can be probed from the definition."
