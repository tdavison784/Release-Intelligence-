notes: >-
  Wave 4's first edge case: the fork-reuse measurement against elasticsearch
  (order 18). How much of the sibling's definition carried over in shape:
  6 of its 10 sources (canonical git-tags + GitHub fallback, per-release
  notes read at main, a breaking-changes channel, an http lifecycle-evidence
  page, the advisory feed) and 4 of its 6 artifacts (image, tarball,
  source archive, and the Lucene pin — lucene-core-legacy is the IDENTICAL
  construct on the IDENTICAL file, version:pattern over
  buildSrc/version.properties) plus the dual-major lifecycle shape
  (one semver space, constraint-scoped statements: everything below 2.x
  end-of-life since 1.3.20/2024-12, 2.x deprecated since 3.0/2025-04) —
  11 of 17 declared elements are the sibling's shapes. The headline negative:
  format:adoc carried over ZERO uses. The elasticsearch record justified the
  construct's future by 'opensearch (the fork of this very repository keeps
  the same migrate_N_0.asciidoc conventions)' — the fork deleted its docs
  tree; migration intelligence lives in a separate Jekyll-markdown repository
  whose breaking-changes page is the plain-markdown twin of the file that
  needed adoc+labelParagraphs upstream. The claim was testable and false,
  which is exactly what wave 4 exists to find: the construct remains
  justified by elasticsearch's own 7.0/8.0 guides (no markdown twin exists
  there), but its cross-product story now rests on the other named users
  (neo4j, the elastic siblings), not this fork. What the fork added that the
  sibling lacks: a real fallback for missing notes files (GitHub bodies with
  full content vs ES's stubs), a community chart joined by appVersion
  (argo-cd's lookup), image mirror channels, and the TOML-catalog pin era
  (flux's version:pattern). Numbers: 80 constructs used, 80 reused, 0 new,
  0 Go changes, 0 exceptions; 17 releases checked across every era, final
  failures 0, nothing unverifiable — Docker Hub anonymous even answered
  during research (mirrors declared regardless, per the protocol's
  canonical-first rule). Other edges exercised: 1.3.20 -> 2.0.0 (60 breaking
  · 194 changes · 3 warnings, the third warning being the deprecated-target
  notice — the page's 2.0.0 topics + the notes' 'Breaking Changes in 2.0'
  section + the type-removal items), 3.8.0 -> 3.9.0 (0 breaking · 90
  changes, routine) and 2.19.5 -> 2.19.6 (22 changes, notes served by the
  GitHub-body fallback). Discovery baseline: right versioning and the real
  notes file, wrong ref (its 4-release validation window sits inside the
  at-tag era — window placement hiding a 33/71 mismatch), zero artifacts
  with the real registries excluded by the docs-only/no-release-evidence
  rules (the elasticsearch DRA blind spot, now a pattern: org-level release
  infrastructure is invisible to repository scanning), the chart excluded
  for no in-repo reference, and the docs repository correctly scanned but
  only for a lower-ranked notes template. Elapsed time is agent wall-clock
  and excludes this record.
