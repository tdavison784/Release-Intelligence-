ambiguousRelationships:
  - "The tag scheme changed at go1.21 and one pattern absorbs it: go1.20 is 1.20.0 (component group, missing patch = 0) while go1.21.0 already carries the .0 - upstream's own statement ('Starting in Go 1.21, the first release is now Go 1.N.0'). Nothing in the definition distinguishes the eras except availability windows."
  - "The go.dev notes and release-history pages are mutable (the notes pages grow patch annotations); evidence digests pin what was read, and the era-A in-tree twin is the ref-stable alternative."
  - "mirror.gcr.io/library/golang lags the newest release: golang:1.27.1 and the bare 1.27 alias were absent on 2026-10-01 while 1.27.1-alpine existed and docker.io answered 200 directly - the inverse of the usual Hub-429 situation; docker.io is the first channel, so checks passed."
  - "The library notes bundle several changes per package paragraph (one item per h4 package / dt-dd pair): a paragraph that adds a feature AND removes a GODEBUG (go/types 1.27, go fix 1.27) is classified by its most action-relevant mention (removal); per-change granularity does not exist upstream in era B."
  - "doc/go1.19.html exists at go1.19rc2 but not at go1.19 (deleted at the final tag, absent from the release branch): encoded as a source exception; whether 1.21+ 'would-be' files were ever committed to a tag is moot (they never were)."
  - "Alias image tags (1.27, 1.27-bookworm) and the rolling 1 tag are not modeled: they move days behind upstream and re-pointing aliases are registry state, not release facts."
representability: full          # versions (both eras, one pattern), notes (both eras + patches), policy, lifecycle, tarballs/installers/image are all represented; prereleases and the per-patch security paragraphs are scoped out (gaps)
gaps:
  - "Prerelease tags (go1.NrcM, go1.N.MrcM, beta/alpha) are outside the release space: the rc suffix attaches at two positions and one named group cannot occupy both; matters only for RC-window testing."
  - "The release-history page's per-patch paragraphs ('go1.26.1 (released ...) includes security fixes to the crypto/x509, ... packages') are the densest per-patch security summaries upstream publishes, and they are addressed only by <p id> anchors no construct selects; patch security visibility is limited to patch-log subjects that say 'security' (rare on the branch) - most security backports classify as plain bugfixes."
  - "The Go vulnerability database (vuln.go.dev, JSON API, reachable) and golang-announce (reachable, JS-rendered) have no adapters; the GHSA repository feed is empty. Toolchain CVEs are therefore invisible as advisories."
  - "OS/arch requirements (macOS 13, Windows 10) are prose in the Ports section: they surface as action-required compatibility items, not CompatibilityConstraints - the impact join cannot key on the environment's OS."
  - "GOTOOLCHAIN auto-switching (1.21+), the golang.org/toolchain module it downloads, the x/... module ecosystem and gopls are separate compatibility surfaces, noted in research but not modeled."
  - "The Go 1 compatibility promise itself ('we expect almost all Go programs to continue to compile and run as before') has no representation beyond the Introduction item it produces."
sampleEdge:
  from: 1.26.8
  to: 1.27.1
  summary: "0 breaking · 2 action required · 62 changes · 0 warnings"
  evidenceRecords: 96
  notes: >-
    Path go1.27.0 -> go1.27.1 (minor-lineage). The two action-required items
    are the raised OS floors ('Go 1.27 requires macOS 13 Ventura or later',
    'at least Windows 10 or Windows Server 2016') with line evidence into the
    converted go.dev page; 4 removals, every one genuine (bzr support, the
    GODEBUG settings whose support was removed, the fmtappendf modernizer,
    the gotypesalias GODEBUG), 31 declared features (generic methods,
    crypto/mldsa, uuid, encoding/json/v2, simd) and the artifact table shows
    every channel verified, docker.io included. Other edges: 1.27.0 ->
    1.27.1 (0 breaking · 14 changes: 6 bugfix, 1 feature, 7 other - the
    release branch's 14 backports minus the release commit, exactly) and
    1.20.14 -> 1.21.0 across the tag-scheme boundary (3 action required:
    the EOL lifecycle statement fires for the target, macOS 10.15 and
    Windows 10 floors; artifact URLs render go1.20 in era A and go1.21.0 in
    era B from the same templates). Tuning iterations: 2, both from reading
    edges.
notes: >-
  THE HEADLINE - the component-group construct held, and the product it was
  named for corrected its example rather than its need. PostgreSQL's
  justification said "Go (go1.22 is 1.22.0)": the tag go1.22 does not exist -
  upstream renamed the scheme at 1.21 ("Starting in Go 1.21, the first
  release is now Go 1.N.0"), so the two-part shape the construct assembles
  (missing patch = 0) applies to go1..go1.20 and the 1.21+ minors carry the
  .0 in the tag. One pattern covers both eras, the lineage/kind/availability
  machinery works unchanged, and - the part PostgreSQL predicted wrong - no
  display-template machinery was needed at all: Go's tag IS its published
  version string (go1.20 in URLs, golang:1.20.0 on the image), so neither
  the {{if ge .Major}}/.Patch templates nor a published-version variable
  were required. The construct verdict: necessary (20 real releases would
  otherwise be unrepresentable), sufficient (nothing else was needed for
  versions), and its one real limit found by contact: a single named
  prerelease group cannot express Go's rc-after-minor AND rc-after-patch
  tags, so prereleases are out of scope. The second stress test, the
  tfaws no-charts shape, decomposed the same way (tarballs + image + no
  fallback releases feed). The HTML problem was SOLVED generically
  (format:html, the fourth converter in the docbook-created slot) rather
  than recorded - without it the whole 1.21+ era would have had no notes
  channel at all, since golang/go publishes no GitHub releases; the
  release-notes ARE the HTML, not mirrored by it. The two-minor support
  policy is a lifecycle statement citing the reachable policy page
  ("< 1.26.0 end-of-life since 2026-08"), and the edges show it firing on
  old targets. 66 constructs used, 1 new, 98% reuse, 0 product-specific Go.
  28 minutes.
