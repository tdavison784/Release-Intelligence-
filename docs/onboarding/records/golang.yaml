constructs:
  new:
    - name: "format:html"
      kind: extraction
      justification: "Go's release notes exist ONLY as HTML: the in-tree doc/go1.N.html at every era-A tag (go1..go1.20, still stamped 'DRAFT RELEASE NOTES' in-tree) and the published go.dev/doc/go1.N pages of the whole 1.21+ era - there are no GitHub releases at all (empty /releases, /releases/latest 404) and the markdown sources (doc/next/*.md) are deleted from master at each release cut, so they exist at no tag. normalize.HTMLToMarkdown is the fourth member of the format slot created for docbook and filled for rst and adoc: line-preserving (output line N renders input line N, evidence locators stay on original lines), h1-h6 become headings written back onto their opening line, li become bullets (2-space nesting), dt/dd become term/description lines, pre is 4-space code, code becomes backticks, a[href] markdown links, entities decoded, comments and head/style/script dropped; parsed in list-item mode like the other converted formats. Whole and markdown-section only (no table conversion - Go has none; the validator and schema say so)."
      otherProducts:
        - "Tomcat (per-line changelog.html on tomcat.apache.org, no markdown twin)"
        - "Kafka ('Notable changes' per release only on the downloads page)"
        - "Maven (docs/history.html release notes)"
        - "Mozilla/Firefox release notes (mozilla.org HTML)"
        - "the slot itself was justified by postgresql ('the format field is the slot for the other non-markdown note formats') and filled by cilium (rst) and elasticsearch (adoc)"
  considered:
    - {name: "paragraph-anchor section selection (markdown-section over <p id=go1.N.M> blocks)", rejected: "would need a new locator construct (anchor/paragraph addressing) whose cross-product case is weak - Tomcat/Kafka HTML is heading-structured - while the git-log channel already carries every patch fact deterministically; the lost content is the 'includes security fixes to X, Y' summaries (recorded under gaps)"}
    - {name: "rc/beta/alpha tags inside the version pattern", rejected: "Go's prerelease suffix attaches after the minor (go1.21rc1) AND after the patch (go1.9.2rc2): one named (?P<prerelease>) group cannot sit in both alternation positions, and the component-group construct has no second prerelease slot; stable-only is the honest scope (postgresql included its RCs because they sit in one position)"}
    - {name: "the dl page JSON (go.dev/dl/?mode=json&include=all) as an artifact version index", rejected: "365-entry machine-readable manifest (files, sha256, size) but no adapter reads a JSON version index, and nothing needs it: every artifact URL templates on {{.Tag}} exactly; noted in research as a future 'manifest evidence' source"}
    - {name: "a published-version/display template variable", rejected: "postgresql rejected the same idea pending 'Go/Linux/Python': for Go it is unnecessary - the tag IS the published string (go1.20, go1.21.0) and the image uses {{.Version}} (golang:1.20.0 exists); neither eq/ge/Patch display templates nor a new variable are needed"}
