# Discovery baseline at the "~2500+ tags" scale: WRONG PREMISE, trivial run.
# A fresh partial clone lists 496 tags (not 2500+: 269 three-part stable, 20
# two-part minors go1..go1.20, 99 weekly.*, 65 rc, 29 alpha/beta, strays) and
# discovery finished in 8.3 s over all of them. It proposed exactly 3
# elements (tag scheme, git-tags channel, advisories) and found nothing else
# — correctly: the repo has no images, no charts, no release workflow, and
# the notes are .html files its markdown scanners pass over. Its one
# substantive miss: the proposed semver tagPrefix 'go' treated the 20
# two-part minor tags as junk (227 junk incl. go1..go1.20), i.e. discovery
# cannot invent the component-group mapping that this product is the
# justification test for. Everything except git-tags and advisories is
# research; there was nothing wrong to reject.
