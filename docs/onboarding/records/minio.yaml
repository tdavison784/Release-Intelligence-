constructs:
  new:
    - name: "lineage:linear"
      kind: lineage value (first exercise; the constant and its all-releases path policy existed since the Phase 1 foundation)
      justification: "MinIO is the first genuinely line-free product onboarded: 521 timestamped releases on one mainline, no branches, no backports (SECURITY.md: security fixes land in the latest release only), so upgrades must consider every intermediate release - exactly what PolicyAll traverses. Zero code change: discovery itself proposed lineage linear (from tag shape); every earlier definition used minor."
      otherProducts:
        - "external-secrets (order 9): its record says 'history is linear and only the newest minor is supported, which does not fit lineage minor; chosen only for its path policy' - it wanted linear and worked around it (its gap names a .PrevRelease variable for linear git-log ranges)"
        - "any single-train product (rolling-release servers without maintained branches)"
    - name: "template-func:replace"
      kind: template function (first exercise; in the funcs map since cert-manager's foundation)
      justification: "Renders the RPM/DEB asset names, whose versions are upstream's own CalVer-to-numeric normalization (minio-20250907161309.0.0-1.x86_64.rpm), by stripping RELEASE. / - / T / Z out of {{.Tag}} (four nested replace calls, in the version template and the channel URL of two artifacts). Zero code change."
      otherProducts:
        - "no onboarded product has needed string surgery on a tag before (versions appear verbatim in asset names); the need is generic for dated or re-separated asset names, and any future CalVer product (the same family question as the rejected calver scheme - see considered)"
  considered:
    - name: "scheme: calver (a calendar-version scheme with date-aware ordering, no semver assembly)"
      reason: "the mission's central question. Rejected: no cross-product evidence - Linkerd's edge-Y.M.N family was excluded by its own record (helm.linkerd.io/edge 'CalVer versions; the edge family is out of scope'), Kubernetes v1.Y.Z is semver-shaped, and none of the other 23 products needs date ordering; the honesty mandate forbids a one-product construct. The component-group encoding below represents what is representable and the rest is recorded as gaps"
    - name: "time-of-day as (?P<prerelease>) (RELEASE.2024-11-07T00-52-20Z -> 2024.11.7-T00-52-20Z)"
      reason: "would make every final release a prerelease: the listing drops them without includePrereleases, selectPath skips prereleases even with it (so upgrade paths would collapse to the target alone), and prevInLineage skips them (PrevTag always empty). Strictly worse than the day-granular encoding"
    - name: "whole-timestamp major, the RPM shape (20250907161309.0.0)"
      reason: "impossible without new capability: the assembler concatenates raw group captures, and a single capture cannot span the tag's '-'/'T'/'Z' separators; stripping them inside a component would be a new construct (an assembler transform), rejected for the same no-second-product reason as the calver scheme"
    - name: "leading-zero stripping in componentVersion (Go)"
      reason: "avoided with pure configuration: '0*' consumed outside the capture groups normalises 01 -> 1 in the regex itself; strict semver then accepts every date. Recorded because the leading-zero hazard is the second CalVer trap (after separators) that any future calver encoding hits"
    - name: "chart-package references for the image"
      reason: "see manualInterventions: the reference probe cannot read packaged-chart bodies, so the cross-check never fires; dropped rather than declared dead"
