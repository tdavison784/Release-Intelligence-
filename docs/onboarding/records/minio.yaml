ambiguousRelationships:
  - "13 same-day release pairs (2016-12-12 ... 2023-11-01): the later tag of each day is invisible - 'ri upgrade minio RELEASE.2022-03-17T02-57-36Z RELEASE.2022-03-17T06-34-49Z' answers 'not a known release' because both parse to 2022.3.17 and the listing keeps the lexicographically smaller (earlier) tag, reporting '13 duplicates'"
  - "the RPM/DEB artifact version is upstream's own normalization of the tag (20250723155402.0.0), rendered here by template string surgery; upstream itself proves the timestamp-as-number reading, but the model cannot derive it structurally (considered: whole-timestamp major)"
  - "charts.min.io is served from the product repository itself (helm/minio + root index.yaml + helm-reindex.sh), yet its version train is independent and frozen since 2025-01-02 (5.4.0 -> RELEASE.2024-12-18): only the appVersion lookup joins it, and every release after 2024-12-18 warns 'no chart version ships appVersion ...' - true and useful (the chart no longer tracks releases)"
  - "RELEASE.2025-09-06T17-38-46Z exists as a git tag, has cached atom-feed content, but its GitHub release is deleted: relationships that ride the release object are broken upstream (curated exceptions), and drift should be watched for more deletions (the atom feed's bulk 'updated 2026-04-24' stamps show a mass edit event)"
  - "version display: users and upstream docs speak RELEASE.2024-11-07T00-52-20Z; the model's semver is 2024.11.7 and 'ri upgrade' accepts either form, but edges and JSON carry the synthetic number (the same class of gap postgresql recorded for two-part versions)"
representability: partial
gaps:
  - "THE CalVer gap: the time-of-day is not representable. The component-group assembler offers major/minor/patch[-prerelease] and cannot strip the tag's intra-day separators, so RELEASE.YYYY-MM-DDTHH-MM-SSZ maps to day granularity (2024.11.7). The 13 later same-day releases (2.5%) are dropped from listing, paths and edges - with their notes and assets; the two hazard layers (separators, leading zeros) and the rejected escape hatches are documented under constructs.considered. Matters because MinIO really did publish twice on those days, and the evening release is usually the corrected one"
  - "release kinds are meaningless under this encoding: every version has patch != 0 (a day), so all 508 releases are kind 'patch'; major/minor never occur and releaseKinds filters cannot express anything real"
  - "Line() is a calendar month: synthetic. Nothing consumes it under lineage linear, but any consumer that assumed semver lines (support windows per line, minor-lineage reasoning) would build on sand"
  - "availability constraints are month-granular: '>= 2023.7.0' means July 2023 onwards; a day-precise window cannot be written (the day lives in patch, so '>= 2023.7.7' does mean the 7th onwards - but ranges like 'only the 2024-11-07 release' cannot select one day's pair member)"
  - "PrevTag is empty at each month's first release (prevInLineage only looks within the same major.minor line): git-log-style note sources (baseRef '{{.PrevTag}}..{{.Tag}}') cannot be declared - a hypothetical commits-between-notes channel for the 2025-09-06 deletion gap is therefore impossible too"
  - "the support model 'security updates land in the latest release only' (SECURITY.md) cannot be scoped: no constraint expresses 'every version except the newest', so the edge cannot state that an intermediate target will never be patched; the end-of-life statement covers the retirement but not the latest-only policy of the living era"
  - "minio-image has no verifiable channel from this sandbox (docker.io 401, quay.io 401, mirror.gcr.io empty) and no cross-check artifact: the one artifact users actually pull stays expected-forever here"
  - "dl.min.io binaries are gone (410 Gone) and the final release ships no assets: binary verification is release-asset-only (>= 2021.1); the 2016-2020 dl.min.io era is unverifiable by design"
sampleEdge:
  from: RELEASE.2025-09-07T16-13-09Z
  to: RELEASE.2025-10-15T17-29-55Z
  summary: "0 breaking · 5 action required · 17 changes · 30 warnings"
  evidenceRecords: 60
  notes: "The adjacent hop into the final release, and everything the retirement means in one edge: the target is end-of-life since 2026-02 (action required, README evidence), the CVE body ('Privilege Escalation via Session Policy Bypass', GHSA-jjjj-jwhf-8rgr) is the second action item, and the three 'no longer published' artifact diffs (binary, deb, rpm, each citing the 09-07 URL it vanished from) are the source-only pivot made visible. 30 warnings = the frozen chart ('no chart version ships appVersion ...'), the never-observed image and 18 advisories without machine-readable ranges (each names its GHSA). Second edge exercised: RELEASE.2025-06-13T11-33-47Z -> RELEASE.2025-07-23T15-54-02Z, a 2-hop linear path (07-18, 07-23) - 0 breaking · 2 action required · 11 changes."
notes: >-
  The versioning stress test, answered. What worked without any new
  capability: the postgresql component-group tagPattern reads
  RELEASE.YYYY-MM-DD as 2024.11.7 (chronological ordering, full 508-release
  listing, month-granular era windows), lineage linear - until now vocabulary
  no definition had exercised - expresses the one-mainline no-backports
  topology exactly (every intermediate release traversed, which upstream's
  own README endorses: parallel, all-servers-at-once upgrades to any newer
  release), {{.Tag}} templates carry the real timestamp into every locator,
  and the whole retirement story (README banner, source-only section,
  SECURITY.md support model) is the ingress-nginx lifecycle pattern verbatim.
  What did not: the time-of-day (13 same-day later releases invisible),
  meaningful release kinds (all 'patch'), non-synthetic lines, day-precise
  availability, PrevTag at month boundaries, latest-only support scoping,
  and any verifiable image channel. Two CalVer hazard layers were found and
  one was defused in pure configuration (leading zeros via '0*' outside the
  captures; the first pattern silently matched 78/521 tags and ri check
  passed on that sample - the check does not notice a shrunken version
  space, ri versions' 'non-matching' counter is the only trace). No calver
  scheme construct: Linkerd's excluded edge family and Kubernetes's
  v-prefixed semver leave MinIO without a second product that needs date
  ordering, exactly the case PROTOCOL step 8 says to record as a gap. Two
  zero-code first exercises are credited (lineage:linear, template-func:
  replace) so the stats accounting stays clean. 29 minutes, 0 Go changes,
  0 check failures after the deletion exceptions, tests green.
