representability: full          # versions, notes, chart, packages, images and the driver/libs/falcoctl pins are fully represented with constructs from orders 1-15; the uncovered parts are mutable current-state documents (see gaps)
gaps:
  - "The prebuilt-driver/kernel matrix (which kernel x distro x arch has a compiled kmod per driver version — download.falco.org/driver/site/<version>.json, 2.4 MB, dated snapshot) is not representable: keyed by an artifact-resolved version, set-valued per kernel, no per-release history. The PER-RELEASE driver version IS represented (pattern pin, verified tarball), so an edge states the driver bump; whether a given node's kernel has a prebuilt probe is not derivable from the definition."
  - "Driver-kind support per release (kmod / legacy eBPF probe / modern_ebpf / gVisor) exists only as narrative (changelog breaking sections, chart BREAKING-CHANGES.md): 0.43.0 deprecated and 0.44.0 dropped gVisor + legacy BPF probe + gRPC output — surfaced as breaking items, not as a per-release kind set."
  - "The modern_ebpf kernel floor (>= 5.8 or backported BTF) is a static statement in RELEASE.md — a constant, not a per-release constraint."
  - "The rules submodule pin (falcosecurity/rules gitlink, moves every release) is not readable as a document; the rules file is a separate product."
  - "Asset families: aarch64 package twins, the -static tarball, x86_64-/aarch64- and -debian/-suffixed image tags are not expressible (flux/kyverno recorded the same)."
  - "Pre-0.33.0 releases pin libs by commit hash (probe-able via the /archive/<ref> URL shape in principle); the driver pin does not exist in this file before 0.33.0."
