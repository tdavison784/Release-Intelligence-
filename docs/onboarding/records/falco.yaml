    driver-source 10.2.0+driver -> 11.0.0+driver and libs-source 0.25.4 ->
    0.26.0 (each with the pin line at driver.cmake L38 / falcosecurity-libs
    .cmake L45 plus both tarballs as evidence), the falcoctl pin 0.13.0 ->
    0.14.2 (values.yaml L530/L549 + both image manifests), and the three
    download.falco.org packages + source archive. Helm-values diffs: the
    plugin refs, falcoctl tag, new controller.* keys and
    serviceAccount.labels. Second edge exercised: 0.43.1 -> 0.44.0 (4
    breaking · 0 action required · 16 changes · 1 warning) — the four
    breaking items ARE the documented 0.44.0 drops (gRPC output+server, gVisor
    engine, legacy BPF probe — the driver-kind dimension — plus the -o
    key-path parser change), the falcoctl artifact appears as 'added'
    (not-applicable -> verified 0.12.2, the availability window), and the one
    warning is the 0.44.0 chart-values diff skipped by the falco-9.0.0 digest
    anomaly. Tuning iterations: 2, both found by reading the edges, not by
    failing checks.
notes: >-
  The sixth zero-new-construct onboarding (grafana, strimzi, otel-collector,
  redis, actions-runner-controller, kyverno): the engine + pinned-driver +
  monorepo-chart + download-host topology decomposed entirely into constructs
  earlier products introduced — pattern pins (flux), field pins
  (kube-prometheus-stack), lookup (argo-cd), packaged-chart contents (G8),
  availability windows, source exceptions (vault), fallback groups. 75
  constructs used, 0 new, 0 product-specific Go. Discovery contributed the
  versioning, both images, the chart relation (its best monorepo call yet —
  proposed and self-validated the appVersion lookup), the advisories and the
  changelog file; research contributed the master-read correction, the
  driver/libs/falcoctl pins, the download.falco.org packages and the
  source archive. 21 minutes wall-clock, ~10 of them waiting out the
  anonymous api.github.com quota that discovery had exhausted (the flux
  standing tax). download.falco.org verdict: REACHABLE — 307 to its CloudFront
  distribution which answers 200 anonymously.
