  - {id: "artifact:bundle-manifest (separate)", reason: "same content as the in-tree bundle.yaml; one artifact, two channels (repo-file canonical + http release asset)"}
  - {id: "crd example/prometheus-operator-crd-full", reason: "the conversion-webhook representation (adds the v1beta1 AlertmanagerConfig served version); the canonical shipped set is example/prometheus-operator-crd, which bundle.yaml, stripped-down-crds.yaml, the jsonnet lib and the chart's CRDs are all generated from"}
  - {id: "image quay.io/prometheus-operator/prometheus-operator-dev (and -reloader/-webhook twins)", reason: "resolver excluded them itself (dev-registry): development images built from branch pushes, not release channels"}
  - {id: "binary.version = {{.Version}} / VERSION file candidates", reason: "true relations (Makefile ldflags, VERSION file) but no published channel: operator binaries ship only inside images; po-docgen and po-rule-migration are unpublished repo tooling, and po-lint was deleted upstream (PR #6474)"}
