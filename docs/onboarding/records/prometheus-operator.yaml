# Discovery quality: strong on the in-repo topology — tag scheme with the
# pkg/* junk excluded, the CHANGELOG section selector, the three quay images
# (all historically validated 6/6 by its own checks), bundle.yaml in-tree AND
# as a release asset, advisories — and its one `unverifiable` annotation was
# api.github.com quota exhaustion during its own validation run (transient;
# the anonymous quota recovered minutes later), not a channel problem. What
# it could not see: the ghcr mirror (a second registry in the publish
# workflow), the stripped-down-crds.yaml asset, the operand default pins in
# pkg/operator/defaults.go, the Kubernetes compatibility page, and the whole
# chart join (out-of-repository channels are invisible to the repo scanner).
# Its resolver excluded the CRD directories with crd.not-dedicated ("bundled
# in another manifest") — for this product those directories ARE the CRD
# source — and it proposed bundle twice (in-tree + asset) where one artifact
# with two channels is the shape.
