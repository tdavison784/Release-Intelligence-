notes: >-
  The appVersion join, from this side: kube-prometheus-stack (order 6) pins
  THIS operator in its Chart.yaml appVersion and already models the pin with
  version.strategy: field ('prometheus-operator-image'); this definition
  models the mirror image — a lookup artifact resolving, per operator
  release, the chart whose appVersion == the release tag, verified against
  the prometheus-community index. The cross-product query the join was
  designed for ('which chart versions ship operator X') therefore works
  TODAY, deterministically, in one direction and one product at a time: the
  operator's edge names the chart version ('kube-prometheus-stack 91.8.2
  [verified]' for v0.94.1), and the chart's edge names the operator version
  it pins; nothing yet joins the two edges into one cross-product view, and
  each side probes the other's channel independently (both reached the same
  pairs from their own definitions). The pinned-operator-notes construct that
  may exist on the chart side by merge time does not exist in this worktree's
  products/kube-prometheus-stack.yaml; this record is written against what is
  merged here. Sixth zero-new-construct onboarding (external-secrets, grafana,
  strimzi, otel-collector, redis, kyverno): the operator + pinned-operands +
  out-of-repo-chart-joins topology decomposed into lookup (argo-cd), pattern
  pins (flux), availability windows, optional artifacts (argo-cd) and role
  mixing (kyverno's support-policy). 78 constructs used, 0 new, 0
  product-specific Go, 0 check failures on the first run of both windows, no
  blocked hosts. 25 minutes.
