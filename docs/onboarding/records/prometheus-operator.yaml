unreachableSources: []          # none. api.github.com exhausted its anonymous 60/h quota DURING discovery's validation run (the proposal's release-notes-github is annotated unverifiable for that reason) and recovered minutes later — transient quota, not an outage; every channel the final definition depends on answered without it
ambiguousRelationships:
  - "The GitHub release body duplicates the CHANGELOG section byte for byte (upstream's own release process pastes it); one notes channel, not two."
  - "appVersion joins are prefix-eroded: both charts pinned the operator with an UNPREFIXED appVersion before chart 44.0.0 / 6.0.0 (operator v0.62.0 / v0.68.0); the lookups start there, the earlier era is unprobed (the mirror of kube-prometheus-stack's own 44.0.0 boundary)."
  - "Neither chart covers every operator release: kube-prometheus-stack has no entry for v0.64.x, v0.84.0 or v0.90.0 (v0.90.1/v0.91.0 exist), prometheus-operator-crds skips v0.69.0 — modeled as optional lookups; absence is the chart cadence."
  - "The Kubernetes floor statement was retro-corrected upstream (the v1.25.0-for->=0.84.0 sentence landed 2025-12-18, first tag v0.88.0; the v0.83/v0.84 tags still say v1.16.0): reading the page at each tag reports what was believed true then, which is the honest per-release record."
  - "The default Prometheus is not a YAML scalar but the LAST entry of a Go slice literal; the pattern anchors on the slice's closing brace — one regex era from v0.40.0 to v0.94.1, but a Go-source formatting change would break it (a gofmt reformat that moves the closing brace)."
  - "admission-webhook images start at v0.55.0 although the webhook itself shipped around v0.53: the availability window is the registry's, not the feature's."
  - "quay.io's anonymous /tags/list returns only the 100 oldest tags (pagination ignored): version indexes over these repositories are truncated; per-tag manifest probes — what the checks use — are unaffected."
representability: full          # versions, notes, compat floor, security, images, manifests, CRDs, operand pins and both chart joins are all represented with constructs from orders 1-15
gaps:
  - "The supported-operand MATRIX (all Prometheus/Alertmanager/Thanos versions the e2e suite verifies) is set-valued and lives in a Go slice + a generated page: only the defaults are modeled. An 'operand compatibility' join (edge x environment x operand versions) is the same G6/G7 question kube-prometheus-stack recorded for sub-component CVEs."
  - "The Kubernetes floor is prose, so it surfaces as a migration note item, not a CompatibilityConstraint: impact-side kubernetes-version matching cannot key on it (the validate warning on both compatibility sources says the same)."
  - "No version-to-version upgrade guide exists upstream (in-repo or website): the [CHANGE] bullets and Note callouts are the de facto guidance, and the chart-side steps live in kube-prometheus-stack's UPGRADE.md — reachable only through the join, as a note there."
  - "example/prometheus-operator-crd-full (v1beta1 AlertmanagerConfig, conversion-webhook path) is unmodeled; users on that path see only the -crd snapshot."
  - "The unprefixed-appVersion eras (operator < 0.62.0) and pre-0.55.0 webhook absence are cut off by availability windows rather than represented; the 203 pkg/* module tags are excluded by pattern and not modeled as module artifacts (no consumer)."
  - "Cross-product querying itself: the join is answered per release from this side ('operator v0.94.1 -> chart 91.8.2 [verified]'), but there is no reverse query surface ('which chart versions ship operator >= v0.94') — that is a store/query concern (G6), not a definition concern."
