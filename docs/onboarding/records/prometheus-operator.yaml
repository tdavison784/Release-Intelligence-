    - {subject: compatibility/classify, change: "removed the 'Go client|best effort' and '.*' skip rules", reason: "the prose-only section folds into ONE item; any matching skip rule drops the whole item regardless of earlier category rules — the catch-all killed the K8s requirement statement it was meant to protect"}
