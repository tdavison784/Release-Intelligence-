ambiguousRelationships:
  - "7.x GA notes at their own tags are stubs: the 7.2.0 and 7.4.0 sections contain 1 item at tag time; the full GA notes were backfilled upstream by later patches of the line (the file is cumulative per line). 8.x GAs carry full notes at their tags. A tool reading only the release's own tag under-reports 7.x GA changes."
  - "8.0.0's notes are the 00-RELEASENOTES intro (no per-release section): encoded as a source exception with the GitHub release body as fallback."
  - "through 7.0 the subsections are setext-H1 (same level as release headers), truncating release sections; the source is availability-scoped to >= 7.2.0 and 6.2-7.0 would read through the GitHub fallback only."
  - "redis-full.tar.gz exists only on 8.10.0+ (first release with any assets at all); whether the artifact persists is unknown — availability >= 8.10.0 records today's truth."
  - "docker.io/library/redis 4.0.0 is absent (404 on both channels) while 4.0.14 exists; images are scoped >= 5.0.0 instead of enumerating 4.x holes."
  - "the 'Update urgency:' line of a section never surfaces as a note item (the parser drops section-intro prose); the urgency classify rules are dormant insurance for a heading-less future section."
  - "release names ('Redis 8.10 GA', '8.10-RC2 (v8.9.241)') differ from tags (8.10.0; RCs are untagged internals), so the notes' names must be pattern-matched, not parsed as versions."
representability: full
gaps:
  - "No per-version upgrade guide: redis.io docs install/upgrade pages are version-generic procedures; per-release upgrade intelligence lives only in the GA notes ('Major changes compared to X.Y', license change). No upgrade-guide source is declared."
  - "Module ecosystem compatibility is not machine-readable: REDISMODULE_APIVER_1 stays 1 while the API grows; a module's required server version lives in the third-party module. The compatibility role stays empty (nothing Kubernetes-style exists to declare)."
  - "Official packaging (snap/brew/RPM/APT via redis/redis-snap, homebrew-redis, redis-rpm, redis-debian) is unmodelled: per-distro revisions and channels, same as postgresql's PGDG gap. The Bitnami Helm chart is third-party (explicit non-goal)."
  - "Historical SA-xxxxxx security bulletins are website posts; only the GitHub advisory feed is machine-readable (CVEs also appear inline in the release notes)."
  - "Support-window/EOL dates are carried as declared lifecycle text citing version-mgmt.md, not as ingested data; a query 'is X.Y still supported on date D' needs the table parsed (out of model)."
sampleEdge:
  from: 7.4.11
  to: 8.0.0
  summary: "0 breaking · 18 action required · 32 changes · 45 warnings"
  evidenceRecords: 53
  notes: >-
    The dual-live-major edge: from the extended 7.4 line straight across to
    the 8.x major (path: 8.0.0). 32 changes = 16 security (15 GitHub
    advisories matched as still-affecting the target plus the declared
    CVE-2025-21605 fix), 3 migration ("Supported upgrade paths" bullets of
    the 8.0.0 body), 7 features, 5 bug fixes; the 18 action-required items
    are the advisory matches and the target-line deprecation warning (8.0 is
    a standard line, last release 8.0.6, EOL 2026-12-01) cites version-mgmt.md
    lines. Reading critically: several "still affects target" matches are
    conservative false positives — GitHub advisory patched-lists name the
    lines released at publication time (e.g. CVE-2024-31228 patched
    6.2.16/7.2.6/7.4.1), so 8.0.0, cut later with those fixes, is not
    listed and reads as affected; the data is shown verbatim (severity +
    patched versions) precisely so a human can make that call. Patch edge
    8.10.1 -> 8.10.2: 0 breaking · 0 action required · 5 changes · 1 warning
    (5 security fixes, every item line-cited in 00-RELEASENOTES), 33
    evidence records.
notes: >-
  Third wave-2 zero-new-construct product (grafana, strimzi): the whole
  non-Kubernetes topology — in-repo per-line release notes, GitHub advisory
  feed, download.redis.io tarballs, Docker official image with a mirror
  fallback, EOL-dated lifecycle statements — is configuration over existing
  constructs. The one generic change (setext headings) completes CommonMark
  in the shared markdown scanner rather than adding definition vocabulary;
  it benefits any product whose upstream documents underline titles (no
  catalog field, schema entry or ingest branch was added). Discovery
  baseline: right versioning and channels-from-tags, zero artifacts, and it
  mistook the website notes copy for the source; its own historical
  validation of the GitHub release body was correct and kept.
