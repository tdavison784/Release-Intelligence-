constructs:
  new: []                       # confirmed empty against `ri stats redis -o json` (unaccountedConstructs)
  considered:
    - "artifact type source-release for redis-full.tar.gz: rejected — source-release channels may only be github-releases/git-tags, which probe the release, not a named asset (every release >= 6.2 has a GitHub release, so the relationship would falsely pass); http asset URL as type package (postgresql's tarball precedent) states it exactly"
    - "compatibility source from src/redismodule.h MODULE_API_VERSION: rejected — REDISMODULE_APIVER_1 is 1 at 7.2.11, 7.4.11 and 8.10.2 alike; the API surface grows without a per-release version number, so there is no machine-readable constraint to declare (gap)"
    - "markdown-table source over the version-mgmt.md support table: rejected as a source — it is support status, not platform compatibility; modelled as lifecycle statements citing the page (karpenter's SUPPORT.md precedent)"
    - "a support-window/lifecycle-table source role: rejected — lifecycle statements + a cited evidence source already express it (ingress-nginx/karpenter constructs)"
    - "extract format for setext: rejected — setext headings are core CommonMark, not another format; fixed in the shared markdown scanner, so every existing construct (markdown-section, whole, classify sections) works unchanged and no definition vocabulary was added"
goChanges:
  productSpecific: 0
  generic:
    - {file: internal/normalize/scan.go, purpose: "setext heading recognition (CommonMark): a paragraph closed by an '='/'-' underline becomes a heading (level 1/2), decorative bar lines above the title are dropped from the heading text, fences/front matter never participate; a '-' underline directly after a paragraph wins over its thematic-break reading"}
    - {file: internal/normalize/setext_test.go, purpose: "tests: scanner classification, section selection over setext documents (Redis GA shapes incl. the no-prefix '8.2 GA (v8.2.0)'), fence immunity, thematic-break/table non-interference"}
