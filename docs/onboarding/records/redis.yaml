  # First complete draft (correct tag pattern, repo-file notes with a heading
  # regex, docker + tarball artifacts): release-notes failed 6/6 — twice over:
  # the shared markdown scanner did not recognise setext headings at all
  # (fixed generically, see goChanges), and the first heading regex nested its
  # optional prefix groups so "Redis " alone could never match. After both
  # fixes every subject passes.
  initialFailures: 1
  finalFailures: 0
  manualInterventions:
    - {subject: release-notes, change: "generic setext-heading support in the markdown scanner (internal/normalize/scan.go)", reason: "Redis's per-release sections are 'Title / ====' setext H1s; the scanner only knew ATX '#', so no section was ever found"}
    - {subject: release-notes, change: "heading regex: optional groups unnested — ^(?:Redis )?(?:Open Source |Community Edition )?X.Y.Z...", reason: "the first draft's (?:Redis (?:Open Source |Community Edition ))? made 'Redis ' unmatchable without a qualifier; 8.2 GA headings also drop the 'Redis' prefix entirely"}
    - {subject: release-notes, change: "availability >= 5.0.0 -> >= 7.2.0", reason: "through 7.0 the subsections are underlined with ==== at the same H1 level as the release headers, so a release section truncates at its first subsection"}
    - {subject: release-notes-github, change: "classify rules shared with the repository source via a YAML anchor (skip OS/binary-distribution matrices, migration for 'Supported upgrade paths')", reason: "the 7.4.11 -> 8.0.0 edge fell back to the release body for 8.0.0, whose 'Operating systems we test' and 'Binary distributions' bullets surfaced as 11 'other' changes"}
