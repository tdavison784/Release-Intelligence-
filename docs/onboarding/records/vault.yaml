ambiguousRelationships:
  - "chart appVersion == Vault version means 'the default Vault in that chart', not 'compatible with'; the chart CHANGELOG lists several tested Vault versions (v2.0.4, v1.21.9, v1.20.14, v1.19.20) that appVersion does not carry"
  - "only 7 of 32 sampled releases are an appVersion of any chart (no chart for 2.1.0 or 2.1.1); chart is optional"
  - "changelog and docs are read at ref main: their content evolves after a release (the 2.x important-changes page was modified on 2026-08-25 and says 'Last updated 2026-05-21'), so an edge reflects today's text, not the text at release time"
  - "2.x docs live in one v2.x directory for every 2.y line, so a cumulative page cannot be keyed by release; only the major gets it"
  - "ri check passes on a section that yields zero note items (1.17.5, 1.18.0): relationship 'resolves' is weaker than 'has content'"
  - "rpm is declared for RHEL 9 x86_64 only; other distributions and arches exist and share the version"
  - "Enterprise zips also exist as +ent.hsm, +ent.fips1402, +ent.fips1403: not modelled"
representability: partial
gaps:
  - "License change (MPL-2.0 until 1.14.8, BUSL-1.1 from 1.14.9; 2.1.0 client licensing terms) is a release-level fact that no source or snapshot kind can carry; only a changelog line starting 'License:' is flagged (action required). The BUSL switch itself is announced nowhere in the changelog (needs a license snapshot diff; Redis, Elasticsearch, Grafana, Terraform have the same lifecycle event)"
  - "Enterprise-only releases (1.21.5+ent ... 1.21.11+ent, 1.19.6+ent ..., 4 +ent tags in the OSS repo) can only be enumerated from releases.hashicorp.com/vault/index.json, for which no versions locator exists; their changelog sections ('## 1.21.11 Enterprise') are unreachable and the Enterprise LTS line 1.21.x is invisible after 1.21.4"
  - "MDX '@include' partials are not resolved: in the 2.x important-changes page 4 of 7 breaking items and 12 of 14 known issues live in content/vault/global/partials and are missing from the edge (breaking items still appear through the changelog BREAKING CHANGES label)"
  - "Cumulative docs with per-item 'Affected version' / 'Fixed version' table cells cannot be filtered by the release being upgraded to; important-changes-v2 is therefore restricted to major releases and 2.1.x upgrades carry no doc-derived items"
  - "Kubernetes support is a bullet list partial (kubernetes-supported-versions.mdx), not a table; only the chart kubeVersion floor (>= 1.20) reaches the compatibility section, and only for releases that ship a chart"
  - "Support lifecycle (LTS 1.19.x, extended maintenance 1.16.x, EOL dates) is prose/tables with no constraint model; support policy page unreachable"
  - "Two changelog sections (1.17.5, 1.18.0) have their date as a second H2 and are unreachable by a heading selector: no notes for those releases (exceptions)"
  - "HCSEC bulletin ids are not extracted as references (only CVE/GHSA/GO ids); the bulletin channel (discuss.hashicorp.com) and GitHub advisories are unreachable here"
  - "Companion components with independent versions (vault-k8s 1.7.x, vault-csi-provider 1.7.x, Vault Secrets Operator, Vault Agent images) appear only as helm-values default changes, not as related products"
  - "Docs release notes (updates/release-notes.mdx) and deprecation page were not added: their 'Bug fixes and security patches' group would classify every fix as security and they duplicate the changelog"
sampleEdge:
  from: 1.21.4
  to: 2.1.1
  summary: "4 breaking · 9 action required · 314 changes · 2 warnings"
  evidenceRecords: 368
notes: >-
  Cross-major edge: path 2.0.0 -> 2.1.0 -> 2.1.1 (4 backport releases skipped).
  314 changes: 255 declared (SECURITY/BUG FIXES/FEATURES/BREAKING CHANGES labels,
  docs headings) and 59 heuristic. Discovery (deterministic, no LLM) found only
  the tag scheme and the default advisory feed and mistook the shared docs
  repository for other HashiCorp products; useful improvements: scope docs
  paths to the product directory (content/vault/), read changelogs on the
  default branch as well as at tags, detect chart repositories named
  <product>-helm. Two edges were also exercised: 2.0.3 -> 2.0.4 (BREAKING
  CHANGES paragraph now flagged breaking + action required) and 1.17.6 ->
  1.18.0 (upgrade-to-1.18.x guide). Elapsed time is agent wall-clock and
  excludes this record.
