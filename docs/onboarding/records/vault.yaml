constructs:
  new:
    - name: extract.labelParagraphs
      kind: extract option (markdown-section, whole) + DocInput.LabelPattern in normalize
      justification: >-
        HashiCorp-family changelogs group bullets under uppercase label
        paragraphs (SECURITY:, BUG FIXES:, BREAKING CHANGES:, ...) that are not
        markdown headings. Without the option every bullet loses its category
        (ri upgrade 2.0.3 -> 2.0.4 before: 0 bug fixes, 0 features, 2
        security items, 54 other, nothing breaking; after: 29 bug fixes, 20
        features, 5 security, 1 breaking). A matching standalone paragraph is
        promoted to a heading one level below the last real heading, so the
        existing section classification (declared, high confidence) applies
        unchanged and product rules can match the label via `section:`.
      otherProducts: [terraform-aws-provider (wave 3, ENHANCEMENTS:/BUG FIXES:/NOTES:), terraform core, consul, nomad, packer, boundary]
  considered:
    - {name: "include resolution for MDX '@include' partials (extract.includeBase)", rejected: "needs a second fetch per include, evidence line mapping and a docs-platform path convention; consumers named (Consul, Nomad, Boundary docs) are not in the onboarding plan. Recorded as a gap (measured: 4 of 7 breaking items and 12 of 14 known issues of the 2.x important-changes page are includes)"}
    - {name: "section end option for markdown-section (stop at the next heading matching a regex)", rejected: "only 2 of 135 changelog sections (1.17.5, 1.18.0) need it; represented as exceptions with a reason"}
    - {name: "per-item version applicability filter for cumulative docs ('Affected version' table cell)", rejected: "only Vault documents it this way; important-changes-v2 is limited to major releases instead"}
    - {name: "license snapshot / lifecycle fact diffed between releases", rejected: "needs a new domain snapshot kind, upgrade diff and schema changes in packages other agents are changing; strong case (Redis, Elasticsearch, Grafana, Terraform and Vault all relicensed) so recorded as the top gap"}
    - {name: "versions locator over a JSON release index (releases.hashicorp.com/vault/index.json)", rejected: "git tags are authoritative for the community train; only needed to enumerate Enterprise-only releases, i.e. a separate vault-enterprise product"}
    - {name: "conditional templates ({{if ge .Major 2}}) for the v2.x docs directory", rejected: "availability-split sources are clearer and already supported"}
goChanges:
  productSpecific: 0
  generic:
    - {file: internal/normalize/labels.go, purpose: "promoteLabels: label paragraphs become headings one level below the last real heading (not inside code, indented text or wrapped paragraphs)"}
    - {file: internal/normalize/api.go, purpose: "DocInput.LabelPattern"}
    - {file: internal/normalize/notes.go, purpose: "compile LabelPattern and promote labels before splitting a document into items"}
    - {file: internal/normalize/scan.go, purpose: "docLine.label flag; MDX @include lines are not prose; headings are normalised through stripMDXHeadingNoise"}
    - {file: internal/normalize/mdx.go, purpose: "MDX dialect of the HashiCorp docs platform: @include directive lines, '((#anchor))' and JSX components in headings (without it a section holding one @include line folded all its sub-sections into one item)"}
    - {file: internal/catalog/definition.go, purpose: "Extract.LabelParagraphs"}
    - {file: internal/catalog/validate.go, purpose: "labelParagraphs must compile and only applies to whole / markdown-section extracts"}
    - {file: schemas/product-definition.schema.json, purpose: "extract.labelParagraphs"}
    - {file: internal/ingest/docs.go, purpose: "pass extract.labelParagraphs to the notes parser"}
    - {file: "internal/normalize/labels_test.go, internal/normalize/mdx_test.go, internal/catalog/labels_test.go, internal/ingest/labels_test.go", purpose: "unit tests for the above"}
