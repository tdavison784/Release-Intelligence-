constructs:
  new:
    - name: "format:rst"
      kind: extraction-format
      justification: >-
        Cilium's upgrade intelligence (Action Required / Changed / Deprecated /
        Removed Options, Removed CRD Fields) exists only as reStructuredText
        (Documentation/operations/upgrade.rst before 1.20, upgrade-current.inc
        from 1.20 on; the README is .rst too), and its compatibility matrix is
        an rst grid table: markdown selectors see neither the underline
        headings nor the table. normalize.RSTToMarkdown renders rst as
        line-preserving markdown (headings by rst first-use adornment
        hierarchy, overline+underline titles included; ``literal``,
        :role:`text` and `Title <target>`_ flattened; explicit-markup lines
        blanked; grid tables -> pipe tables, header + separator on the
        original lines), after which markdown-section, markdown-table, whole
        and the classify rules work unchanged. Converted structural markup is
        parsed in list-item mode like DocBook (every bullet one item, prose
        intros their own items), which is what keeps a 30-bullet "Removed
        Options" section 30 items instead of one. Only the extract types
        whole, markdown-section and markdown-table.
      otherProducts:
        - "Python (Misc/NEWS.d per-version notes and upgrade docs are rst)"
        - "OpenStack components (release notes and docs are rst)"
        - "towncrier changelogs (CHANGELOG.rst: Airflow, Superset, and most of the Python packaging ecosystem)"
        - "none of the other planned wave 1-3 products is rst (Strimzi/Elasticsearch are AsciiDoc): justified by well-known products, not by the plan; the 'format' slot was created for exactly this by the docbook construct"
  considered:
    - "quay.io-only image publication (a construct to verify quay-hosted images another way): NOT needed — quay.io answers 200 from this sandbox AND docker.io/cilium/* mirrors track every release tag (verified v1.9.10-v1.20.2), so the normal oci channels verify directly"
    - "simple rst tables (=== aligned columns, Cilium's compatibility-table.rst): not converted; the only content that needs them is the Cilium-version -> CNP CRD schema-version mapping, for which the model has no compatibility slot anyway (recorded as a gap)"
    - "a second upgrade-guide source for the special patch-level notes ('1.17.4 Upgrade Notes', '1.14.2', '1.11.15/16+/18+', '1.9.1'): would need exceptions for every non-notable patch of every line to pass checks; recorded as a gap instead"
    - "artifacts with version.strategy independent for the companion images (cilium-envoy, certgen, hubble-ui, hubble-ui-backend, ztunnel, startup-script): unresolvable per release -> permanently unverifiable; their version changes are already reported by the chart values diff (e.g. ztunnel v1.0.0 / repository docker.io/istio/ztunnel -> quay.io/cilium/ztunnel in the sample edge)"
    - "operator-generic as a seventh image artifact: quay keeps publishing it with release tags, but the chart default has been plain 'operator' since at least 1.11 (operator.image.suffix ''); left out to avoid a duplicate of operator-image"
    - "k8s version sources from .github/actions/{aks,eks,gke}/k8s-versions.yaml (per-branch CI test matrices): internal test configuration, not a support statement; compatibility.rst is the published matrix"
