ambiguousRelationships:
  - "quay.io and helm.cilium.io are listed as blocked by egress policy in docs/phase2/PLAN.md, but answered 200 throughout this onboarding (as did codeload, which postgresql/ingress-nginx recorded as 403): the standing host list is stale, definitions must verify, not assume"
  - "the GitHub Release body is the CHANGELOG.md section verbatim, so the release-notes fallback group can never add information the changelog lacks; it exists for the pre-1.8 releases only"
  - "the chart's compatibility.rst lists e2e-TESTED k8s versions per line (kind tested) while Chart.yaml kubeVersion is the minimum (>= 1.21.0-0 since 1.16); Cilium publishes no maximum/supported-k8s statement, so 'tested' is the strongest upstream signal"
  - "a few lines carry extra patch-level upgrade-note sections (1.9.1, 1.11.15/16+/18+, 1.14.2, 1.17.4 — kernel regressions, an IPsec CVE, a map-in-map regression) in addition to the line's 'X.Y Upgrade Notes'; the single-section selector reads the line notes only"
  - "three published GHSAs have no machine-readable affected-version range; the edge reports them as warnings to check manually"
representability: full
gaps:
  - "patch-level upgrade notes (see ambiguousRelationships): a release's upgrade guidance may have a second section the definition cannot select without per-patch exceptions"
  - "Cilium-version -> CNP CRD schema version (compatibility-table.rst, simple rst table): no compatibility slot for CRD-schema versions and no simple-table conversion"
  - "independently versioned companion images are not artifacts (see constructs.considered); their upgrades are visible only as values diffs"
  - "no support-window model: Cilium maintains roughly the last four minor lines, but nothing machine-readable states which lines are still maintained"
  - "rst converter scope: grid tables convert their first logical row block exactly (the shape of compatibility matrices); rows after a mid-table border and simple (===-aligned) tables are not converted"
