notes: >-
  First product whose first complete draft passed every relationship check
  (20/20 releases across lines 1.11-1.20, 0 unverifiable): discovery's
  proposals were correct where it looked, and every canonical host was
  reachable, so onboarding was configuration plus one generic construct
  (format:rst) for the rst upgrade notes and compatibility grid. The rst
  converter parallels the docbook one and completes the second non-markdown
  format the 'format' slot was created for. Classification quality: the
  changelog's bold labels map 1:1 to categories (Bugfixes: -> bugfix etc.);
  the upgrade notes' subsections carry the semantics (Removed Options ->
  breaking removals, Action Required -> action required), and the two noise
  sources (release-bot digest bullets, CI/Misc churn) are two skip rules.
  The three tuning iterations were all found by reading the edge output, not
  by failing checks.
