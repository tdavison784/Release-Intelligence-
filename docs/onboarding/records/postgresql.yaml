ambiguousRelationships:
  - "17.2 is semver 17.0.2 inside the model (ReleaseNote/Change 'release' fields, JSON, evidence) but the text output and `ri upgrade` accept only the tag (REL_17_2) or the semver (17.0.2), not the published '17.2'. Users type 17.2: version display and lookup of two-part versions is a gap."
  - "the minor-release notes say 'see 17.6' for earlier versions (xref linkend release-17-6); the converter renders the link id, it is not resolved to a release."
  - "18.5 was never released (tags, notes and Docker Hub agree): `PrevTag` of 18.6 is 18.4; nothing breaks, but a tool looking for 'the next patch' must not assume contiguity."
  - "Docker tags of EOL lines: 10.22, 10.23, 11.19-11.22 default tags removed, 9.6.x kept: encoded as curated exceptions; whether more EOL tags vanish later is unknown."
  - "evidence excerpts are the markdown rendering of the SGML lines (locators are original line numbers, digest is of the original bytes): the excerpt is not byte-verbatim."
  - "source tarball modelled as artifact type 'package': there is no source-archive type (source-release only allows git-tags/github-releases channels)."
representability: partial
gaps:
  - "Support lifecycle (five-year policy, EOL dates per major) cannot be represented at all: the model has no support-window concept and the only authoritative page (postgresql.org/support/versioning) is blocked. Dates are visible only indirectly (last minor of each line in the notes). Matters for 'is my version still supported' questions."
  - "Compatibility matrix: nothing machine-readable (pg_upgrade 'supports upgrades from 9.2.X and later' is prose; docker-library versions.json base-OS data is keyed by major and not a list). The compatibility role stays empty."
  - "Security: the canonical CVE pages are blocked and no adapter reads http security sources; CVEs come from the release notes only (they are complete there: every CVE of a minor is cited in its Changes list)."
  - "Releases before 8.0: two-part first-release tags (REL7_4) cannot be told from the post-10 scheme by one pattern; version listing starts at 8.0."
  - "Distribution packages (PGDG apt/yum, version = upstream + packaging revision) and Windows/macOS installers are not modelled."
  - "Version display/lookup for two-part versions (see ambiguousRelationships)."
sampleEdge:
  from: REL_17_11
  to: REL_18_6
  summary: "11 breaking · 5 action required · 575 changes · 1 warning"
  evidenceRecords: 713
  notes: "Path REL_18_0 -> 18_1 -> 18_2 -> 18_3 -> 18_4 -> 18_6 (minor-lineage). Breaking = exactly the 11 <listitem>s of 'Migration to Version 18'; action required = the dump/restore requirement and the 18.2/18.6 REINDEX hints; 51 security items, every one citing a CVE; 300 bug fixes. Patch-only edge REL_17_9 -> REL_17_11: 0 breaking, 2 migration, 41 security, 126 bug fixes."
notes: "Representable only after two small generic constructs; the rest of the topology (versions, per-release notes, upgrade guidance, CVEs, Docker image) is plain configuration. Classification quality is good because the notes are structured (one listitem per change, Migration section = incompatibilities): breaking counts match the document exactly. Sample-edge reading: 'Deprecate MD5 ...' needed a product rule (verb not in the builtin heuristics); 'Remove ... configure options' and 'Require ...' are flagged action required by the generic 'required' keyword (low value). Environment: Docker Hub rate limiting (429) made the first check run mark both images unverifiable, the mirror.gcr.io channel removed that flakiness."
