# Trimmed copy of an installed CRD, as `helm get manifest` or a GitOps
# repository would hold it (schema dropped for brevity; the impact join only
# needs group/kind/versions here).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Certificate
    plural: certificates
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
