# Trimmed copy of the installed cert-manager CRD set, as a GitOps repository
# would hold it (schema dropped; the environment model only needs
# group/kind/versions).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Certificate
    plural: certificates
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
