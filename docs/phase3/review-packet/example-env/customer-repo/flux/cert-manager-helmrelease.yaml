# The Flux HelmRelease for cert-manager: chart identity, a version RANGE as
# the pin, spec.values as the customer's values — and a valuesFrom reference
# to a cluster object that no file can answer for (a warning).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    replicaCount: 2
    global:
      leaderElection:
        namespace: cert-manager
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-values
