[workspace]
provider = "claude"

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
option_defaults = { model = "haiku", effort = "low" }
env = { SHELL = "/bin/bash", CLAUDE_CODE_FORCE_SESSION_PERSISTENCE = "1" }   # agents' Bash tool must not inherit the zsh `gc` alias

# [mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
# It also sets how long a read mail bead stays open before the nudge-mail
# sweep closes it: unset keeps that sweep's own 60m default, while "0"
# disables the close phase too, leaving read mail beads open.
# retention_ttl = "0"

[[rigs]]
name = "toy"
prefix = "tw"
default_branch = "main"

# --- fleetpilot toy fleet ---
[session]
provider = "herdr"          # city name "fpilot" => separate herdr session "fpilot"

[daemon]
patrol_interval = "15s"
max_restarts = 3
