name: Promote
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote Images to GitHub Container Registry
        run: nix run .#promote-images -- ghcr.io/example/promoter/promoter "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
