# The container registry used for all images.
imageRegistry: quay.io
# The namespace of the images.
imageNamespace: examplecorp

image:
  # The image name, appended to imageRegistry/imageNamespace.
  name: certmgr-controller
  repository: ""
  # Defaults to the chart appVersion.
  tag: ""

webhook:
  image:
    name: certmgr-webhook
    repository: ""
