version: 2
project_name: deployer
builds:
  - id: deployer-cli
    main: ./cmd
    binary: deployer-{{ .Os}}-{{ .Arch}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - id: deployer-archive
    ids:
      - deployer-cli
    name_template: |-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}
    formats: [binary]
checksum:
  name_template: 'cli_checksums.txt'
  algorithm: sha256
release:
  prerelease: auto
  draft: false
  header: |
    ## Quick Start

    ```shell
    kubectl apply -n deployer -f https://raw.githubusercontent.com/{{ .Env.GORELEASER_CURRENT_REPOSITORY }}/{{.Tag}}/manifests/install.yaml
    ```
changelog:
  use: github
  sort: asc
  groups:
    - title: 'Breaking Changes'
      regexp: '^.*?!:.+$'
      order: 0
    - title: 'Features'
      regexp: '^.*?feat.+$'
      order: 100
    - title: 'Bug fixes'
      regexp: '^.*?fix.+$'
      order: 200
