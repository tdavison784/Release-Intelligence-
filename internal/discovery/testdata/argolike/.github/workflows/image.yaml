name: Image
on:
  push:
    branches:
      - master
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          TAG="$(cat ./VERSION)-${GITHUB_SHA::8}"
          echo "ghcr_image_name=ghcr.io/example/deployer/deployer:$TAG" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
