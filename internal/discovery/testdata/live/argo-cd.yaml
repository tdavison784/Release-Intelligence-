apiVersion: ri.dev/v1alpha1
kind: ProductDefinition
id: argo-cd
name: argo-cd
homepage: https://github.com/argoproj/argo-cd
versioning:
  scheme: semver
  tagPrefix: v
  tagPattern: ^v(?P<version>\d+\.\d+\.\d+(?:-(?:rc\d+))?)$
  lineage: minor
sources:
  - id: tags
    roles:
      - versions
    locator:
      kind: git-tags
      repository: github.com/argoproj/argo-cd
      tagPattern: ^v(?P<version>\d+\.\d+\.\d+(?:-(?:rc\d+))?)$
  - id: github-releases
    roles:
      - versions
    locator:
      kind: github-releases
      repository: argoproj/argo-cd
    priority: 1
    fallback: true
  - id: release-notes
    roles:
      - release-notes
    locator:
      kind: github-releases
      repository: argoproj/argo-cd
      ref: '{{.Tag}}'
    extract:
      type: whole
    notes: 'GitHub release body generated by goreleaser (groups: Breaking Changes; Features; Bug fixes; Documentation; Dependency updates; Other work)'
  - id: upgrade-guide
    roles:
      - upgrade-guide
    locator:
      kind: repo-file
      repository: github.com/argoproj/argo-cd
      path: docs/operator-manual/upgrading/{{.PrevMajor}}.{{.PrevMinor}}-{{.Major}}.{{.Minor}}.md
    releaseKinds:
      - minor
      - major
  - id: compatibility
    roles:
      - compatibility
    locator:
      kind: repo-file
      repository: github.com/argoproj/argo-cd
      path: docs/operator-manual/tested-kubernetes-versions.md
    extract:
      type: markdown-table
      keyColumns:
        - Argo CD version
      keyMatch: ^v?{{regexQuote .Line}}\b
      columns:
        - platform: kubernetes
          kind: tested
          headers:
            - Kubernetes versions
  - id: advisories
    roles:
      - security
    locator:
      kind: github-advisories
      repository: argoproj/argo-cd
    notes: 'Security policy: SECURITY.md → https://github.com/argoproj/argo-cd/security/advisories https://github.com/argoproj/argo-cd/security/advisories/new'
artifacts:
  - id: argo-cd-chart
    type: helm-chart
    name: argo-cd
    version:
      strategy: lookup
      field: appVersion
      match: '{{.Tag}}'
      select: latest
    channels:
      - kind: helm-repo
        url: https://argoproj.github.io/argo-helm
        chart: argo-cd
      - kind: helm-git
        repository: github.com/argoproj/argo-helm
        path: charts/argo-cd
        tagPattern: ^argo-cd-(?P<version>\d+\.\d+\.\d+)$
    notes: Chart maintained in github.com/argoproj/argo-helm with its own version; chart releases are found by appVersion. 790 of 1385 chart-repository tags match ^argo-cd-(?P<version>\d+\.\d+\.\d+)$.
  - id: manifests-install
    type: manifest
    name: install.yaml
    description: Install manifest (also bundles the CRDs).
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: repo-file
        repository: github.com/argoproj/argo-cd
        path: manifests/install.yaml
    contents:
      - kind: image-refs
  - id: manifests-ha-install
    type: manifest
    name: install.yaml
    description: Install manifest (also bundles the CRDs).
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: repo-file
        repository: github.com/argoproj/argo-cd
        path: manifests/ha/install.yaml
    contents:
      - kind: image-refs
  - id: manifests-core-install
    type: manifest
    name: core-install.yaml
    description: Install manifest (also bundles the CRDs).
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: repo-file
        repository: github.com/argoproj/argo-cd
        path: manifests/core-install.yaml
    contents:
      - kind: image-refs
  - id: manifests-install-with-hydrator
    type: manifest
    name: install-with-hydrator.yaml
    description: Install manifest (also bundles the CRDs).
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: repo-file
        repository: github.com/argoproj/argo-cd
        path: manifests/install-with-hydrator.yaml
    contents:
      - kind: image-refs
  - id: argocd-binary
    type: binary
    name: argocd
    description: 'Platform builds: argocd-linux-amd64, argocd-linux-arm64, argocd-linux-ppc64le, argocd-linux-s390x, argocd-darwin-amd64, argocd-darwin-arm64, argocd-windows-amd64.exe'
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: http
        url: https://github.com/argoproj/argo-cd/releases/download/{{.Tag}}/argocd-linux-amd64
  - id: crds
    type: crd
    name: CustomResourceDefinitions
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: repo-dir
        repository: github.com/argoproj/argo-cd
        path: manifests/crds
        glob: '*-crd.yaml'
    contents:
      - kind: crds
  - id: argocd
    type: container-image
    name: argocd
    version:
      strategy: template
      template: '{{.Tag}}'
    channels:
      - kind: oci
        repository: quay.io/argoproj/argocd
    references:
      - artifact: manifests-core-install
        pattern: quay.io/argoproj/argocd:{{.Tag}}
      - artifact: manifests-ha-install
        pattern: quay.io/argoproj/argocd:{{.Tag}}
      - artifact: manifests-install
        pattern: quay.io/argoproj/argocd:{{.Tag}}
      - artifact: manifests-install-with-hydrator
        pattern: quay.io/argoproj/argocd:{{.Tag}}
provenance:
  method: discovery
  author: discovery.resolve@v1
  updated: "2026-10-01"
  notes: Proposed by automated discovery; NOT validated against releases (no relationship checker configured). Review before use.
