# docker.yaml describes each image built by the repository.
example:
- name: helloworld # Will end up pushed to <HUB>/helloworld:<TAG>
  dockerfile: samples/helloworld/Dockerfile

images:
- name: base
  dockerfile: docker/Dockerfile.base
  base: true
- name: proxy
  dockerfile: proxy/docker/Dockerfile.proxy
- name: meshd
  dockerfile: meshd/docker/Dockerfile.meshd
- name: app
  dockerfile: pkg/test/echo/docker/Dockerfile.app
