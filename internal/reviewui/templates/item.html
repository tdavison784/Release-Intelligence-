{{template "top" .Item.ID}}
<header class="bar sticky">
  <div class="bar-row">
    <a class="brand" href="/">Release Intelligence <span>review</span></a>
    <div class="spacer"></div>
    <button class="btn ghost" type="button" id="theme" aria-label="Toggle light/dark theme">◐</button>
    <button class="btn ghost" type="button" id="helpbtn" aria-label="Keyboard shortcuts">?</button>
  </div>
</header>
<main class="page item-page" data-id="{{.Item.ID}}">
  <p><a class="back" href="{{.Return}}">← Inbox</a></p>
  {{template "flashes" .Flashes}}
  {{template "detail" .}}
</main>
{{template "bottom"}}
