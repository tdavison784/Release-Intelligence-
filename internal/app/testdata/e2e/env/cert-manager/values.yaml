# Example customer values for cert-manager, for the `ri impact` e2e fixture.
# The keys are chosen against the recorded v1.17.0 -> v1.18.0 edge:
#   prometheus.servicemonitor.targetPort  default changed (9402 -> "http-metrics")
#   global.rbac.disableHTTPChallengesRole new value in v1.18.0
prometheus:
  servicemonitor:
    enabled: true
    targetPort: 9402
global:
  rbac:
    disableHTTPChallengesRole: true
replicaCount: 3
