apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-background
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  {{- with .Values.rbac.extraResources }}
  - apiGroups: [""]
    resources: {{ toJson . }}
    verbs: [get, list, watch, create, update]
  {{- end }}
