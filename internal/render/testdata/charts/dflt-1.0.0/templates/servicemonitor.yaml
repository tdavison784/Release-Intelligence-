{{- if .Values.exporter.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-exporter
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-exporter
  endpoints:
    - port: metrics
      {{- with .Values.exporter.serviceMonitor.bearerTokenFile }}
      bearerTokenFile: {{ . }}
      {{- end }}
      {{- with .Values.exporter.legacyNote }}
      relabelings:
        - targetLabel: note
          replacement: {{ . }}
      {{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-kubelet
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: kubelet
  endpoints:
    - port: https-metrics
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
{{- end }}
