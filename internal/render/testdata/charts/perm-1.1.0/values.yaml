# kyverno-style: secrets dropped from the default extra resources
rbac:
  extraResources: [configmaps]
cleanup:
  image:
    repository: example.org/tools/kubectl
    tag: "1.29.0"
# a documentation URL no template reads: its default change renders nothing
docs:
  url: https://example.org/docs/v2
# NEW: the replacement view RoleBinding, shipped enabled
viewRoleBinding:
  create: true
# NEW: the component label, whose value the source template already hard-coded
componentLabel: background
replicas: 1
