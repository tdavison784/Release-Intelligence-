apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: demo
  ports:
    - name: http-metrics
      port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.port }}
    - name: https
      port: 443
      targetPort: 10250
