{{- if .Values.exporter.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-exporter
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-exporter
  endpoints:
    - port: metrics
      authorization:
        credentials:
          name: {{ .Release.Name }}-token
          key: token
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-kubelet
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: kubelet
  endpoints:
    - port: https-metrics
      authorization:
        credentials:
          name: {{ .Release.Name }}-token
          key: token
{{- end }}
