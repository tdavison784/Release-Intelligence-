apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-controller
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      containers:
        - name: controller
          image: example.org/demo/controller:latest
          args: ["--v=2"]
