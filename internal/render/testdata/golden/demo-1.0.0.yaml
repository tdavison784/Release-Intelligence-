# Source: demo/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-controller
  namespace: demo
  labels:
    helm.sh/chart: demo-1.0.0
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "v1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
      annotations:
        checksum/config: 56e662b5940bc8ca8961c563c8bbfab963b5125d08acaf590f6540f2ec0b64ae
    spec:
      serviceAccountName: demo
      containers:
        - name: controller
          image: "example.org/demo/controller:v1.0.0"
          args:
            - --v=2
            - --leader-election-namespace=kube-system
            - --enable-certificate-owner-ref=false
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http-metrics
              containerPort: 9402
