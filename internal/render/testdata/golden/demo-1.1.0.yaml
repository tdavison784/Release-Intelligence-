---
# Source: demo/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-controller
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo
  policyTypes: ["Ingress"]
---
# Source: demo/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-controller
  namespace: demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
---
# Source: demo/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo
  namespace: demo
---
# Source: demo/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: demo-token
  namespace: demo
type: Opaque
data:
  token: "d3RpOGdUZWFVOHFxZEVuMm5WdElXbDND"
---
# Source: demo/templates/featurex.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-feature-x
  namespace: demo
data:
  enabled: "true"
---
# Source: demo/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-controller
  labels:
    helm.sh/chart: demo-1.1.0
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "v1.1.0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["demo.example.org"]
    resources: ["widgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["patch", "create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create"]
---
# Source: demo/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
  labels:
    helm.sh/chart: demo-1.1.0
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "v1.1.0"
spec:
  selector:
    app.kubernetes.io/name: demo
  ports:
    - name: http-metrics
      port: 9402
      targetPort: 9402
    - name: https
      port: 443
      targetPort: 10250
---
# Source: demo/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-controller
  namespace: demo
  labels:
    helm.sh/chart: demo-1.1.0
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "v1.1.0"
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
    spec:
      serviceAccountName: demo
      containers:
        - name: controller
          image: "example.org/demo/controller:v1.1.0"
          args:
            - --v=2
            - --leader-election-namespace=demo-system
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOMAXPROCS
              value: "2"
          ports:
            - name: http-metrics
              containerPort: 9402
