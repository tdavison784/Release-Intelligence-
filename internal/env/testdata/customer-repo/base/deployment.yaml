# The controller Deployment of a Helm-installed cert-manager, as a GitOps
# repo would hold it after `helm template`: Helm release annotations,
# recommended labels, and the pinned controller image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: cert-manager
    app.kubernetes.io/version: v1.17.0
  annotations:
    meta.helm.sh/release-name: cert-manager
    meta.helm.sh/release-namespace: cert-manager
    helm.sh/chart: cert-manager-v1.17.0
spec:
  template:
    spec:
      serviceAccountName: cert-manager
      containers:
        - name: cert-manager
          image: quay.io/jetstack/cert-manager-controller:v1.17.0
