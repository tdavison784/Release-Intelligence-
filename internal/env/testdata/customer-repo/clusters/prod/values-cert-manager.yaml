# Production customer overrides for cert-manager. The keys line up with the
# recorded v1.17.0 -> v1.18.0 edge used by the impact e2e:
#   prometheus.servicemonitor.targetPort  default changed (9402 -> "http-metrics")
#   global.rbac.disableHTTPChallengesRole new value in v1.18.0
prometheus:
  servicemonitor:
    enabled: true
    targetPort: 9402
global:
  rbac:
    disableHTTPChallengesRole: true
